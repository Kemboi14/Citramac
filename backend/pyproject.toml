[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
  \.venv
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "migrations"]
known_first_party = ["apps", "config"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "B"]
# E501: black owns line length (pyproject [tool.black]); the long lines it leaves
# are user-facing strings and comments it deliberately does not split.
# I: import order is enforced by isort (its own CI step) — ruff's sorter orders
# aliased imports differently, so enabling both made them fail each other.
ignore = ["E501"]

[tool.bandit]
exclude_dirs = [".venv", "migrations"]
# Hardcoded-looking passwords in tests.py are fixture data, not real secrets —
# excluded via the `-x` flag on the actual bandit invocation (pre-commit, CI)
# rather than here, since exclude_dirs doesn't reliably glob-match filenames.

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f6f5; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f5; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#ffffff; border-radius:10px; overflow:hidden; border:1px solid #e3e8e6;">
            <tr>
              <td align="center" style="background-color:#2e705f; padding:24px 32px;">
                <span style="color:#ffffff; font-size:20px; font-weight:700; letter-spacing:2px;">CITRAMAC</span>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:32px 32px 8px;">
                <p style="margin:0; color:#1f2933; font-size:18px; font-weight:600; line-height:1.4;">{{ intro }}</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:20px 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
                  <tr>
                    <td align="center" style="padding:18px 34px; background-color:#eef5f2; border:1px solid #c9ddd5; border-radius:12px;">
                      <span style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace; font-size:38px; font-weight:700; letter-spacing:12px; color:#1e4f42; line-height:1.1;">{{ code }}</span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:4px 40px 30px;">
                <p style="margin:0 0 8px; color:#52606d; font-size:14px; line-height:1.6;">This code expires in {{ expires_minutes }} minutes and can only be used once.</p>
                <p style="margin:0; color:#9aa5b1; font-size:13px; line-height:1.6;">If you didn't request this, you can safely ignore this email.</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:16px 32px 22px; border-top:3px solid #d07428;">
                <p style="margin:0; color:#9aa5b1; font-size:12px; line-height:1.5;">Sent by CITRAMAC &mdash; please don't reply to this automated message.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

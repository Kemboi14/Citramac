<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CITRAMAC — Inpatient & Outpatient System</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23006e51'/%3E%3Cpath d='M9 3h6v6h6v6h-6v6H9v-6H3V9h6z' fill='white'/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --brand: #006e51;
  --accent: #00503a;
  --accent-soft: #e9f6f0;
  --accent-line: #b9dccf;
  --primary-soft: #e9f6f0;
  --ground: #f5f8f7;
  --line: #dce7e2;
  --line-2: #edf2ef;
  --ink: #13231f;
  --ink-2: #30453e;
  --muted: #667871;
  --faint: #8fa89f;
  --focus: #006e51;
  --surface: #ffffff;
  --surface-2: #f0f5f3;
  --surface-3: #e4ede9;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.1), 0 2px 6px rgba(0,0,0,.06);
  --radius: 12px;
  --radius-sm: 8px;
  --emergency: #b42318;
  --emergency-bg: #fde8e6;
  --urgent: #b54708;
  --urgent-bg: #fff0e5;
  --priority: #006e51;
  --priority-bg: #e9f6f0;
  --triage-yellow: #8a6100;
  --triage-yellow-bg: #fff6cc;
  --routine: #18794e;
  --routine-bg: #e8f5ed;
  --nav: #00503a;
  --nav-ink: #d8eee5;
  --nav-hover: rgba(255,255,255,.09);
  --nav-active: #eafaf4;
  --hdr: #00503a;
  --hdr-ink: #ffffff;
  --hdr-2: rgba(255,255,255,.08);
  --hdr-line: rgba(255,255,255,.12);
  --hdr-muted: #b7dccb;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --brand: #36b795;
  --accent: #123d32;
  --accent-soft: #173a31;
  --accent-line: #285c4c;
  --primary-soft: #173a31;
  --ground: #111b19;
  --line: #30413c;
  --line-2: #263630;
  --ink: #e6efeb;
  --ink-2: #c5d4ce;
  --muted: #a7b8b1;
  --faint: #82978e;
  --focus: #56c9a5;
  --surface: #192521;
  --surface-2: #202e29;
  --surface-3: #293a34;
  --shadow: 0 1px 3px rgba(0,0,0,.24), 0 1px 2px rgba(0,0,0,.2);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.24);
  --emergency: #f07169;
  --emergency-bg: #3c2422;
  --urgent: #f0a257;
  --urgent-bg: #3d3022;
  --priority: #d9bd64;
  --priority-bg: #39341f;
  --triage-yellow: #dfc267;
  --triage-yellow-bg: #39341f;
  --routine: #67c990;
  --routine-bg: #1b3829;
  --nav: #102d25;
  --nav-ink: #d8eee5;
  --nav-hover: rgba(255,255,255,.09);
  --nav-active: #24483b;
  --hdr: #102d25;
  --hdr-ink: #ffffff;
  --hdr-2: rgba(255,255,255,.08);
  --hdr-line: rgba(255,255,255,.12);
  --hdr-muted: #b7dccb;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Inter, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--ground);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5, h6 {
  font-family: Lexend, "Trebuchet MS", sans-serif;
}

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ── Layout ── */
.app-shell {
  display: flex;
  min-height: 100vh;
}

/* ── Sidebar ── */
.sidenav {
  width: 260px;
  background: linear-gradient(180deg, #00503a, #003f2e);
  color: var(--nav-ink);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  transition: width .2s;
}

.sidenav.rail { width: 68px; min-width: 68px; flex-basis: 68px; }
.sidenav.rail .nav-label,
.sidenav.rail .nav-section,
.sidenav.rail .nav-badge,
.sidenav.rail .nav-user-info { display: none; }
.sidenav.rail .nav-item { justify-content: center; padding: 10px 0; }
.sidenav.rail .nav-item .nav-icon { margin: 0; }
.sidenav.rail .nav-group-label,
.sidenav.rail .nav-chevron,
.sidenav.rail .nav-submenu { display: none; }
.sidenav.rail .nav-group-label,
.sidenav.rail .nav-chevron,
.sidenav.rail .nav-submenu { display: none; }

.nav-brand {
  padding: 16px 18px;
  border-bottom: 1px solid var(--hdr-line);
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-brand-icon {
  width: 36px; height: 36px;
  border-radius: 9px;
  background: var(--brand);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
}

.nav-brand-text {
  font-family: Lexend, sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  letter-spacing: .04em;
}

.nav-brand-sub {
  font-size: 10px;
  color: var(--hdr-muted);
  letter-spacing: .06em;
  text-transform: uppercase;
}

.nav-section {
  padding: 12px 18px 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: #8fc9b3;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 18px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--nav-ink);
  text-decoration: none;
  border-radius: 8px;
  margin: 1px 8px;
  transition: background .15s;
  cursor: pointer;
  border: none;
  background: transparent;
  width: calc(100% - 16px);
  text-align: left;
}

.nav-item:hover { background: var(--nav-hover); color: #fff; }
.nav-item.active { background: var(--nav-active); color: var(--nav); font-weight: 700; }

.nav-group-trigger { justify-content: flex-start; }
.nav-group-label { flex: 1; }
.nav-chevron {
  width: 14px;
  height: 14px;
  transition: transform .15s;
}
.nav-group-trigger[aria-expanded="true"] .nav-chevron { transform: rotate(180deg); }
.nav-group-trigger[aria-expanded="true"] .nav-chevron-right { transform: rotate(90deg); }
.nav-submenu { padding: 2px 0 4px; }
.nav-submenu[hidden] { display: none; }
.nav-submenu .nav-item {
  min-height: 34px;
  padding: 7px 12px 7px 38px;
  font-size: 12px;
}

.nav-group-trigger { justify-content: flex-start; }
.nav-group-label { flex: 1; }
.nav-chevron {
  width: 14px;
  height: 14px;
  transition: transform .15s;
}
.nav-group-trigger[aria-expanded="true"] .nav-chevron { transform: rotate(180deg); }
.nav-submenu { padding: 2px 0 4px; }
.nav-submenu[hidden] { display: none; }
.nav-submenu .nav-item {
  min-height: 34px;
  padding: 7px 12px 7px 38px;
  font-size: 12px;
}

.nav-icon {
  width: 18px; height: 18px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
}

.nav-icon svg { width: 16px; height: 16px; }

.nav-badge {
  margin-left: auto;
  background: var(--emergency);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 999px;
}

.nav-user {
  margin-top: auto;
  padding: 12px 18px;
  border-top: 1px solid var(--hdr-line);
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-user-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--brand);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 12px;
  flex-shrink: 0;
}

.nav-user-info { flex: 1; min-width: 0; }
.nav-user-name { font-size: 12px; font-weight: 600; color: #fff; }
.nav-user-role { font-size: 10px; color: var(--hdr-muted); }

/* ── Main ── */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* ── Topbar ── */
.topbar {
  height: 56px;
  background: var(--hdr);
  color: var(--hdr-ink);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  position: sticky;
  top: 0;
  z-index: 40;
  border-bottom: 1px solid var(--hdr-line);
}

.topbar-btn {
  width: 36px; height: 36px;
  border-radius: 8px;
  border: 1px solid var(--hdr-line);
  background: var(--hdr-2);
  color: var(--hdr-ink);
  display: grid;
  place-items: center;
  transition: background .15s;
}

.topbar-btn:hover { background: rgba(255,255,255,.15); }
.topbar-btn svg { width: 17px; height: 17px; }

.topbar-title {
  font-family: Lexend, sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-search {
  height: 36px;
  border-radius: 8px;
  border: 1px solid var(--hdr-line);
  background: var(--hdr-2);
  color: var(--hdr-ink);
  padding: 0 12px;
  font-size: 12.5px;
  width: 240px;
  outline: none;
}

.topbar-search::placeholder { color: var(--hdr-muted); }
.topbar-search:focus { border-color: #8fd9bd; background: rgba(255,255,255,.12); }

@media (max-width: 700px) {
  .topbar { gap: 8px; padding: 0 10px; }
  .topbar-search { width: min(180px, 30vw); }
}

@media (max-width: 480px) {
  .topbar-search { display: none; }
}

/* ── Content ── */
.content {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
}

.reference-workflow-frame {
  display: block;
  width: 100%;
  min-height: 760px;
  height: calc(100vh - 250px);
  border: 0;
  border-radius: 0;
  background: transparent;
}

@media (max-width: 700px) {
  .reference-workflow-frame {
    min-height: 680px;
    height: calc(100vh - 220px);
  }
}

/* ── Page Header ── */
.page-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.page-title {
  font-size: 20px;
  font-weight: 600;
  color: var(--ink);
}

.page-subtitle {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 2px;
}

/* ── Cards ── */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.card-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--line-2);
  font-weight: 700;
  font-size: 13px;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.card-body { padding: 18px; }

/* ── Grid ── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

@media (max-width: 1024px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 640px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

/* ── Psychiatric interventions ── */
.psychiatric-interventions { margin-top: 20px; }
.intervention-eyebrow { color: var(--brand); font-size: 11px; font-weight: 700; letter-spacing: .35px; }
.intervention-lede { max-width: 640px; margin: 4px 0 18px; color: var(--muted); font-size: 12.5px; }
.intervention-section-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin: 20px 0 8px; }
.intervention-section-head b { color: var(--muted); font-size: 11px; letter-spacing: .4px; text-transform: uppercase; }
.intervention-section-head .intervention-hint { margin-left: 8px; color: var(--faint); font-size: 12px; }
.intervention-actions-table { overflow-x: auto; }
.intervention-actions-table .data-table { min-width: 600px; }
.intervention-actions-table td { vertical-align: middle; }
.intervention-action-meta { margin-top: 2px; color: var(--muted); font-size: 11px; }
.intervention-scope { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); }
.intervention-scope button { border: 0; border-radius: 7px; background: transparent; color: var(--muted); padding: 5px 9px; font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; }
.intervention-scope button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.intervention-list { padding: 0; }
.intervention-list .grp { padding: 9px 16px 5px; font-size: 10px; }
.intervention-module { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line-2); background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
.intervention-module:last-child { border-bottom: 0; }
.intervention-module:hover { background: var(--surface-2); }
.intervention-module-icon { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 9px; background: var(--surface-3); color: var(--brand); font-weight: 700; }
.intervention-module-copy { min-width: 0; flex: 1; }
.intervention-module-title { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-weight: 700; }
.intervention-module-meta { margin-top: 2px; color: var(--muted); font-size: 12px; }
.intervention-recommended { color: var(--brand); background: var(--priority-bg); border-radius: 20px; padding: 2px 7px; font-size: 10px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; }
.intervention-delivered { color: var(--brand); background: var(--priority-bg); border: 0; border-radius: 20px; padding: 4px 9px; font-size: 10px; font-weight: 600; white-space: nowrap; }
.intervention-empty { color: var(--muted); padding: 16px; font-size: 12px; }
.intervention-record-overlay { position: fixed; inset: 0; z-index: 400; display: flex; justify-content: center; overflow: auto; background: var(--ground); }
.intervention-record-overlay[hidden] { display: none; }
.intervention-drawer { display: flex; flex-direction: column; width: 100%; min-height: 100%; background: var(--surface); }
.intervention-drawer-head { display: flex; align-items: center; gap: 12px; padding: 18px clamp(18px, 4vw, 48px); border-bottom: 1px solid var(--line); }
.intervention-drawer-head h2 { font-size: 18px; }
.intervention-drawer-head p { margin-top: 3px; color: var(--muted); font-size: 12px; }
.intervention-context .ctx { margin: 0 0 6px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.intervention-context .ctx summary { display: flex; align-items: center; gap: 8px; min-height: 38px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .35px; text-transform: uppercase; cursor: pointer; }
.intervention-context .ctx summary span { color: var(--faint); font-size: 11px; font-weight: 400; letter-spacing: 0; text-transform: none; }
.intervention-context .cr { display: grid; grid-template-columns: 82px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line-2); font-size: 12px; }
.intervention-context .cr .k { color: var(--muted); font-weight: 600; }
.intervention-drawer-head .intervention-module-icon { width: 42px; height: 42px; }
.intervention-drawer-head .intervention-module-copy { padding-top: 1px; }
.intervention-drawer-head .intervention-module-title h2 { font-size: 15px; }
.intervention-drawer-head .intervention-module-title { gap: 8px; }
.intervention-drawer-head .intervention-module-meta { margin-top: 3px; }
.intervention-drawer-close { margin-left: auto; min-width: 36px; min-height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 24px; cursor: pointer; }
.intervention-drawer-close:hover { background: var(--surface-2); }
.intervention-drawer-tabs { display: flex; gap: 2px; padding: 0 clamp(18px, 4vw, 48px); border-bottom: 1px solid var(--line); }
.intervention-drawer-tabs button { min-height: 40px; padding: 9px 12px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.intervention-drawer-tabs button[aria-selected="true"] { border-bottom-color: var(--brand); color: var(--brand); }
.intervention-drawer-secondary { flex: 1; overflow: auto; padding: 24px clamp(18px, 4vw, 48px); }
.intervention-drawer-secondary[hidden] { display: none; }
.intervention-drawer-secondary .card { margin-bottom: 12px; }
.intervention-drawer-secondary .card-body { font-size: 13px; }
.intervention-form { width: min(100%, 1120px); flex: 1; align-self: center; overflow-y: auto; padding: 24px clamp(18px, 4vw, 48px) 32px; }
.intervention-context { margin-bottom: 14px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 12px; }
.intervention-context p + p { margin-top: 4px; }
.intervention-form .field { margin-top: 12px; }
.intervention-form .field textarea { resize: vertical; }
.intervention-form details.more { margin: 14px 0 4px; padding: 8px 12px; border: 1px dashed var(--line); border-radius: 8px; }
.intervention-form details.more summary { display: flex; align-items: center; min-height: 28px; color: var(--brand); font-size: 12px; font-weight: 600; cursor: pointer; }
.intervention-form details.more .g { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.intervention-form .chk { display: flex; align-items: center; gap: 8px; margin-top: 28px; color: var(--muted); font-size: 12px; }
.intervention-form .chk input { width: auto; min-height: 0; }
.intervention-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.intervention-chips button { min-height: 30px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); color: var(--ink); font: inherit; font-size: 11px; cursor: pointer; }
.intervention-chips button[aria-pressed="true"] { border-color: var(--brand); background: var(--priority-bg); color: var(--brand); font-weight: 600; }
.intervention-option-select { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
.intervention-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.intervention-form-actions { position: sticky; bottom: -32px; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 16px calc(-1 * clamp(18px, 4vw, 48px)) -32px; padding: 12px clamp(18px, 4vw, 48px); border-top: 1px solid var(--line); background: var(--surface); }
.intervention-live { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
.intervention-live:empty { display: none; }
.intervention-live.error { color: var(--emergency); }
@media (max-width: 520px) { .intervention-form-grid { grid-template-columns: 1fr; gap: 0; } }

/* ── Stat Cards ── */
.stat-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
}

.stat-value {
  font-size: 28px;
  font-weight: 800;
  color: var(--ink);
  font-family: Lexend, sans-serif;
}

.stat-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .4px;
  margin-top: 2px;
}

.stat-change {
  font-size: 11.5px;
  margin-top: 6px;
  font-weight: 500;
}

.dashboard-quick-access { margin-bottom: 24px; }
.dashboard-quick-heading { margin-bottom: 11px; }
.dashboard-quick-heading h2 { margin: 0; font-size: 15px; font-weight: 700; color: var(--ink); }
.dashboard-quick-heading p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
.dashboard-quick-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 10px;
}
.dashboard-quick-link {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: border-color .15s, background .15s, box-shadow .15s, transform .15s;
}
.dashboard-quick-link:hover {
  border-color: color-mix(in srgb, var(--brand) 38%, var(--line));
  background: var(--surface-2);
  box-shadow: var(--shadow);
  transform: translateY(-1px);
}
.dashboard-quick-link:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.dashboard-quick-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  border-radius: 11px;
  background: var(--primary-soft);
  color: var(--brand);
}
.dashboard-quick-icon svg { width: 19px; height: 19px; }
.dashboard-quick-copy { display: grid; gap: 3px; min-width: 0; }

/* ── Queue Cards ── */
.qgrid {

.qcard {

}

.qcard::before {
  content: "";

  border-radius: var(--radius) 0 0 var(--radius);

}

.qcard.stripe-RED { --pc: var(--emergency); }
.qcard.stripe-ORANGE { --pc: var(--urgent); }
.qcard.stripe-YELLOW { --pc: var(--triage-yellow); }
.qcard.stripe-GREEN { --pc: var(--routine); }

.qrank {
  font-family: ui-monospace, monospace;
  font-size: 12px;
  color: var(--faint);
  width: 20px;
  text-align: center;
}

.qname {

.pill.pri-RED { color: var(--emergency); background: var(--emergency-bg); }
.pill.pri-ORANGE { color: var(--urgent); background: var(--urgent-bg); }
.pill.pri-YELLOW { color: var(--triage-yellow); background: var(--triage-yellow-bg); }
.pill.pri-GREEN { color: var(--routine); background: var(--routine-bg); }

.tag {

/* ── Buttons ── */
.btn {

}

/* ── Forms ── */

/* ── Tables ── */

  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  background: var(--surface);
  color: var(--ink);
  font: inherit;
}
.recheck-fields .field label,
.recheck-observation > label { color: var(--ink); font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; }
.recheck-observations-heading { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin: 20px 0 10px; font-size: 13px; }
.recheck-observations-heading span { color: var(--muted); font-size: 12px; }
.recheck-observation-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.recheck-observation { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 10px; border: 1px solid var(--line-2); border-radius: 8px; }
.recheck-reading { display: flex; align-items: center; gap: 8px; }
.recheck-unit { flex: 0 0 auto; color: var(--muted); font-size: 11px; }
.recheck-bp-inputs { display: flex; align-items: center; gap: 6px; }
.recheck-bp-inputs input { width: 72px; }
.recheck-bp-inputs > span:not(.recheck-unit) { color: var(--muted); }
.recheck-observation select { font-size: 11px; }
.recheck-note-field { margin-top: 14px; }
.recheck-actionbar { margin-top: 0; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 6px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.tab {
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  padding: 9px 12px;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  cursor: pointer;
  transition: color .15s;
}

.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); border-bottom-color: var(--brand); }

/* ── Stepper ── */
.stepper {
  display: flex;
  gap: 0;
  overflow-x: auto;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 6px;
  margin-bottom: 16px;
  scrollbar-width: thin;
}

.step {
  flex: 1 0 auto;
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 9px 14px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 9px;
  white-space: nowrap;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}

.step:hover { background: var(--surface-3); }

.step[aria-current="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
}

.step .n {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  display: grid;
  place-items: center;
  font-family: ui-monospace, monospace;
  font-size: 11px;
  flex-shrink: 0;
  color: var(--muted);
}

.step[aria-current="true"] .n {
  border-color: var(--brand);
  color: var(--brand);
}

.step.done .n {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}

.step.locked { opacity: .5; cursor: not-allowed; }

/* ── Banner ── */
.banner-meta {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 8px 18px;
  padding: 0 18px 12px;
}

.banner-meta .bmeta .lbl {
  display: block;
  font-family: ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--faint);
  margin-bottom: 2px;
}

.banner-meta .bmeta .val {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink);
}

.banner {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  overflow: hidden;
}

.banner-top {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 16px 18px;
  flex-wrap: wrap;
}

.avatar {
  width: 44px; height: 44px;
  border-radius: 11px;
  background: var(--primary-soft);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 15px;
  flex-shrink: 0;
}

.pt-id {
  font-family: ui-monospace, monospace;
  font-size: 11px;
  color: var(--muted);
}

.pt-name {
  font-weight: 700;
  font-size: 16px;
}

.pt-demo {
  color: var(--muted);
  font-size: 12px;
  margin-top: 1px;
}

.banner-flags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 0 18px 14px;
  align-items: center;
}

.banner-flags .lbl {
  font-family: ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--faint);
  margin-right: 2px;
}

.banner.client-safety-banner {
  position: sticky;
  top: 0;
  z-index: 30;
  color: var(--ink);
  background: linear-gradient(180deg, #ffffff, #fafbfd);
  border: 0;
  border-bottom: 1px solid #e2e8f0;
  margin-bottom: 16px;
  border-radius: 0;
  box-shadow: 0 20px 40px -24px rgba(15,27,45,.28);
  container-type: inline-size;
  overflow: visible;
}
.banner.client-safety-banner::before {
  position: absolute;
  inset: 0;
  background: radial-gradient(700px 150px at 10% 0, rgba(25,165,171,.10), transparent 70%);
  content: "";
  pointer-events: none;
}
.client-banner-grid {
  position: relative;
  display: grid;
  grid-template-columns: minmax(250px, 1.1fr) minmax(300px, 1.8fr) minmax(200px, .9fr) minmax(210px, 1fr);
  align-items: stretch;
  max-width: 1360px;
  margin: 0 auto;
}
.client-banner-cell {
  min-width: 0;
  padding: 14px 20px;
}
.client-banner-cell + .client-banner-cell {
  border-left: 1px solid #e2e8f0;
}
.client-banner-identity {
  display: flex;
  align-items: center;
  gap: 14px;
}
.client-banner-avatar {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  border: 0;
  border-radius: 15px;
  background: linear-gradient(135deg, #7debe4, #19a5ab 60%, #0e6f73);
  color: #06303a;
  font-size: 16px;
  font-weight: 800;
  box-shadow: 0 8px 18px -6px rgba(25,165,171,.5), inset 0 0 0 1px rgba(255,255,255,.5);
}
.client-banner-avatar.temporary {
  color: #4a586b;
  background: linear-gradient(135deg, #e6eaf1, #d3dae5);
  box-shadow: inset 0 0 0 1px #c9d2df;
}
.client-banner-copy { min-width: 0; }
.client-banner-name {
  color: #0f1b2d;
  font-family: Lexend, Inter, sans-serif;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -.4px;
  line-height: 1.15;
  overflow-wrap: anywhere;
}
.client-banner-name .tag {
  display: inline-block;
  margin-left: 5px;
  padding: 1px 7px;
  border: 1px solid #f0ce8a;
  border-radius: 6px;
  background: #fff4de;
  color: #a15c00;
  font-size: 10px;
  vertical-align: 3px;
}
.client-banner-identifiers {
  display: flex;
  flex-wrap: wrap;
  gap: 3px 7px;
  margin-top: 4px;
  color: #0e6f73;
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.client-banner-identifiers span + span::before {
  content: "·";
  margin-right: 7px;
  color: #7a8799;
}
.client-banner-demographics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 9px;
}
.client-banner-demographics span {
  display: inline-flex;
  align-items: center;
  min-height: 25px;
  padding: 3px 10px;
  border: 1px solid #e0e6ef;
  border-radius: 999px;
  background: #f3f5f9;
  color: #3d4b5f;
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1.3;
}
.client-banner-label {
  margin-bottom: 7px;
  color: #7a8799;
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1.3;
}
.client-banner-allergy {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-self: center;
  justify-self: stretch;
  width: 100%;
  max-width: 100%;
  min-height: 0;
  padding: 12px 15px;
  border: 1px solid #dce2ea;
  border-radius: 14px;
  background: #f4f6fa;
  gap: 8px;
}
.client-banner-allergy[data-state="known"] {
  border-color: #e5372b;
  background: #fff3f1;
  box-shadow: none;
}
.client-banner-allergy[data-state="none"] {
  border-color: #8fd3b0;
  background: linear-gradient(135deg, #edf9f2, #e1f4ea);
}
.client-banner-allergy[data-state="unknown"] {
  border-color: #d98e00;
  background: repeating-linear-gradient(135deg, #fff4de 0 10px, #ffebc2 10px 20px);
}
.client-banner-allergy-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 0;
  color: #c8281e;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .3px;
}
.client-banner-allergy[data-state="known"] .client-banner-allergy-title { color: #c8281e; }
.client-banner-allergy[data-state="none"] .client-banner-allergy-title { color: #127a4b; }
.client-banner-allergy[data-state="unknown"] .client-banner-allergy-title { color: #8a5200; font-size: 11.5px; letter-spacing: .1px; }
.client-banner-allergy-title svg,
.client-banner-alerts svg { width: 15px; height: 15px; flex: none; }
.client-banner-allergy-items,
.client-banner-alert-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.client-banner-allergy-note {
  color: #526174;
  font-size: 12px;
  font-weight: 600;
}
.client-banner-allergy[data-state="none"] .client-banner-allergy-note { color: #3b7555; }
.client-banner-allergy[data-state="unknown"] .client-banner-allergy-note { color: #80500a; }
.client-banner-allergy-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  max-width: 100%;
  padding: 3px 9px;
  border: 1px solid #f2b8b3;
  border-radius: 8px;
  background: #fff;
  color: #0f1b2d;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.client-banner-allergy[data-state="known"] .client-banner-allergy-item strong { color: #c8281e; }
.client-banner-allergy[data-state="none"] .client-banner-allergy-item { border-color: #b8e2c9; }
.client-banner-allergy[data-state="unknown"] .client-banner-allergy-item { border-color: #e7bc69; }
.client-banner-priority {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  width: fit-content;
  max-width: 100%;
  padding: 5px 12px 5px 7px;
  border: 1px solid transparent;
  border-radius: 11px;
  font-size: 13px;
  font-weight: 800;
  line-height: 1.35;
  color: #fff;
  box-shadow: 0 8px 20px -8px currentColor, inset 0 0 0 1px rgba(255,255,255,.25);
}
.client-banner-priority::before {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,.9);
  content: "";
  flex: none;
  box-shadow: 0 0 0 4px rgba(255,255,255,.16);
}
.client-banner-priority.pri-RED { background: #c8281e; }
.client-banner-priority.pri-ORANGE { background: #d9570f; }
.client-banner-priority.pri-YELLOW { background: #a15c00; }
.client-banner-priority.pri-GREEN { background: #127a4b; }
.client-banner-setting-cell .tag {
  display: inline-flex;
  padding: 5px 10px;
  border-radius: 9px;
  background: #f3f5f9;
  color: #4a586b;
  font-size: 12px;
  font-weight: 650;
}
.client-banner-setting {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  color: #0f1b2d;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.client-banner-setting .setting-dot {
  width: 8px;
  height: 8px;
  flex: none;
  margin-top: 5px;
  border-radius: 50%;
  background: #1fa866;
  box-shadow: 0 0 0 4px #d2f0e0;
}
.client-banner-setting.outpatient .setting-dot { background: #0e6f73; box-shadow: 0 0 0 4px #d9eeee; }
.client-banner-stack > div + div { margin-top: 14px; }
.client-banner-alerts { min-width: 0; }
.client-banner-alert {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  padding: 4px 10px;
  border: 1px solid #f5c9aa;
  border-radius: 9px;
  background: #fff1e8;
  color: #9a3b07;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.client-banner-no-alerts {
  color: #7a8799;
  font-size: 12px;
  font-weight: 600;
}
.client-banner-team {
  color: #0f1b2d;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
@container (max-width: 950px) {
  .client-banner-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .client-banner-cell:nth-child(2n) { border-right: 0; }
  .client-banner-cell:nth-child(n+3) { border-top: 1px solid #e2e8f0; }
  .client-banner-cell:nth-child(3) { border-left: 0; }
  .client-banner-allergy-cell { border-right: 0; }
}
@container (max-width: 570px) {
  .client-banner-grid { grid-template-columns: minmax(0, 1fr); }
  .client-banner-cell { padding: 14px 15px; }
  .client-banner-cell + .client-banner-cell,
  .client-banner-cell:nth-child(3) { border-left: 0; border-top: 1px solid var(--line-2); }
  .client-banner-cell:nth-child(2n) { border-right: 0; }
  .client-banner-allergy-cell { grid-column: auto; }
  .client-banner-name { font-size: 16px; }
  .client-banner-allergy { min-height: 0; }
}
:root[data-theme="dark"] .banner.client-safety-banner {
  color: var(--ink);
  background: linear-gradient(180deg, var(--surface), var(--ground));
  border-bottom-color: var(--line);
}
:root[data-theme="dark"] .banner.client-safety-banner::before {
  background: radial-gradient(700px 150px at 10% 0, color-mix(in srgb, var(--brand) 15%, transparent), transparent 70%);
}
:root[data-theme="dark"] .client-banner-cell + .client-banner-cell,
:root[data-theme="dark"] .client-banner-cell:nth-child(n+3) { border-color: var(--line-2); }
:root[data-theme="dark"] .client-banner-name,
:root[data-theme="dark"] .client-banner-setting,
:root[data-theme="dark"] .client-banner-team { color: var(--ink); }
:root[data-theme="dark"] .client-banner-identifiers { color: var(--brand); }
:root[data-theme="dark"] .client-banner-label,
:root[data-theme="dark"] .client-banner-no-alerts { color: var(--muted); }
:root[data-theme="dark"] .client-banner-demographics span,
:root[data-theme="dark"] .client-banner-setting-cell .tag { border-color: var(--line); background: var(--surface-2); color: var(--ink-2); }
:root[data-theme="dark"] .client-banner-allergy { border-color: var(--line); background: var(--surface-2); }
:root[data-theme="dark"] .client-banner-allergy[data-state="known"] { border-color: var(--emergency); background: var(--emergency-bg); }
:root[data-theme="dark"] .client-banner-allergy[data-state="none"] { border-color: var(--routine); background: var(--routine-bg); }
:root[data-theme="dark"] .client-banner-allergy[data-state="unknown"] { border-color: var(--urgent); background: var(--urgent-bg); }
:root[data-theme="dark"] .client-banner-allergy[data-state="known"] .client-banner-allergy-title,
:root[data-theme="dark"] .client-banner-allergy[data-state="known"] .client-banner-allergy-item strong { color: var(--emergency); }
:root[data-theme="dark"] .client-banner-allergy[data-state="none"] .client-banner-allergy-title,
:root[data-theme="dark"] .client-banner-allergy[data-state="none"] .client-banner-allergy-note { color: var(--routine); }
:root[data-theme="dark"] .client-banner-allergy[data-state="unknown"] .client-banner-allergy-title,
:root[data-theme="dark"] .client-banner-allergy[data-state="unknown"] .client-banner-allergy-note { color: var(--urgent); }
:root[data-theme="dark"] .client-banner-allergy-note { color: var(--ink-2); }
:root[data-theme="dark"] .client-banner-allergy-item { border-color: var(--line); background: var(--surface); color: var(--ink); }
:root[data-theme="dark"] .client-banner-alert { border-color: var(--line); background: var(--urgent-bg); color: var(--urgent); }
:root[data-theme="dark"] .client-banner-avatar { color: var(--accent); background: linear-gradient(145deg, var(--primary-soft), var(--surface-2)); box-shadow: none; }

/* ── Callout ── */
.callout {
  display: flex;
  gap: 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  margin-top: 16px;
  font-size: 12.5px;
  color: var(--ink);
}

.callout svg {
  width: 16px; height: 16px;
  flex-shrink: 0;
  color: var(--brand);
  margin-top: 1px;
}

.callout b { color: var(--ink); }
.callout.alert-success {
  background: var(--priority-bg);
  border-color: color-mix(in srgb, var(--brand) 24%, var(--line));
  color: var(--accent);
}
#triage-sign-status[hidden] { display: none; }

/* ── Timeline ── */
.timeline {
  position: relative;
  padding-left: 24px;
}

.timeline::before {
  content: "";
  position: absolute;
  left: 8px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--line);
}

.timeline-item {
  position: relative;
  padding-bottom: 18px;
}

.timeline-item:last-child { padding-bottom: 0; }

.timeline-item::before {
  content: "";
  position: absolute;
  left: -20px;
  top: 4px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--brand);
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 2px var(--brand);
}

.timeline-time {
  font-size: 11px;
  color: var(--faint);
  font-weight: 600;
  font-family: ui-monospace, monospace;
}

.timeline-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
}

.timeline-desc {
  font-size: 12px;
  color: var(--muted);
}

/* ── Layout 2-col ── */
.layout2 {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 16px;
  align-items: start;
}

@media (max-width: 800px) {
  .layout2 { grid-template-columns: 1fr; }
}

/* ── Panel ── */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  position: sticky;
  top: 80px;
}

.panel-h {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line-2);
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--ink);
}

.panel-h svg {
  width: 15px; height: 15px;
  color: var(--brand);
}

.panel-note {
  font-size: 11.5px;
  color: var(--muted);
  padding: 10px 14px 4px;
}

/* ── Vitals ── */
.vitals {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

@media (max-width: 560px) {
  .vitals { grid-template-columns: repeat(2, 1fr); }
}

.vital {
  text-align: center;
}

.vital label {
  font-size: 10px;
  display: block;
}

.vital input {
  font-family: ui-monospace, monospace;
  text-align: center;
}

/* ── Ward Grid ── */
.ward-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

@media (max-width: 768px) {
  .ward-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 480px) {
  .ward-grid { grid-template-columns: repeat(2, 1fr); }
}

.bed-card {
  background: var(--surface);
  border-radius: var(--radius-sm);
  border: 2px solid var(--line);
  padding: 12px 8px;
  text-align: center;
  transition: border-color .15s;
}

.bed-card:hover { border-color: var(--brand); }
.bed-card.occupied { border-color: var(--brand); background: var(--primary-soft); }
.bed-card.reserved { border-color: var(--urgent); background: var(--urgent-bg); }
.bed-card.available { border-color: var(--line); }

.bed-num {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
}

.bed-status {
  font-size: 12px;
  font-weight: 600;
  margin-top: 4px;
}

.bed-patient {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

/* ── Med Items ── */
.med-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line-2);
}

.med-item:last-child { border-bottom: none; }

.med-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--primary-soft);
  color: var(--brand);
  display: grid;
  place-items: center;
  font-size: 16px;
  flex-shrink: 0;
}

.med-info { flex: 1; }
.med-name { font-size: 13px; font-weight: 600; }
.med-dose { font-size: 12px; color: var(--muted); }

/* ── Note Card ── */
.note-card {
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 8px;
}

.note-card:last-child { margin-bottom: 0; }

.note-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}

.note-author {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
}

.note-time {
  font-size: 11px;
  color: var(--faint);
  font-family: ui-monospace, monospace;
}

.note-text {
  font-size: 12.5px;
  color: var(--muted);
}

/* ── Checkbox ── */
.checkbox-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  font-size: 13px;
  cursor: pointer;
}

.checkbox-item input {
  appearance: none;
  width: 17px; height: 17px;
  border: 1.5px solid var(--faint);
  border-radius: 5px;
  flex-shrink: 0;
  position: relative;
  cursor: pointer;
  margin: 0;
}

.checkbox-item input:checked {
  background: var(--brand);
  border-color: var(--brand);
}

.checkbox-item input:checked::after {
  content: "";
  position: absolute;
  left: 5px;
  top: 2px;
  width: 4px;
  height: 8px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

/* ── Progress ── */
.progress-bar {
  height: 6px;
  background: var(--surface-3);
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 999px;
  transition: width .3s;
}

.progress-fill.green { background: var(--brand); }
.progress-fill.orange { background: var(--urgent); }
.progress-fill.red { background: var(--emergency); }

/* ── Alert ── */
.alert {
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
}

.alert:last-child { margin-bottom: 0; }

.alert-warning {
  background: var(--urgent-bg);
  border: 1px solid var(--urgent);
  color: #7a4a08;
}

.alert-danger {
  background: var(--emergency-bg);
  border: 1px solid var(--emergency);
  color: #7a1f16;
}

.alert-success {
  background: var(--priority-bg);
  border: 1px solid var(--brand);
  color: var(--accent);
}

/* ── Section Label ── */
.grouplabel {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .4px;
  text-transform: uppercase;
  color: var(--muted);
  margin: 18px 0 9px;
}

/* ── Hidden ── */
.hidden { display: none !important; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--faint); }

/* ── Print ── */
@media print {
  .sidenav, .topbar, .no-print { display: none !important; }
  .content { padding: 0; }
  .card, .banner, .panel { box-shadow: none; border: 1px solid #ccc; }
}

@media (max-width: 900px) {
  .recheck-observation-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

.app-shell.triage-focus { height: 100vh; min-height: 0; overflow: hidden; }
.app-shell.triage-focus .main-area { height: 100%; min-height: 0; }
.app-shell.triage-focus .content { height: calc(100vh - 56px); min-height: 0; padding: 16px 20px; overflow-y: auto; }
.triage-encounter-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; max-width: 1600px; margin: 0 auto; align-items: start; }
.triage-patient-context { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); overflow: hidden; }
.triage-context-block { min-width: 0; padding: 14px 16px; border-right: 1px solid var(--line-2); }
.triage-context-block:last-child { border-right: 0; }
.triage-context-label { margin-bottom: 4px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.triage-context-value { color: var(--ink); font-size: 12px; overflow-wrap: anywhere; }
.triage-context-alert { color: var(--emergency); font-weight: 600; }

.triage-live-summary p { color: var(--muted); font-size: 12px; }
.triage-context-presenting { white-space: pre-wrap; }
.triage-encounter-main .triage-workspace { max-width: none; }
.triage-encounter-main .triage-actionbar { margin-right: -20px; margin-left: -20px; }

@media (max-width: 820px) {

}

@media (max-width: 560px) {

  .triage-context-block { border-right: 0; }
  .triage-context-block + .triage-context-block { border-top: 1px solid var(--line-2); }

/* ── Outcome trends ── */

.outcome-section-title { font-size: 14px; font-weight: 700; }
.outcome-section-subtitle { margin-left: 8px; color: var(--muted); font-size: 12px; font-weight: 400; }
.outcome-overview-grid { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(260px,.85fr); gap: 14px; }

.outcome-overview-card { display: flex; flex-direction: column; justify-content: space-between; gap: 20px; padding: 22px; }

.outcome-overview-label { color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .045em; text-transform: uppercase; }

.outcome-overview-copy { max-width: 62ch; margin-top: 7px; color: var(--muted); font-size: 12.5px; }
.outcome-overview-count { flex: none; min-width: 76px; text-align: right; }
.outcome-overview-count strong { display: block; color: var(--ink); font-family: Lexend,sans-serif; font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.outcome-overview-count span { color: var(--muted); font-size: 11px; }
.outcome-overview-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.outcome-guidance-card { display: flex; flex-direction: column; justify-content: space-between; gap: 18px; padding: 20px; background: var(--surface-2); }
.outcome-guidance-card h3 { font-size: 14px; }
.outcome-guidance-card p { margin-top: 6px; color: var(--muted); font-size: 12px; }
.outcome-guidance-card .outcome-guidance-latest { margin-top: 0; padding-top: 10px; border-top: 1px solid var(--line); }
.outcome-guidance-latest strong { color: var(--ink-2); font-weight: 650; }
.outcome-dashboard-card-head .outcome-section-subtitle { display: block; margin: 3px 0 0; }

.outcome-metric-card { min-width: 0; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }

.outcome-metric-score span { color: var(--muted); font-size: 12px; }
.outcome-metric-band { margin-top: 8px; color: var(--ink-2); font-size: 11.5px; font-weight: 600; }

.outcome-svg { display:block; width:100%; height:auto; min-height:146px; overflow:visible; color:var(--outcome-accent); }

.outcome-status:empty { display:none; }

.outcome-table { width:100%; border-collapse:collapse; font-size:12px; }
.outcome-table th { background:var(--surface-2); color:var(--muted); font-size:10px; letter-spacing:.04em; text-align:left; text-transform:uppercase; }
.outcome-table th,.outcome-table td { padding:10px 12px; border-bottom:1px solid var(--line-2); vertical-align:top; }
.outcome-table tbody tr:last-child td { border-bottom:0; }
.outcome-measure-form-note { margin:0 18px 16px; }
.outcome-latest-table-wrap { overflow-x: auto; }
.outcome-latest-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.outcome-latest-table th { padding: 9px 12px; background: var(--surface-2); color: var(--muted); font-size: 10px; font-weight: 650; letter-spacing: .04em; text-align: left; text-transform: uppercase; white-space: nowrap; }
.outcome-latest-table td { padding: 10px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.outcome-latest-table tr:last-child td { border-bottom: 0; }
.outcome-latest-table .score { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.outcome-dashboard-empty { padding: 24px 18px; color: var(--muted); font-size: 12px; }
@media(max-width:760px){.outcome-form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[character]);
}

function restoreTier1Registrations() {
  try {
    const saved = localStorage.getItem(TIER1_STORAGE_KEY);
    const registrations = saved ? JSON.parse(saved) : [];
    if (!Array.isArray(registrations) || registrations.some(record =>
      !record || typeof record.id !== "string" || typeof record.citramacId !== "string" ||
      typeof record.name !== "string" || typeof record.identityStatus !== "string"
    )) {
      throw new Error("Saved registration data has an invalid format.");
    }
    registrations.forEach(record => {
      const index = CLIENTS.findIndex(client => client.id === record.id);
      if (index >= 0) CLIENTS[index] = { ...CLIENTS[index], ...record };
      else CLIENTS.push(record);
    });
  } catch (error) {
    registrationStorageIssue = "Saved registrations could not be loaded. Existing data was left unchanged.";
    console.error("Unable to restore saved Tier 1 registrations.", error);
  }

  try {
    const saved = localStorage.getItem(TRIAGE_ENCOUNTER_STORAGE_KEY);
    if (!saved) return;
    const encounters = JSON.parse(saved);
    if (!Array.isArray(encounters) || encounters.some(encounter =>
      !encounter || typeof encounter.encounterId !== "string" || typeof encounter.id !== "string"
    )) {
      throw new Error("Saved triage encounter data has an invalid format.");
    }
    let migratedLegacyEncounter = false;
    encounters.slice().reverse().forEach(encounter => {
      const existingIndex = TRIAGE_QUEUE.findIndex(existing => existing.encounterId === encounter.encounterId);
      if (existingIndex >= 0) {
        TRIAGE_QUEUE[existingIndex] = { ...TRIAGE_QUEUE[existingIndex], ...encounter };
        return;
      }
      if (encounter.isNewEncounter && encounter.status === "Waiting") {
        const registeredAt = CLIENTS.find(client => client.id === encounter.id)?.registeredAt;
        const arrivalAt = registeredAt && !Number.isNaN(Date.parse(registeredAt))
          ? new Date(registeredAt)
          : new Date();
        encounter.status = "Awaiting triage";
        encounter.arrivalAt ||= arrivalAt.toISOString();
        encounter.dueAt ||= new Date(arrivalAt.getTime() + 10 * 60 * 1000).toISOString();
        migratedLegacyEncounter = true;
      }
      TRIAGE_QUEUE.unshift(encounter);
    });
    TRIAGE_QUEUE.forEach(encounter => {
      if (!encounter.triageRecord || !encounter.priority) return;
      const client = CLIENTS.find(item => item.id === encounter.id);
      if (client) client.priority = encounter.priority;
    });
    if (migratedLegacyEncounter) saveTriageEncounters();
  } catch (error) {
    registrationStorageIssue = "Some saved triage encounters could not be loaded. Existing client records were left unchanged.";
    console.error("Unable to restore saved triage encounters.", error);
  }
}

function saveTriageEncounters() {

    localStorage.setItem(
      TRIAGE_ENCOUNTER_STORAGE_KEY,

    );
  } catch (error) {
    console.error("Unable to save triage encounters.", error);
    registrationStorageIssue = "This new triage encounter is available for this session, but could not be saved in this browser.";
  }
}

  const root = document.documentElement;
  const nextTheme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  root.dataset.theme = nextTheme;
  const button = document.getElementById('theme-toggle');
  if (button) button.setAttribute('aria-pressed', String(nextTheme === 'dark'));
  syncPatientWorkflowTheme();
}

function syncPatientWorkflowTheme() {
  const frame = document.getElementById('patient-workflow-frame');
  if (!frame?.contentWindow) return;
  const style = getComputedStyle(document.documentElement);
  const theme = Object.fromEntries([
    'ground', 'surface', 'surface-2', 'surface-3', 'ink', 'ink-2', 'muted', 'faint',
    'line', 'line-2', 'brand', 'accent', 'accent-soft', 'focus', 'emergency',
    'emergency-bg', 'urgent', 'urgent-bg', 'priority', 'priority-bg', 'routine',
    'routine-bg', 'shadow'
  ].map(name => [name, style.getPropertyValue(`--${name}`).trim()]));
  theme.mode = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
  frame.contentWindow.postMessage({ type: 'citramac:theme', theme }, '*');
}

function openClient(id) {
  currentClient = CLIENTS.find(c => c.id === id);
  showPage('clinical');
}

function openPsychiatryClient(id) {
  const client = CLIENTS.find(item => item.id === id);
  if (!client) {
    console.error(`Cannot open psychiatry review for client ${id}: the client was not found.`);
    return;
  }
  if (!latestSignedTriage(client.id)) {
    console.error(`Cannot open psychiatry review for client ${id}: no signed triage record was found.`);
    return;
  }
  currentClient = client;
  currentRecordView = 'clinical';
  showPage('patient-record', 'psychiatric');
}

function showPatientRecordView(view) {
  currentRecordView = view === 'journey' ? 'clinical' : view;
  if (currentPage !== 'patient-record') {
    showPage('patient-record', 'psychiatric');
    return;
  }
  renderPatientRecordNavigation();
  sendPatientWorkflowRoute();
}

function openJourneyStage(page) {
  currentRecordView = page;
  showPatientRecordView(page);
}

function patientWorkflowRoute() {
  const routes = {
    snapshot: { view: 'snapshot' },
    timeline: { view: 'timeline' },
    charts: { view: 'charts' },
    legal: { view: 'legal' },
    clinical: { view: 'journey', stage: 2 },
    careplan: { view: 'journey', stage: 3 },
    interventions: { view: 'journey', stage: 4 },
    outcomes: { view: 'journey', stage: 5 },
    billing: { view: 'journey', stage: 6 },
    followup: { view: 'journey', stage: 5, focus: 'followup' }
  };
  return routes[currentRecordView] || routes.clinical;
}

function sendPatientWorkflowRoute() {
  document.getElementById('patient-workflow-frame')?.contentWindow?.postMessage(
    { type: 'citramac:route', route: patientWorkflowRoute() },
    '*'
  );
}

window.addEventListener('message', event => {
  const frame = document.getElementById('patient-workflow-frame');
  if (!frame || event.source !== frame.contentWindow) return;
  const status = document.getElementById('patient-workflow-status');
  if (!status) return;
  if (event.data?.type === 'citramac:workflow-ready' && event.data.patientId === currentClient?.id) {
    status.hidden = true;
  } else if (event.data?.type === 'citramac:workflow-error') {
    status.className = 'callout';
    status.textContent = 'The reference workflow could not open this client. Return to Psychiatry and try again.';
  }
});

function renderPatientRecordNavigation() {
  const host = document.getElementById('patient-record-navigation');
  if (host) host.innerHTML = clientNav(currentRecordView);
}

function patientWorkflowHandoff(client, triage) {
  const priority = { RED: 'Emergency', ORANGE: 'Urgent', YELLOW: 'Priority', GREEN: 'Routine' }[triage.priority];
  if (!priority) return null;
  return {
    type: 'citramac:open-patient',
    route: patientWorkflowRoute(),
    patient: {
      id: client.id,
      name: client.name || '',
      citramacId: client.citramacId || client.id,
      preferredName: client.alias || '',
      pronouns: client.pronouns || '',
      dob: /^\d{4}-\d{2}-\d{2}$/.test(client.dob || '') ? client.dob : '',
      age: client.age,
      sex: client.sex || '',
      setting: client.type || '',
      phone: client.phone || '',
      nok: client.nok || '',
      referral: client.referral || '',
      payer: client.payer || '',
      identityStatus: client.identityStatus || 'identified',
      presenting: triage.presenting || client.presenting || '',
      allergies: client.allergies || '',
      allergyStatus: client.allergyStatus || '',
      priority,
      role: 'psych',
      recommendation: triage.triageRecord.recommendation || '',
      overrideReason: triage.triageRecord.overrideReason || '',
      signedAt: triage.triageRecord.signedAt || '',
      signedBy: triage.triageRecord.signedBy || '',
      findings: Array.isArray(triage.triageRecord.findings) ? triage.triageRecord.findings : [],
      structuredFields: Array.isArray(triage.triageRecord.structuredFields) ? triage.triageRecord.structuredFields : []
    }
  };
}

function initPatientWorkflowFrame() {
  const frame = document.getElementById('patient-workflow-frame');
  const client = currentClient;
  const triage = client && latestSignedTriage(client.id);
  if (!frame || !client || !triage) return;
  const handoff = patientWorkflowHandoff(client, triage);
  if (!handoff) {
    console.error(`Cannot hand off triage priority ${triage.priority} for client ${client.id}.`);
    return;
  }
  frame.addEventListener('load', () => {
    const status = document.getElementById('patient-workflow-status');
    if (status) {
      status.hidden = false;
      status.className = 'callout';
      status.textContent = 'Loading the v4 patient workflow…';
      window.setTimeout(() => {
        if (status.isConnected && !status.hidden && status.textContent.startsWith('Loading')) {
          status.className = 'callout';
          status.setAttribute('role', 'alert');
          status.textContent = 'The v4 patient workflow did not respond. Check that CITRAMAC-Workflow-v4 (1).html is beside this application file, then reload.';
        }
      }, 10000);
    }
    syncPatientWorkflowTheme();
    frame.contentWindow?.postMessage(handoff, '*');
  }, { once: true });
}

// ═══════════ PERSISTENT CLINICAL BANNER ═══════════
function clientBannerAllergyState(c) {
  const detail = String(c.allergies || '').trim();
  const status = String(c.allergyStatus || '').toLowerCase();
  if (status.includes('reports none') || /^no known allergies$/i.test(status) || /^(none known|no known allergies|client reports none)$/i.test(detail)) {
    return { state: 'none', label: 'No known allergies', items: [] };
  }
  if (status === 'not asked / unknown' || status === 'unknown' || /^(not asked\s*\/\s*unknown|unknown|n\/?a)$/i.test(detail)) {
    return { state: 'unknown', label: 'Allergy status unknown', items: [] };
  }
  if (status.includes('reports an allergy') || status === 'known' || (detail && !/^(not asked\s*\/\s*unknown|unknown|n\/?a)$/i.test(detail))) {
    const items = detail && !/^client reports an allergy$/i.test(detail)
      ? detail.split(/[;,]/).map(item => item.trim()).filter(Boolean)
      : [];
    return { state: 'known', label: 'Known allergy', items };
  }
  return { state: 'unknown', label: 'Allergy status unknown', items: [] };
}

function renderClientBannerAllergy(c) {
  const allergy = clientBannerAllergyState(c);
  const icon = allergy.state === 'none'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4m0 4h.01M10.3 3.9 2.5 17.4A2 2 0 0 0 4.2 20h15.6a2 2 0 0 0 1.7-2.6L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>';
  const items = allergy.items.length
    ? allergy.items.map(item => `<span class="client-banner-allergy-item">${escapeHTML(item)}</span>`).join('')
    : `<span class="client-banner-allergy-note">${escapeHTML(allergy.state === 'none' ? 'Confirmed at triage' : allergy.state === 'known' ? 'Details not recorded' : 'Confirm at triage')}</span>`;
  const title = allergy.state === 'known' ? 'ALLERGIES' : allergy.state === 'unknown' ? 'ALLERGIES UNKNOWN' : allergy.label;
  return `
    <section class="client-banner-cell client-banner-allergy-cell" aria-label="Allergy information">
      <div class="client-banner-allergy" id="banner-allergy" data-state="${allergy.state}" aria-live="polite">
        <div class="client-banner-allergy-title">${icon}<span>${escapeHTML(title)}</span></div>
        <div class="client-banner-allergy-items">${items}</div>
      </div>
    </section>
  `;
}

function renderClientBanner(c) {
  const name = String(c.name || '').trim() || 'Temporary client (unnamed)';
  const initials = name.split(/\s+/).filter(Boolean).map(word => word[0]).join('').slice(0, 2).toUpperCase();
  const inpatient = c.type === 'inpatient';
  const setting = inpatient
    ? `${c.ward || 'Inpatient'}${c.bed != null ? ` · Bed ${c.bed}` : ''}${c.status ? ` · ${c.status}` : ''}`
    : `Outpatient${c.status ? ` · ${c.status}` : ''}`;
  const priorityLabels = { RED: 'Emergency', ORANGE: 'Urgent', YELLOW: 'Priority', GREEN: 'Routine' };
  const priority = String(c.priority || '').toUpperCase();
  const priorityBadge = priorityLabels[priority]
    ? `<span class="client-banner-priority pri-${priority}">${priority} · ${priorityLabels[priority]}</span>`
    : '<span class="tag">Assigned after triage</span>';
  const allergySection = renderClientBannerAllergy(c);
  const alerts = Array.isArray(c.alerts) ? c.alerts.filter(Boolean) : [];
  const clinician = String(c.doctor || c.team || 'Unassigned');
  const team = c.doctor && c.team && c.team !== c.doctor
    ? String(c.team).replace(String(c.doctor), '').replace(/^[\s·—-]+/, '').trim()
    : '';
  const identityLabel = c.identityLabel && c.identityStatus !== 'identified'
    ? `<span class="tag warn">${escapeHTML(c.identityLabel)}</span>`
    : '';
  const demographics = [
    c.age !== undefined && c.age !== null && c.age !== 'Unknown' ? `${escapeHTML(c.age)} yrs` : '',
    c.sex && c.sex !== 'Unknown' ? escapeHTML(c.sex) : '',
    c.dob && c.dob !== 'Not recorded' ? `DOB ${escapeHTML(c.dob)}` : '',
    c.payer && c.payer !== 'Unknown' ? escapeHTML(c.payer) : ''
  ].filter(Boolean);
  return `
    <section class="banner client-safety-banner" aria-label="Patient safety banner">
      <div class="client-banner-grid">
        <section class="client-banner-cell client-banner-identity-cell" aria-label="Patient identity">
          <div class="client-banner-identity">
            <div class="client-banner-avatar ${c.identityStatus && c.identityStatus !== 'identified' ? 'temporary' : ''}" aria-hidden="true">${escapeHTML(initials || '—')}</div>
            <div class="client-banner-copy">
              <div class="client-banner-name">${escapeHTML(name)} ${identityLabel}</div>
              <div class="client-banner-identifiers">
                <span>CITRAMAC ID ${escapeHTML(c.citramacId || c.id || 'Not recorded')}</span>
                <span>MRN ${escapeHTML(c.id || 'Not recorded')}</span>
              </div>
              ${demographics.length ? `<div class="client-banner-demographics">${demographics.map(item => `<span>${item}</span>`).join('')}</div>` : ''}
            </div>
          </div>
        </section>
        ${allergySection}
        <section class="client-banner-cell client-banner-stack client-banner-setting-cell" aria-label="Current setting and triage priority">
          <div>
            <div class="client-banner-label">Current setting</div>
            <div class="client-banner-setting ${inpatient ? 'inpatient' : 'outpatient'}"><span class="setting-dot" aria-hidden="true"></span><span>${escapeHTML(setting)}</span></div>
          </div>
          <div>
            <div class="client-banner-label">Triage / risk priority</div>
            ${priorityBadge}
          </div>
        </section>
        <section class="client-banner-cell client-banner-stack client-banner-care-cell" aria-label="Clinical alerts and care team">
          <div class="client-banner-alerts">
            <div class="client-banner-label">Critical clinical alerts</div>
            ${alerts.length
              ? `<div class="client-banner-alert-list">${alerts.map(alert => `<span class="client-banner-alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4m0 4h.01M10.3 3.9 2.5 17.4A2 2 0 0 0 4.2 20h15.6a2 2 0 0 0 1.7-2.6L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>${escapeHTML(alert)}</span>`).join('')}</div>`
              : '<span class="client-banner-no-alerts">No critical alerts</span>'}
          </div>
          <div>
            <div class="client-banner-label">Responsible clinician / team</div>
            <div class="client-banner-team">${escapeHTML(clinician)}${team ? `<br><span class="client-banner-no-alerts">${escapeHTML(team)}</span>` : ''}</div>
          </div>
        </section>
      </div>
    </section>
  `;
}

function refreshClientBannerAllergy(client) {
  const banner = document.getElementById('banner-allergy');
  if (!banner) return;
  const replacement = document.createElement('div');
  replacement.innerHTML = renderClientBannerAllergy(client).trim();
  const section = replacement.firstElementChild;
  if (section) banner.closest('.client-banner-cell')?.replaceWith(section);
}

function renderTriageEncounterContext(encounter, client) {
  const arrivalTimestamp = encounter.arrivalAt ? new Date(encounter.arrivalAt).getTime() : NaN;
  const waitMinutes = Number.isFinite(arrivalTimestamp)
    ? Math.max(0, Math.floor((Date.now() - arrivalTimestamp) / 60000))
    : Number.isFinite(encounter.wait) ? encounter.wait : null;
  const arrival = encounter.arrivalAt ? formatTriageDate(encounter.arrivalAt) : (encounter.arrival || 'Not recorded');
  return `
    <section class="card triage-patient-context" aria-label="Triage encounter context">
      <div class="triage-context-block">
        <div class="triage-context-label">Encounter</div>
        <div class="triage-context-value">${escapeHTML(encounter.status || 'Awaiting triage')} · ${escapeHTML(arrival)}${waitMinutes !== null ? ` · ${waitMinutes} min waiting` : ''}</div>
      </div>
      <div class="triage-context-block">
        <div class="triage-context-label">Reason for attending</div>
        <div class="triage-context-value triage-context-presenting">${escapeHTML(encounter.presenting || 'Not yet recorded — ask client or informant')}</div>
      </div>
      <div class="triage-context-block">
        <div class="triage-context-label">Referral source</div>
        <div class="triage-context-value">${escapeHTML(encounter.referral || client.referral || 'Not recorded')}</div>
      </div>
      ${(client.phone || client.nok) ? `<div class="triage-context-block">
        <div class="triage-context-label">Contact / next of kin</div>
        <div class="triage-context-value">${client.phone ? `${escapeHTML(client.phone)}<br>` : ''}${escapeHTML(client.nok || '')}</div>
      </div>` : ''}
    </section>
  `;
}

// ═══════════ CLIENT RECORD SECTION NAV (sits under the banner) ═══════════
function clientNav(active) {
  const views = [
    { key: 'snapshot', label: 'Snapshot' },
    { key: 'timeline', label: 'Timeline' },
    { key: 'charts', label: 'Charts' },
    { key: 'legal', label: 'Legal & consent' },
    { key: 'journey', label: 'Journey' }
  ];
  const stages = [
    { key: 'snapshot', label: 'Capture' },
    { key: 'clinical', label: 'Intake' },
    { key: 'careplan', label: 'Care Plan' },
    { key: 'interventions', label: 'Interventions' },
    { key: 'outcomes', label: 'Outcomes' },
    { key: 'billing', label: 'Billing' },
    { key: 'followup', label: 'Follow-up' }
  ];
  const activeView = views.some(view => view.key === active) ? active : 'journey';
  return `
    <nav class="client-record-tabs" aria-label="Client record views">
      ${views.map(view => `<button class="tab ${view.key === activeView ? 'active' : ''}" type="button" aria-current="${view.key === activeView ? 'page' : 'false'}" onclick="showPatientRecordView('${view.key}')">${view.label}</button>`).join('')}
    </nav>
    ${activeView === 'journey' ? `<nav class="journey-stage-tabs" aria-label="Client care journey">
      ${stages.map(stage => {
        const action = stage.key === 'snapshot'
          ? "showPatientRecordView('snapshot')"
          : `openJourneyStage('${stage.key}')`;
        return `<button class="tab ${stage.key === active ? 'active' : ''}" type="button" ${stage.key === active ? 'aria-current="step"' : ''} onclick="${action}">${stage.label}</button>`;
      }).join('')}
    </nav>` : ''}
  `;
}

function latestSignedTriage(clientId) {
  return TRIAGE_QUEUE
    .filter(encounter => encounter.id === clientId && encounter.triageRecord)
    .sort((a, b) => String(b.triageRecord.signedAt || '').localeCompare(String(a.triageRecord.signedAt || '')))[0];
}

function patientRecordView() {
  const client = currentClient;
  if (!client) {
    console.error('Cannot open client record view: no client is selected.');
    return '<div class="callout" role="alert">Select a client to view their record.</div>';
  }
  const triage = latestSignedTriage(client.id);
  return `
    ${renderClientBanner(client)}
    <div id="patient-record-navigation">${clientNav(currentRecordView)}</div>
    ${triage ? `
      <div id="patient-workflow-status" class="callout" role="status">Loading the v4 patient workflow…</div>
      <iframe
        id="patient-workflow-frame"
        class="reference-workflow-frame"
        src="CITRAMAC-Workflow-v4%20(1).html"
        title="CITRAMAC v4 patient workflow">
      </iframe>
    ` : '<div class="callout" role="alert">A signed triage record is required before opening the Psychiatry workflow.</div>'}
  `;
}

function filterClients(query) {
  const results = document.getElementById('client-search-results');
  const normalizedQuery = query.trim().toLowerCase();
  if (!results) return;
  if (!normalizedQuery) {
    results.hidden = true;
    results.innerHTML = '';
    return;
  }
  const matches = CLIENTS.filter(client =>
    [client.name, client.alias, client.identityDescription, client.phone,
      client.nationalId, client.documentNumber, client.citramacId, client.id]
      .filter(Boolean)
      .some(value => String(value).toLowerCase().includes(normalizedQuery))
  ).slice(0, 6);
  results.hidden = false;
  results.innerHTML = matches.length
    ? matches.map(client => `
      <button class="registration-search-result" type="button"
        data-client-action="select"
        data-client-id="${escapeHTML(client.id)}">
        <span>
          <strong>${escapeHTML(client.name)}</strong>
          <span class="registration-note">${escapeHTML([client.citramacId || client.id, client.phone || 'Phone not recorded', client.dob || 'DOB not recorded', client.identityLabel || ''].filter(Boolean).join(' · '))}</span>
        </span>
        <span class="tag">Load details</span>
      </button>
    `).join('')
    : '<p class="registration-note" style="padding: 10px;">No matching client found. Check the details or continue with a new registration.</p>';
  results.querySelectorAll('[data-client-action]').forEach(button => {
    button.addEventListener('click', () => {
      selectExistingClientForRegistration(button.dataset.clientId);
    });
  });
}

function initRegistrationForm() {
  updateIdentityFields(document.getElementById('reg-identity-status').value);
  document.getElementById('client-search').addEventListener('input', event => filterClients(event.currentTarget.value));
  document.getElementById('client-search').addEventListener('keydown', event => {
    if (event.key === 'Enter') event.preventDefault();
  });
  document.getElementById('reg-allergy-status').addEventListener('change', event => {
    document.getElementById('reg-allergy-details-field').hidden = event.currentTarget.value !== 'Client reports an allergy';
  });
  document.getElementById('clear-selected-client').addEventListener('click', clearRegistrationSelection);
  document.querySelectorAll('[data-identity-mode]').forEach(button => {
    button.addEventListener('click', () => {
      const form = document.getElementById('new-client-form');
      const selectedClient = CLIENTS.find(client => client.id === form.dataset.selectedClientId);
      const nextStatus = button.dataset.identityMode;
      if ((selectedClient?.identityStatus || 'identified') === 'identified' && nextStatus !== 'identified') {
        clearRegistrationSelection();
      }
      updateIdentityFields(nextStatus);
    });
  });
}

function setRegistrationField(id, value) {
  const field = document.getElementById(id);
  if (!field) return;
  const normalizedValue = value == null ? '' : String(value);
  if (field instanceof HTMLSelectElement && !Array.from(field.options).some(option => option.value === normalizedValue || option.textContent === normalizedValue)) {
    field.value = '';
  } else {
    field.value = normalizedValue;
  }
}

function selectExistingClientForRegistration(clientId) {
  const client = CLIENTS.find(item => item.id === clientId);
  if (!client) {
    console.error(`Cannot load registration details: client ${clientId} was not found.`);
    return;
  }
  const form = document.getElementById('new-client-form');
  form.dataset.selectedClientId = client.id;
  delete form.dataset.updateClientId;
  const identityStatus = client.identityStatus || 'identified';
  updateIdentityFields(identityStatus);
  setRegistrationField('reg-full-name', identityStatus === 'identified' ? client.name : '');
  setRegistrationField('reg-description', client.identityDescription || client.alias || '');
  setRegistrationField('reg-preferred-name', client.preferredName || '');
  setRegistrationField('reg-pronouns', client.pronouns || '');
  setRegistrationField('reg-dob', client.dob === 'Not recorded' ? '' : client.dob);
  setRegistrationField('reg-age', client.age === 'Unknown' ? '' : client.age);
  setRegistrationField('reg-sex', client.sex);
  setRegistrationField('reg-phone', client.phone);
  setRegistrationField('reg-nok', client.nok);
  setRegistrationField('reg-address', client.address);
  setRegistrationField('reg-id-type', client.idType);
  setRegistrationField('reg-document-number', client.documentNumber);
  setRegistrationField('reg-referral', '');
  setRegistrationField('reg-language', client.language || 'English');
  setRegistrationField('reg-interpreter', client.interpreter === 'Not recorded' ? 'No' : client.interpreter);
  setRegistrationField('reg-allergy-status', client.allergyStatus);
  setRegistrationField('reg-allergy-details', client.allergies === 'Not asked / unknown' || client.allergies === 'Client reports none' ? '' : client.allergies);
  setRegistrationField('reg-payer', client.payer);
  setRegistrationField('reg-reason', '');
  document.getElementById('reg-allergy-details-field').hidden = client.allergyStatus !== 'Client reports an allergy';
  document.getElementById('selected-client-name').textContent = `${client.name} · ${client.citramacId || client.id}`;
  document.getElementById('selected-client-detail').textContent = 'Saved registration details loaded. Sending to triage creates a new encounter; it does not reopen an earlier one.';
  document.getElementById('selected-client-notice').hidden = false;
  document.getElementById('client-search-results').hidden = true;
  document.getElementById('client-search').value = '';
  document.getElementById('registration-submit').textContent = 'Register & send new encounter to triage';
  document.getElementById('reg-reason').focus();
}

function clearRegistrationSelection() {
  const form = document.getElementById('new-client-form');
  delete form.dataset.selectedClientId;
  delete form.dataset.updateClientId;
  form.reset();
  document.getElementById('selected-client-notice').hidden = true;
  document.getElementById('reg-language').value = 'English';
  updateIdentityFields('identified');
}

function updateIdentityFields(identityStatus) {
  const fullName = document.getElementById('reg-full-name');
  const description = document.getElementById('reg-description');
  const identityStatusField = document.getElementById('reg-identity-status');
  const requiredLabel = document.getElementById('reg-name-required');
  const isIdentified = identityStatus === 'identified';
  identityStatusField.value = identityStatus;
  fullName.required = isIdentified;
  description.required = identityStatus === 'unidentified';
  requiredLabel.textContent = isIdentified ? 'REQUIRED' : '';
  fullName.closest('.field').hidden = identityStatus !== 'identified';
  document.getElementById('reg-description-field').hidden = isIdentified;
  document.getElementById('reg-mode-hint').textContent = identityStatus === 'identified'
    ? 'Identified arrival. Search first to avoid creating a duplicate record.'
    : identityStatus === 'unidentified'
      ? 'The person is present but their name has not been confirmed. Add a brief description or alias so they can be safely identified later.'
      : 'Emergency — identity unknown. Capture only what is available; registration must never delay urgent care.';
  description.placeholder = identityStatus === 'unidentified'
    ? 'Required: brief description or reported temporary alias'
    : 'Optional observations to help identify the person later';
  document.querySelectorAll('[data-identity-mode]').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.identityMode === identityStatus));
  });
  document.getElementById('registration-submit').textContent = identityStatus === 'unknown'
    ? 'Create emergency record & send to triage'
    : identityStatus === 'unidentified'
      ? 'Register unidentified person & send to triage'
      : 'Register & send to triage';
  const allergyDetails = document.getElementById('reg-allergy-status').value === 'Client reports an allergy';
  document.getElementById('reg-allergy-details-field').hidden = !allergyDetails;
}

function beginIdentityResolution(clientId) {
  const client = CLIENTS.find(item => item.id === clientId && item.registrationMode);
  if (!client) {
    console.error(`Cannot resolve identity: temporary client ${clientId} was not found.`);
    return;
  }
  showPage('frontdesk');
  selectExistingClientForRegistration(client.id);
  updateIdentityFields('identified');
  setRegistrationField('reg-full-name', '');
  document.getElementById('reg-full-name').focus();
}

function beginClientTriage(clientId) {
  const client = CLIENTS.find(item => item.id === clientId);
  if (!client) {
    console.error(`Cannot start triage: client ${clientId} was not found.`);
    return;
  }
  currentClient = client;
  const lastEncounter = TRIAGE_QUEUE.find(entry => entry.id === client.id);
  if (!lastEncounter) return;
  currentTriageEncounterId = lastEncounter.encounterId;
  showPage('triage');
}

function registerTier1Client(event) {
  event.preventDefault();
  const form = event.currentTarget;
  if (!form.reportValidity()) return false;
  const values = Object.fromEntries(new FormData(form).entries());
  const identityStatus = values.identityStatus;
  const now = new Date();
  const selectedClientId = form.dataset.selectedClientId || form.dataset.updateClientId;
  const existingIndex = CLIENTS.findIndex(client => client.id === selectedClientId);
  const existing = existingIndex >= 0 ? CLIENTS[existingIndex] : null;
  const suffix = `${now.getTime()}-${CLIENTS.length + 1}`;
  const descriptor = String(values.description || '').trim();
  const fullName = String(values.fullName || '').trim();
  if (identityStatus === 'identified' && !fullName) {
    document.getElementById('registration-feedback').innerHTML =
      '<div class="callout" role="alert">Enter the client’s full name, or change Identity status to Unidentified or Unknown to register without one.</div>';
    document.getElementById('reg-full-name').focus();
    return false;
  }
  if (identityStatus === 'unidentified' && !descriptor) {
    document.getElementById('registration-feedback').innerHTML =
      '<div class="callout" role="alert">Add a brief description or reported temporary alias so this unidentified arrival can be distinguished safely.</div>';
    document.getElementById('reg-description').focus();
    return false;
  }
  const name = identityStatus === 'identified'
    ? fullName
    : existing && existing.identityStatus === identityStatus
      ? existing.name
      : `${identityStatus === 'unidentified' ? 'Unidentified person' : 'Unknown person'} (${suffix})`;
  const age = values.estimatedAge ? Number(values.estimatedAge) : existing?.age || 'Unknown';
  const allergyStatus = values.allergyStatus || 'Not asked / unknown';
  const allergies = allergyStatus === 'Client reports none'
    ? 'Client reports none'
    : allergyStatus === 'Client reports an allergy'
      ? String(values.allergyDetails || 'Client reports an allergy').trim()
      : existing?.allergies || 'Not asked / unknown';
  const referral = String(values.referral || '').trim() || 'Self-presented';
  const reason = String(values.reason || '').trim();
  const encounterId = `TRIAGE-${now.getTime().toString(36)}-${TRIAGE_QUEUE.length + 1}`;
  const record = {
    ...(existing || {}),
    id: existing ? existing.id : `MRN-ER-${suffix}`,
    citramacId: existing ? existing.citramacId : `CIT-ER-${suffix}`,
    name,
    alias: values.preferredName || descriptor || existing?.alias || '',
    identityLabel: identityStatus === 'identified'
      ? 'Identified'
      : identityStatus === 'unidentified'
        ? 'Unidentified — provisional record'
        : 'Unknown — minimum details only',
    identityStatus,
    identityDescription: descriptor || existing?.identityDescription || '',
    age,
    sex: values.sex || existing?.sex || 'Unknown',
    dob: values.dob || existing?.dob || 'Not recorded',
    phone: values.phone || existing?.phone || '',
    nok: values.nextOfKin || existing?.nok || '',
    address: values.address || existing?.address || '',
    idType: values.idType || existing?.idType || 'None / unknown',
    documentNumber: values.documentNumber || existing?.documentNumber || '',
    referral: existing?.referral || referral,
    language: values.language || existing?.language || '',
    interpreter: values.interpreter || existing?.interpreter || 'Not recorded',
    allergies,
    allergyStatus,
    pronouns: values.pronouns || existing?.pronouns || '',
    payer: values.payer || existing?.payer || 'Unknown',
    type: existing?.type || 'outpatient',
    status: existing?.status || 'Awaiting triage',
    diagnosis: existing?.diagnosis || 'Not assessed',
    lastVisit: existing?.lastVisit || '—',
    nextAppt: existing?.nextAppt || '—',
    priority: existing?.priority,
    flags: existing?.flags || [],
    alerts: existing?.alerts || [],
    team: existing?.team || 'Unassigned',
    arrival: existing?.arrival || now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    registrationMode: identityStatus === 'identified'
      ? (existing ? 'Tier 1 registration — identity confirmed' : 'Tier 1 registration')
      : 'Tier 1 emergency — temporary identity',
    registeredAt: existing ? existing.registeredAt : now.toISOString(),
    identityConfirmedAt: identityStatus === 'identified' && existing ? now.toISOString() : existing?.identityConfirmedAt
  };
  const queueEntry = {
    encounterId,
    id: record.id,
    name: record.name,
    age: record.age,
    sex: record.sex,
    arrival: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    wait: 0,
    referral,
    presenting: reason || 'Not yet recorded — ask client or informant',
    flags: [],
    status: 'Awaiting triage',
    arrivalAt: now.toISOString(),
    dueAt: new Date(now.getTime() + 10 * 60 * 1000).toISOString(),
    isNewEncounter: true
  };
  const encounterCount = TRIAGE_QUEUE.filter(encounter => encounter.id === record.id).length + 1;
  queueEntry.visitLabel = `Visit ${encounterCount}`;
  const savedRecords = CLIENTS.filter(client => client.registrationMode && client.id !== record.id).concat(record);

  try {
    localStorage.setItem(TIER1_STORAGE_KEY, JSON.stringify(savedRecords));
    registrationStorageIssue = '';
  } catch (error) {
    console.error('Unable to save the Tier 1 registration.', error);
    registrationStorageIssue = 'Browser storage is unavailable. This arrival is available for this session only; complete the approved record in the clinical system when available.';
  }

  if (existingIndex >= 0) CLIENTS[existingIndex] = record;
  else CLIENTS.push(record);
  TRIAGE_QUEUE.unshift(queueEntry);
  currentTriageEncounterId = null;
  currentClient = record;
  form.reset();
  delete form.dataset.selectedClientId;
  delete form.dataset.updateClientId;
  saveTriageEncounters();
  showPage('triage');
  return false;
}

// ═══════════ PAGE: TRIAGE ═══════════
function triage() {
  if (!currentTriageEncounterId) return triageWorklist();
  const activeEncounter = TRIAGE_QUEUE.find(encounter => encounter.encounterId === currentTriageEncounterId);
  if (!activeEncounter) {
    console.error(`The selected triage encounter ${currentTriageEncounterId} could not be found.`);
    currentTriageEncounterId = null;
    return triageWorklist();
  }
  const client = CLIENTS.find(item => item.id === activeEncounter.id)
    || (currentClient?.id === activeEncounter.id ? currentClient : {
      id: activeEncounter.id,
      name: activeEncounter.name || 'Unidentified',
      age: activeEncounter.age ?? 'Unknown',
      sex: activeEncounter.sex || 'Unknown',
      citramacId: activeEncounter.citramacId || activeEncounter.id,
      phone: activeEncounter.phone || '',
      nok: activeEncounter.nok || '',
      allergies: activeEncounter.allergies || 'Not asked / unknown',
      alerts: activeEncounter.alerts || [],
      identityStatus: activeEncounter.identityStatus || (activeEncounter.isDemoUnidentified ? 'unidentified' : 'identified'),
      identityLabel: activeEncounter.identityLabel || (activeEncounter.isDemoUnidentified ? 'Identity unknown' : ''),
      identityDescription: activeEncounter.identityDescription || '',
      type: activeEncounter.type || 'outpatient',
      status: activeEncounter.status || 'Awaiting triage',
    });
  const c = activeEncounter
    ? { ...client, status: activeEncounter.status, priority: activeEncounter.lastTriageAt || activeEncounter.triageRecord ? activeEncounter.priority : '', presenting: activeEncounter.presenting || 'Not yet recorded — ask client or informant', referral: activeEncounter.referral || client.referral }
    : client;
  const allergyState = clientBannerAllergyState(c).state;
  currentTriageEncounterId = activeEncounter?.encounterId || null;
  currentClient = client;
  if (activeEncounter.status === 'Re-check due') {
    return triageQuickRecheck(activeEncounter, c);
  }
  if (activeEncounter.status !== 'In triage') {
    activeEncounter.status = 'In triage';
  }
  if (!activeEncounter.triageStartedAt) {
    activeEncounter.triageStartedAt = new Date().toISOString();

  return `

        ${registrationStorageIssue ? `<div class="callout" role="status">${escapeHTML(registrationStorageIssue)}</div>` : ''}
        <div class="callout triage-live-summary" id="triage-live-summary" data-priority="pending" role="status" aria-live="polite">
          <div>
            <div class="triage-live-summary-title">Live safety summary <span id="sys-rec">Screen in progress</span></div>

          </div>
        </div>

        <form id="triage-form" onsubmit="return false;">

        <div class="card" style="margin-bottom: 16px;">
          <div class="card-header">Section A — Automatic Information (retrieved, not re-asked)</div>
          <div class="card-body">
            <div class="fieldgrid">
              <div class="field"><label>Client identity / temporary ID</label><input type="text" value="${escapeHTML(c.name)} — ${escapeHTML(c.identityLabel || 'Identity record')} — ${escapeHTML(c.citramacId)} (${escapeHTML(c.id)})" readonly></div>
              ${c.identityStatus && c.identityStatus !== 'identified' ? `<div class="field"><label>Identity / distinguishing description</label><input type="text" value="${escapeHTML(c.identityDescription || 'Not yet known')}" readonly></div>` : ''}
              <div class="field"><label>DOB / Age / Sex</label><input type="text" value="${escapeHTML(c.dob || 'Not recorded')} · ${escapeHTML(c.age ?? 'Unknown')} yrs · ${escapeHTML(c.sex || 'Unknown')}" readonly></div>
              <div class="field"><label>Contact details</label><input type="text" value="${escapeHTML(c.phone || 'Not recorded')}" readonly></div>
              <div class="field"><label>Emergency contact / NOK</label><input type="text" value="${escapeHTML(c.nok || 'Not recorded — confirm')}" readonly></div>
              <div class="field"><label>Referral source</label><input type="text" value="${escapeHTML(c.referral || 'Self-presented')}" readonly></div>
              ${activeEncounter.lastTriageAt || activeEncounter.triageRecord ? `<div class="field"><label>Previous signed triage priority</label><input type="text" value="${escapeHTML(activeEncounter.priority || 'Not recorded')}" readonly></div>` : ''}
              <div class="field"><label>Allergy status</label>
                <select id="t-allergy-status">
                  <option ${allergyState === 'known' ? 'selected' : ''}>Known</option>
                  <option ${allergyState === 'none' ? 'selected' : ''}>No known allergies</option>
                  <option ${allergyState === 'unknown' ? 'selected' : ''}>Unknown</option>
                </select>
              </div>
              <div class="field"><label>Allergy detail — updates the central allergy record</label><input type="text" id="t-allergy-detail" value="${escapeHTML(c.allergies || '')}"></div>
            </div>
            <div class="callout" style="margin-top: 12px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4m0 4h.01M12 2l10 18H2z"/></svg>
              <div><strong>Existing critical alerts:</strong> ${c.alerts && c.alerts.length ? c.alerts.map(escapeHTML).join(' · ') : 'None documented'}. Alerts follow the client until resolved or updated.</div>
            </div>
          </div>
        </div>

        <div class="card" style="margin-bottom: 16px;">
          <div class="card-header">Section B — Triage Encounter</div>
          <div class="card-body">
            <div class="fieldgrid">
              <div class="field"><label>Date / time</label><input type="text" value="${new Date().toLocaleString()}" readonly></div>
              <div class="field"><label>Triage clinician</label><input type="text" value="J. Njoroge, RN (signed in)" readonly></div>
              <div class="field"><label>Tenant / location</label><input type="text" value="Main Facility — Intake desk" readonly></div>

            </div>
            <div class="grouplabel">Who is providing the information?</div>
            <div style="display: flex; gap: 4px; flex-wrap: wrap;">
              ${['Client','Family/parent','Friend','Police','Ambulance','Healthcare professional','Employer/school','Other'].map((t,i) => `<label class="checkbox-item"><input type="radio" name="informant" ${i===0?'checked':''}> ${t}</label>`).join('')}
            </div>
            <div class="grouplabel">Is the client physically present?</div>
            <div style="display: flex; gap: 4px; flex-wrap: wrap;">
              <label class="checkbox-item"><input type="radio" name="present" value="yes" checked> Yes</label>

          </div>
        </div>

        <div class="card" style="margin-bottom: 16px;">
          <div class="card-header">Section C — What Is Happening Right Now?</div>
          <div class="card-body">
            <div class="field"><label>Main concern in client's/informant's own words</label><textarea rows="2" id="t-c-concern">${escapeHTML(c.presenting || TRIAGE_QUEUE.find(entry => entry.id === c.id)?.presenting || 'Not yet recorded — ask client or informant')}</textarea></div>
            <div class="grouplabel">When did this begin or become worse?</div>
            <div style="display: flex; gap: 4px; flex-wrap: wrap;">
              ${['Today','Past 24 hours','Past few days','Past week','Longer','Unknown'].map((t,i) => `<label class="checkbox-item"><input type="radio" name="onset" ${i===0?'checked':''}> ${t}</label>`).join('')}

            <div class="field" style="margin-top: 12px;"><label>Brief description</label><textarea rows="1"></textarea></div>
          </div>
        </div>
    <div class="card" style="margin-bottom: 16px;">

        <div class="fieldgrid" style="margin-top: 8px;">

          <div class="field"><label>Anything recently done to kill or seriously harm yourself?</label><select id="t-d-attempt"><option value="no">No</option><option value="yes">Yes</option></select></div>
          <div class="field"><label>Known access to means of serious self-harm?</label><select id="t-d-means"><option value="no">No</option><option value="yes">Yes</option><option value="unknown">Unknown</option></select></div>
          <div class="field"><label>Can the client currently maintain their own safety?</label><select id="t-d-safety"><option value="yes">Yes</option><option value="no">No</option><option value="uncertain">Uncertain</option></select></div>
        </div>
        <div class="field" style="margin-top: 8px;"><label>What happened and when?</label><input type="text"></div>
        <div class="callout" id="t-trig-d" style="display:none; margin-top: 10px;"><div><strong>AUTO-TRIGGER:</strong> SUICIDE/SELF-HARM RISK alert → Suicide Risk Assessment + Safety Planning workflow. Triage does not duplicate the full assessment.</div></div>
      </div>
    </div>

    <div class="card" style="margin-bottom: 16px;">
      <div class="card-header">Section E — Risk of Harm to Others</div>
      <div class="card-body">
        <div class="fieldgrid">
          <div class="field"><label>Current thoughts of seriously harming someone else?</label><select id="t-e-thoughts" required><option value="">— not assessed —</option><option value="no">No</option><option value="yes">Yes</option><option value="unable">Unable to determine</option></select></div>
          <div class="field"><label>Recent threatening/aggressive/violent behaviour?</label><select id="t-e-behaviour"><option value="no">No</option><option value="yes">Yes</option><option value="unknown">Unknown</option></select></div>
          <div class="field"><label>Recent violent act?</label><select id="t-e-act"><option value="no">No</option><option value="yes">Yes</option></select></div>
          <div class="field"><label>Known access to means of serious harm?</label><select id="t-e-means"><option value="no">No</option><option value="yes">Yes</option><option value="unknown">Unknown</option></select></div>
          <div class="field"><label>Current behaviour suggests immediate danger?</label><select id="t-e-danger"><option value="no">No</option><option value="yes">Yes</option><option value="uncertain">Uncertain</option></select></div>

        <div class="callout" id="t-trig-e" style="display:none; margin-top: 10px;"><div><strong>AUTO-TRIGGER:</strong> RISK OF HARM TO OTHERS → violence/risk assessment and escalation pathway.</div></div>

          <div class="field"><label>Previous withdrawal seizure?</label><select id="t-g-seizure"><option value="no">No</option><option value="yes">Yes</option><option value="unknown">Unknown</option></select></div>

        <div class="grouplabel">Current withdrawal symptoms</div>
        <div style="display: flex; gap: 4px; flex-wrap: wrap;">
          ${['Tremor','Sweating','Vomiting','Severe anxiety/agitation','Hallucinations','Confusion','Seizure','Other','None'].map(t => `<label class="checkbox-item"><input type="checkbox" class="t-g-wd" value="${t}"> ${t}</label>`).join('')}
        </div>
        <div class="callout" id="t-trig-g" style="display:none; margin-top: 10px;"><div><strong>SYSTEM TRIGGERS:</strong> Alcohol dependence / recent cessation + withdrawal risk → PAWSS. Current alcohol withdrawal → CIWA-Ar. Current opioid withdrawal → COWS.</div></div>
      </div>
    </div>

    <div class="card" style="margin-bottom: 16px;">
      <div class="card-header">Section H — Urgent Medical Screen</div>

          <div class="field"><label>Temp</label><input type="text" id="t-h-temp"></div>
          <div class="field"><label>SpO₂</label><input type="text" id="t-h-spo2"></div>

      </div>
    </div>

    <div class="card" style="margin-bottom: 16px;">
      <div class="card-header">Section I — Safeguarding & Vulnerability</div>
      <div class="card-body">
        <div class="field"><label>Do you feel safe where you currently live/stay?</label><select id="t-i-safe" required><option value="">— not assessed —</option><option value="yes">Yes</option><option value="no">No</option><option value="unsure">Unsure</option><option value="unable">Unable to assess</option></select></div>
        <div class="grouplabel">Concerns</div>
        <div style="display: flex; gap: 4px; flex-wrap: wrap;">
          ${['Abuse','Neglect','Domestic/intimate partner violence','Sexual violence/exploitation','Financial exploitation','Threat/coercion','Child safeguarding','Vulnerable adult','Unsafe living environment','Other','None identified'].map(t => `<label class="checkbox-item"><input type="checkbox" class="t-i-flag" value="${t}"> ${t}</label>`).join('')}
        </div>
        <div class="field" style="margin-top: 10px;"><label>Safe to return to current environment?</label><select id="t-i-return"><option value="yes">Yes</option><option value="no">No</option><option value="uncertain">Uncertain</option></select></div>
        <div class="callout" id="t-trig-i" style="display:none; margin-top: 10px;"><div><strong>AUTO-TRIGGER:</strong> SAFEGUARDING CONCERN → tenant safeguarding pathway.</div></div>

function formatTriageDate(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return 'Not scheduled';
  const pad = part => String(part).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function formatTriageTime(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime())
    ? 'time not recorded'
    : `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
}

function triageWorklist() {
  const now = Date.now();
  const items = TRIAGE_QUEUE
    .filter(encounter =>
      ['Awaiting triage', 'Waiting', 'Re-check due'].includes(encounter.status) ||
      (encounter.status === 'In triage' && (encounter.isNewEncounter || encounter.triageStartedAt || encounter.triageDraftSavedAt || encounter.fullRetriageRequestedAt))
    )
    .map(encounter => {
      const client = CLIENTS.find(item => item.id === encounter.id);
      const dueAt = encounter.dueAt ? new Date(encounter.dueAt).getTime() : Number.POSITIVE_INFINITY;
      const isAwaiting = encounter.status !== 'Re-check due';
      const isOverdue = isAwaiting && dueAt < now;
      const arrivalAt = encounter.arrivalAt
        ? new Date(encounter.arrivalAt).getTime()
        : Number.isFinite(dueAt) ? dueAt - 10 * 60 * 1000 : now;
      const waitMinutes = Math.max(0, Math.floor((now - arrivalAt) / 60000));
      return { encounter, client, dueAt, isOverdue, waitMinutes };
    })
    .sort((a, b) =>
      Number(b.isOverdue) - Number(a.isOverdue) ||
      a.dueAt - b.dueAt
    );
  const overdueCount = items.filter(item => item.isOverdue).length;

  return `
    <div class="page-header">
      <div>
        <div class="registration-eyebrow">Clinical workflow</div>
        <h1 class="page-title">Triage — awaiting and re-checks due</h1>
        <p class="page-subtitle">${items.length} ${items.length === 1 ? 'item' : 'items'} · ${overdueCount} overdue</p>
        <p class="page-subtitle">Overdue first, then due time. Priority is assigned after triage.</p>
      </div>
    </div>

    ${registrationStorageIssue ? `<div class="callout" role="status">${escapeHTML(registrationStorageIssue)}</div>` : ''}
    <div class="card triage-worklist-card">
      <div class="card-header">
        <span>Triage — awaiting and re-checks due</span>
        <span class="tag">${items.length} ${items.length === 1 ? 'item' : 'items'} · ${overdueCount} overdue</span>
      </div>
      <div class="triage-worklist-scroll">
        <table class="data-table triage-worklist-table" aria-label="Triage awaiting and re-checks due">
          <thead><tr><th>Client</th><th>Setting / status</th><th>Detail</th><th>Due</th><th><span class="sr-only">Open encounter</span></th></tr></thead>
          <tbody>
            ${items.length ? items.map(({ encounter, client, isOverdue, waitMinutes }) => {
              const status = encounter.status === 'Re-check due'
                ? 'Re-check due'
                : encounter.status === 'In triage' ? 'In triage' : 'Awaiting triage';
              const detail = status === 'Re-check due'
                ? `Re-check due · last triage v${escapeHTML(encounter.lastTriageVersion || 1)} ${escapeHTML(formatTriageTime(encounter.lastTriageAt))}`
                : `${waitMinutes} min · triage target`;
              return `
                <tr class="${isOverdue ? 'triage-worklist-overdue' : ''}">
                  <td><strong>${escapeHTML(encounter.name || client?.name || 'Unknown client')} · ${escapeHTML(encounter.id)}</strong><br><span class="triage-worklist-id">${escapeHTML(client?.citramacId || 'CITRAMAC ID not recorded')}</span></td>
                  <td>${escapeHTML((client?.type || 'outpatient').replace(/^./, character => character.toUpperCase()))} · ${escapeHTML(status)}</td>
                  <td>${detail}${isOverdue ? `<br><span class="triage-overdue-label">Overdue</span>` : ''}</td>
                  <td>${escapeHTML(formatTriageDate(encounter.dueAt))}</td>
                  <td><button class="btn ghost sm" type="button" data-open-triage="${escapeHTML(encounter.encounterId)}">Open</button></td>
                </tr>
              `;
            }).join('') : '<tr><td colspan="5" class="triage-worklist-empty">No arrivals or re-checks are currently due.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function triageFormControls(form) {
  return Array.from(form.querySelectorAll('input, select, textarea'))
    .filter(control => !control.readOnly && !['button', 'submit'].includes(control.type));
}

function readTriageFormDraft(form) {
  return triageFormControls(form).map(control => ({
    value: control.value,
    checked: control.type === 'checkbox' || control.type === 'radio' ? control.checked : undefined
  }));
}

function readTriageStructuredFields(form) {
  return triageFormControls(form).flatMap((control, index) => {
    if (!control.getClientRects().length) return [];
    const group = Array.from(control.classList).find(name => /^t-[a-z]-/.test(name));
    const key = group || control.id || control.name || `field-${index + 1}`;
    const label = control.closest('.field')?.querySelector('label')?.textContent.trim()
      || control.closest('label')?.textContent.trim()
      || key.replace(/^t-/, '').replace(/-/g, ' ');
    if (control.type === 'checkbox' || control.type === 'radio') {
      if (!control.checked) return [];
      const choice = control.closest('label')?.textContent.trim() || control.value;
      return [{ key, label: control.type === 'checkbox' ? `${key.replace(/^t-/, '').replace(/-/g, ' ')} — selected` : label, value: choice }];
    }
    return [{ key, label, value: control.value.trim() }];
  });
}

function restoreTriageFormDraft(form, draft) {
  if (!Array.isArray(draft)) return;
  triageFormControls(form).forEach((control, index) => {
    const saved = draft[index];
    if (!saved) return;
    if (control.type === 'checkbox' || control.type === 'radio') control.checked = Boolean(saved.checked);
    else control.value = saved.value ?? '';
  });
}

function updateTriageBranches(form) {
  const clientAbsent = form.querySelector('input[name="present"][value="no"]').checked;
  document.getElementById('telephone-screen').style.display = clientAbsent ? '' : 'none';
  document.getElementById('direct-obs').style.display = clientAbsent ? 'none' : '';
  const overrideSelected = form.querySelector('input[name="decision"][value="override"]').checked;
  const overrideReason = document.getElementById('override-reason');
  overrideReason.disabled = !overrideSelected;
  overrideReason.required = overrideSelected;
  if (overrideSelected) overrideReason.closest('details').open = true;
}

function saveTriageDraft(form, encounter) {
  encounter.triageDraft = readTriageFormDraft(form);
  encounter.triageDraftSavedAt = new Date().toISOString();
  saveTriageEncounters();
  const status = document.getElementById('triage-draft-status');
  if (status) status.textContent = `Draft saved ${formatTriageTime(encounter.triageDraftSavedAt)}`;
}

function collectQuickRecheck(form) {
  const values = new FormData(form);
  const statusOf = name => values.get(`observationStatus-${name}`);
  const observation = name => ({
    value: values.get(name) || '',
    status: statusOf(name)
  });
  return {
    changeSinceLastCheck: values.get('changeSinceLastCheck'),
    distressBehaviour: values.get('distressBehaviour'),
    note: String(values.get('note') || '').trim(),
    observations: {
      heartRate: observation('heartRate'),
      bloodPressureSystolic: { value: values.get('bloodPressureSystolic') || '', status: statusOf('bloodPressure') },
      bloodPressureDiastolic: { value: values.get('bloodPressureDiastolic') || '', status: statusOf('bloodPressure') },
      respiratoryRate: observation('respiratoryRate'),
      temperature: observation('temperature'),
      oxygenSaturation: observation('oxygenSaturation'),
      bloodGlucose: observation('bloodGlucose')
    }
  };
}

function initQuickRecheck(form) {
  const encounter = TRIAGE_QUEUE.find(item => item.encounterId === form.dataset.encounterId);
  if (!encounter) {
    console.error(`Cannot save quick re-check: encounter ${form.dataset.encounterId} was not found.`);
    return;
  }
  const statusControl = name => form.elements.namedItem(`observationStatus-${name}`);
  const observationInputs = name => name === 'bloodPressure'
    ? ['bloodPressureSystolic', 'bloodPressureDiastolic'].map(key => form.elements.namedItem(key))
    : [form.elements.namedItem(name)];
  const applyMeasurementRequirement = () => {
    const bloodPressureMeasured = statusControl('bloodPressure').value === 'Measured';
    form.elements.namedItem('bloodPressureSystolic').required = bloodPressureMeasured;
    form.elements.namedItem('bloodPressureDiastolic').required = bloodPressureMeasured;
    ['heartRate','respiratoryRate','temperature','oxygenSaturation','bloodGlucose'].forEach(name => {
      form.elements.namedItem(name).required = statusControl(name).value === 'Measured';
    });
  };
  const saveDraft = () => {
    applyMeasurementRequirement();
    encounter.recheckDraft = { ...collectQuickRecheck(form), savedAt: new Date().toISOString() };
    saveTriageEncounters();
    const status = document.getElementById('recheck-draft-status');
    if (status) status.textContent = `Draft saved ${formatTriageTime(encounter.recheckDraft.savedAt)}`;
  };
  form.addEventListener('input', saveDraft);
  form.addEventListener('change', saveDraft);
  form.querySelectorAll('[name^="observationStatus-"]').forEach(select => {
    select.addEventListener('change', () => {
      if (select.value !== 'Measured') observationInputs(select.name.replace('observationStatus-', '')).forEach(input => { input.value = ''; });
      applyMeasurementRequirement();
    });
  });
  form.querySelectorAll('.recheck-observation input').forEach(input => {
    input.addEventListener('input', () => {
      if (input.value) {
        const measurementName = input.name.startsWith('bloodPressure') ? 'bloodPressure' : input.name;
        statusControl(measurementName).value = 'Measured';
        applyMeasurementRequirement();
      }
    });
  });
  applyMeasurementRequirement();

  document.getElementById('open-full-retriage').addEventListener('click', () => {
    encounter.status = 'In triage';
    encounter.fullRetriageRequestedAt = new Date().toISOString();
    saveTriageEncounters();
    showPage('triage');
  });
  form.addEventListener('submit', event => {
    event.preventDefault();
    applyMeasurementRequirement();
    if (!form.reportValidity()) return;
    const signedAt = new Date().toISOString();
    const signedBy = 'J. Njoroge, RN';
    const signedRecheck = {
      ...collectQuickRecheck(form),
      signedAt,
      signedBy,
      version: (encounter.rechecks?.length || 0) + 1
    };
    encounter.rechecks = [...(encounter.rechecks || []), signedRecheck];
    encounter.lastRecheckAt = signedAt;
    encounter.lastRecheckBy = signedBy;
    encounter.recheckDraft = null;
    encounter.status = 'Re-check completed';
    saveTriageEncounters();
    showTriageWorklist();
  });
}

function organizeTriageSections(form) {
  const cards = Array.from(form.children).filter(element => element.classList.contains('card'));
  cards.forEach(card => {
    const heading = card.querySelector('.card-header');
    const body = card.querySelector('.card-body');
    if (!heading || !body) return;
    const details = document.createElement('details');
    details.className = 'triage-section card';
    details.id = card.id;
    details.style.cssText = card.style.cssText;
    const title = heading.textContent.trim();
    details.dataset.sectionTitle = title;
    const summary = document.createElement('summary');
    summary.className = 'triage-section-heading';
    summary.textContent = title;
    details.append(summary, body);
    if (title.startsWith('Section B —') || title.startsWith('Section C —')) details.open = true;
    card.replaceWith(details);
  });
}

function initTriage() {
  document.querySelectorAll('[data-open-triage]').forEach(button => {
    button.addEventListener('click', () => openTriageEncounter(button.dataset.openTriage));
  });
  const recheckForm = document.getElementById('quick-recheck-form');
  if (recheckForm) {
    initQuickRecheck(recheckForm);
    return;
  }
  const f = document.getElementById('triage-form');
  if (!f) return;
  organizeTriageSections(f);
  const activeEncounter = TRIAGE_QUEUE.find(encounter => encounter.encounterId === currentTriageEncounterId);
  restoreTriageFormDraft(f, activeEncounter?.triageDraft);
  if (!activeEncounter?.triageDraft) {
    document.getElementById('final-priority').value =
      activeEncounter?.lastTriageAt || activeEncounter?.triageRecord ? activeEncounter.priority || '' : '';
  }
  updateTriageBranches(f);
  if (activeEncounter?.triageDraftSavedAt) {
    document.getElementById('triage-draft-status').textContent = `Draft saved ${formatTriageTime(activeEncounter.triageDraftSavedAt)}`;
  }
  f.addEventListener('input', () => {
    if (activeEncounter) saveTriageDraft(f, activeEncounter);
  });
  const rv = (id) => (document.getElementById(id) || {}).value;
  const anyChecked = (cls) => document.querySelectorAll('.' + cls + ':checked');

  function recompute() {
    const rows = []; let rec = 'GREEN'; const reasons = []; const alerts = [];
    const bump = (p) => { const o = { GREEN:0, YELLOW:1, ORANGE:2, RED:3 }; if (o[p] > o[rec]) rec = p; };
    const now = new Date().toLocaleTimeString();
    const coreScreens = [
      ['t-d-suicidal', 'Suicide / self-harm'],
      ['t-e-thoughts', 'Risk of harm to others'],
      ['t-f-change', 'Acute mental state'],
      ['t-h-concern', 'Urgent medical concern'],
      ['t-i-safe', 'Safeguarding / current safety'],
      ['t-j-concern', 'Immediate functional safety']
    ];
    const unansweredScreens = coreScreens
      .filter(([id]) => rv(id) === '')
      .map(([, label]) => label);
    const uncertainValues = new Set(['unable', 'unknown', 'unsure', 'uncertain']);
    const unresolvedScreens = coreScreens
      .filter(([id]) => uncertainValues.has(rv(id)))
      .map(([, label]) => label);

    // D
    if (rv('t-d-suicidal') === 'yes') {
      alerts.push('Suicide risk'); bump('ORANGE'); reasons.push('suicidal thoughts present');
      rows.push(['Suicide risk', rv('t-d-actnow') === 'yes' ? 'Thoughts of acting now — YES' : 'Suicidal thoughts documented', 'Client report']);
      if (rv('t-d-actnow') === 'yes') { bump('RED'); rows.push(['Acting now', 'Intent to act on thoughts now', 'Client report']); }
      if (rv('t-d-attempt') === 'yes') { bump('RED'); rows.push(['Recent self-harm / attempt', 'Reported', 'Client report']); }
      if (rv('t-d-means') === 'yes') { bump('ORANGE'); rows.push(['Access to means', 'Known access', 'Client report']); }
      document.getElementById('t-trig-d').style.display = '';
    } else { document.getElementById('t-trig-d').style.display = 'none'; }

    // E
    if (rv('t-e-thoughts') === 'yes' || rv('t-e-behaviour') === 'yes' || rv('t-e-act') === 'yes') {
      alerts.push('Aggression / violence risk'); bump('ORANGE'); reasons.push('risk of harm to others present');
      rows.push(['Risk to others', 'Thoughts/behaviour/act documented', 'Client report']);
      if (rv('t-e-danger') === 'yes') { bump('RED'); rows.push(['Immediate danger', 'Behaviour suggests immediate danger', 'Clinician observation']); }
      document.getElementById('t-trig-e').style.display = '';
    } else { document.getElementById('t-trig-e').style.display = 'none'; }

    // F
    const fFeats = Array.from(anyChecked('t-f-feature')).map(e => e.value);
    if (rv('t-f-change') === 'yes' || fFeats.length) {
      bump('ORANGE'); reasons.push('acute mental state change');
      rows.push(['Acute mental state change', fFeats.join(', ') || 'Change reported', 'Clinician observation']);
      document.getElementById('t-trig-f').style.display = '';
    } else { document.getElementById('t-trig-f').style.display = 'none'; }
    const loc = rv('t-f-loc');
    if (loc && loc !== 'Alert') { alerts.push('Altered consciousness'); bump('RED'); reasons.push('altered consciousness'); rows.push(['Altered consciousness', loc, 'Clinician observation']); }

    // G
    const wd = Array.from(anyChecked('t-g-wd')).map(e => e.value).filter(v => v !== 'None');
    if ((rv('t-g-use') === 'yes' && (rv('t-g-intox') === 'Significant' || rv('t-g-intox') === 'Severe')) ||
        (rv('t-g-stopped') === 'yes' && wd.length) || wd.length) {
      alerts.push('Withdrawal risk'); bump('ORANGE'); reasons.push('withdrawal risk');
      rows.push(['Withdrawal risk', (wd.length ? 'Symptoms: ' + wd.join(', ') : 'Recent heavy use / stopped') + (rv('t-g-seizure') === 'yes' ? ' · prior seizure' : ''), 'Client report']);
      document.getElementById('t-trig-g').style.display = '';
    } else { document.getElementById('t-trig-g').style.display = 'none'; }

    // H
    const hflags = Array.from(anyChecked('t-h-flag')).map(e => e.value);
    let vitalAbn = false;
    const bp = rv('t-h-bp'), pulse = parseInt(rv('t-h-pulse')), spo2 = parseInt(rv('t-h-spo2')), temp = parseFloat(rv('t-h-temp'));
    const bpHi = bp && bp.split('/')[0] && parseInt(bp.split('/')[0]) > 160;
    if (hflags.length || rv('t-h-concern') === 'yes') {
      bump('ORANGE'); reasons.push('acute medical concern');
      rows.push(['Medical concern', hflags.join(', ') || 'Concern reported', 'Client report']);
      if (hflags.some(x => ['Chest pain','Recent seizure','Suspected overdose','Difficulty breathing','Loss/alteration of consciousness'].includes(x))) bump('RED');
      document.getElementById('t-trig-h').style.display = '';
    } else if (bp || pulse || spo2 || temp) { document.getElementById('t-trig-h').style.display = ''; }
    else { document.getElementById('t-trig-h').style.display = 'none'; }
    if (bpHi || (pulse && (pulse > 120 || pulse < 50)) || (spo2 && spo2 < 92) || (temp && temp > 38.5)) {
      vitalAbn = true; alerts.push('Abnormal vital signs'); bump('RED'); reasons.push('abnormal vital signs');
      rows.push(['Abnormal vital signs', [bp && 'BP ' + bp, pulse && 'Pulse ' + pulse, spo2 && 'SpO2 ' + spo2 + '%', temp && 'Temp ' + temp].filter(Boolean).join(' · '), 'Measured result']);
    }

    // I
    const iflags = Array.from(anyChecked('t-i-flag')).map(e => e.value).filter(v => v !== 'None identified');
    if (iflags.length || rv('t-i-safe') === 'no' || rv('t-i-return') === 'no') {
      alerts.push('Safeguarding concern'); bump('ORANGE'); reasons.push('safeguarding concern');
      rows.push(['Safeguarding concern', iflags.join(', ') || 'Client does not feel safe', 'Client report']);
      document.getElementById('t-trig-i').style.display = '';
    } else { document.getElementById('t-trig-i').style.display = 'none'; }

    // J
    if (rv('t-j-concern') === 'yes') { bump('YELLOW'); reasons.push('immediate functional safety concern'); rows.push(['Functional safety concern', 'Unable to meet basic needs', 'Client report']); }

    // K (only meaningful when not present)
    if (document.querySelector('input[name="present"][value="no"]').checked) {
      const kflags = Array.from(anyChecked('t-k-flag')).map(e => e.value);
      rows.push(['Telephone / third-party screen', kflags.join(', ') || 'No concerns reported', 'Third-party report']);
      if (rv('t-k-emergency') === 'yes') { bump('RED'); alerts.push('Telephone screen: emergency assistance required'); reasons.push('emergency assistance required (third-party report)'); }
      if (kflags.some(x => x.includes('Suicide'))) { alerts.push('Suicide risk'); bump('ORANGE'); reasons.push('suicide concern via third party'); }
    }

    if (unansweredScreens.length) {
      rows.push(['Safety screen incomplete', `Not assessed: ${unansweredScreens.join(', ')}`, 'Triage screen']);
    }
    if (unresolvedScreens.length) {
      rows.push(['Clinical review required', `Unable to determine: ${unresolvedScreens.join(', ')}`, 'Triage screen']);
    }
    const recommendationReady = unansweredScreens.length === 0 && unresolvedScreens.length === 0;
    const hasTriggeredPriority = rec !== 'GREEN' && reasons.length > 0;
    const recommendationLabel = recommendationReady
      ? rec
      : hasTriggeredPriority ? `${rec} — preliminary` : 'Review required';
    const summaryReasons = [
      reasons.length ? reasons.join(' · ') : recommendationReady
        ? 'No immediate safety/medical concern identified in the completed screen.'
        : 'Complete the immediate safety and urgent medical questions. Unanswered items are not treated as negative findings.',
      alerts.length ? `Alerts: ${Array.from(new Set(alerts)).join(', ')}` : ''
    ].filter(Boolean);

    // Render summary + recommendation
    const sb = document.getElementById('summary-body');
    sb.innerHTML = rows.length
      ? rows.map(r => `<tr><td><strong>${escapeHTML(r[0])}</strong></td><td>${escapeHTML(r[1])}</td><td>${escapeHTML(r[2])} <span style="color:var(--faint)">· ${escapeHTML(now)}</span></td></tr>`).join('')
      : '<tr><td colspan="3" style="color: var(--muted);">No positive findings recorded. Complete all core safety screens; this is not an assessed negative screen.</td></tr>';
    document.getElementById('sys-rec').textContent = recommendationLabel;
    document.getElementById('rec-reasons').textContent = summaryReasons.join(' · ');
    document.getElementById('triage-live-summary').dataset.priority =
      recommendationReady || hasTriggeredPriority ? rec : 'pending';
    if (recommendationReady && document.querySelector('input[name="decision"][value="confirm"]').checked) {
      document.getElementById('final-priority').value = rec;
    }
  }

  f.addEventListener('change', recompute);

  // Physically present branching
  f.addEventListener('change', (e) => {
    if (e.target.name === 'present') {
      updateTriageBranches(f);
    }
    if (e.target.name === 'decision') {
      updateTriageBranches(f);
    }
  });

  // Keep allergy status and details aligned across the triage form and patient banner.
  const allergyStatusInput = document.getElementById('t-allergy-status');
  const allergyDetailInput = document.getElementById('t-allergy-detail');
  const syncTriageAllergy = () => {
    const c = currentClient || CLIENTS.find(x => x.id === TRIAGE_QUEUE[0]?.id);
    if (!c) return;
    c.allergyStatus = allergyStatusInput.value === 'Known'
      ? 'Client reports an allergy'
      : allergyStatusInput.value === 'No known allergies'
        ? 'Client reports none'
        : 'Not asked / unknown';
    c.allergies = allergyDetailInput.value;
    const summary = document.getElementById('triage-allergy-value');
    if (summary) {
      const allergy = clientBannerAllergyState(c);
      summary.textContent = allergy.state === 'known'
        ? allergy.items.join(', ') || 'Known allergy — details not recorded'
        : allergy.label;
    }
    refreshClientBannerAllergy(c);
  };
  allergyStatusInput.addEventListener('change', syncTriageAllergy);
  allergyDetailInput.addEventListener('change', syncTriageAllergy);

  // Register actions as trackable tasks
  document.getElementById('t-n-register').addEventListener('click', () => {
    const checked = Array.from(document.querySelectorAll('.t-n-action:checked'));
    const tl = document.getElementById('task-list');
    if (!checked.length) return;
    const status = document.getElementById('t-n-status').value;
    const rows = checked.map(cb => `<tr><td><strong>${cb.value}</strong></td><td>Psychiatry / Nursing</td><td><span class="tag">${status}</span></td><td>${new Date().toLocaleString()}</td></tr>`).join('');
    if (tl.querySelector('td[colspan]')) tl.innerHTML = '';
    tl.innerHTML += rows;
    checked.forEach(cb => cb.checked = false);
  });

  document.getElementById('save-triage-draft').addEventListener('click', () => {
    if (activeEncounter) saveTriageDraft(f, activeEncounter);
  });

  document.getElementById('sign-triage').addEventListener('click', () => {
    if (!activeEncounter) {
      console.error('Cannot sign triage: no active encounter is selected.');
      return;
    }
    const invalidControl = f.querySelector(':invalid');
    if (invalidControl) {
      invalidControl.closest('details.triage-section')?.setAttribute('open', '');
      invalidControl.focus();
      invalidControl.reportValidity();
      const signStatus = document.getElementById('triage-sign-status');
      signStatus.hidden = false;
      signStatus.className = 'callout';
      signStatus.textContent =
        'Complete the required safety screens and select a final priority before signing.';
      return;
    }
    const decision = f.querySelector('input[name="decision"]:checked')?.value;
    const overrideReason = document.getElementById('override-reason').value.trim();
    if (decision === 'override' && !overrideReason) {
      document.getElementById('override-reason').required = true;
      document.getElementById('override-reason').focus();
      document.getElementById('override-reason').reportValidity();
      return;
    }
    const signedAt = new Date().toISOString();
    const signedBy = 'J. Njoroge, RN';
    const finalPriority = document.getElementById('final-priority').value;
    const findings = Array.from(document.querySelectorAll('#summary-body tr'))
      .filter(row => row.cells.length === 3)
      .map(row => Array.from(row.cells, cell => cell.textContent.trim()));
    activeEncounter.triageRecord = {
      fields: readTriageFormDraft(f),
      structuredFields: readTriageStructuredFields(f),
      recommendation: document.getElementById('sys-rec').textContent,
      recommendationReasons: document.getElementById('rec-reasons').textContent,
      findings,
      priority: finalPriority,
      decision,
      overrideReason: decision === 'override' ? overrideReason : '',
      signedAt,
      signedBy
    };
    activeEncounter.priority = finalPriority;
    activeEncounter.presenting = document.getElementById('t-c-concern').value.trim();
    activeEncounter.lastTriageAt = signedAt;
    activeEncounter.lastTriageBy = signedBy;
    activeEncounter.lastTriageVersion = (activeEncounter.lastTriageVersion || 0) + 1;
    activeEncounter.status = 'Triage completed';
    activeEncounter.triageDraft = null;
    activeEncounter.triageDraftSavedAt = null;
    currentClient.priority = finalPriority;
    saveTriageEncounters();
    const signStatus = document.getElementById('triage-sign-status');
    signStatus.hidden = false;
    signStatus.className = 'callout alert-success';
    signStatus.textContent =
      `Triage signed. ${currentClient.name || 'Client'} has been added to the Psychiatry queue with ${finalPriority} priority. You can continue here or open Psychiatric from the left menu.`;
    f.querySelectorAll('input, select, textarea').forEach(control => { control.disabled = true; });
    document.getElementById('save-triage-draft').disabled = true;
    document.getElementById('sign-triage').disabled = true;
  });

  recompute();
}

  { id: 'opioid-therapy', group: 'Treat', name: 'Opioid Agonist Therapy', rateService: 'Opioid Agonist Therapy', actionId: '', options: ['Methadone review', 'Buprenorphine review', 'Naloxone / overdose-risk education'], signal: client => /opioid/i.test([client.diagnosis, ...(client.alerts || []), ...(client.flags || [])].join(' ')), reason: 'Opioid use or withdrawal is documented' },

  { id: 'psychotherapy', group: 'Treat', name: 'Psychotherapy', rateService: 'Psychotherapy', actionId: 'psychotherapy', options: ['CBT session', 'Individual therapy', 'Group therapy', 'Family therapy', 'Psychoeducation'], signal: (client, actions) => actions.some(action => action.id === 'psychotherapy') || client.type === 'outpatient' || /depress|anxiety|panic|bipolar/i.test(client.diagnosis || ''), reason: 'Psychological therapy is in the care plan or a relevant diagnosis is recorded' },
  { id: 'psychosocial', group: 'Support', name: 'Psychosocial Support', rateService: 'Psychosocial Support', actionId: '', options: ['Social-work coordination', 'Peer support', 'Family psychoeducation', 'Case management'], signal: () => false, reason: '' },

  { id: 'attachments', group: 'Support', name: 'Attachments', actionId: '', options: ['Attach clinical document', 'Attach referral / correspondence'], signal: () => false, reason: '' },
  { id: 'discharge', group: 'Close-out', name: 'Discharge', rateService: 'Discharge', actionId: 'followup', options: ['Discharge planning', 'Discharge summary', 'Counter-referral coordination'], signal: client => client.type === 'inpatient', reason: 'The client record indicates inpatient care' },
  { id: 'followup', group: 'Close-out', name: 'Follow-up & After-care', rateService: 'Follow-up & After-care', actionId: 'followup', options: ['Outpatient psychiatry follow-up', 'Missed-appointment follow-up', 'Care-plan review'], signal: (client, actions) => actions.some(action => action.id === 'followup') || Boolean(client.nextAppt), reason: 'Follow-up is in the care plan or an appointment is recorded' }
];

let interventionRecords = [];
let interventionStorageIssue = '';
let interventionScope = 'plan';
let interventionReturnFocus = null;
let interventionDrawerTab = 'Record';
let interventionOpenModuleId = '';

function loadInterventionRecords() {
  try {
    const saved = localStorage.getItem(INTERVENTION_STORAGE_KEY);
    const records = saved ? JSON.parse(saved) : [];
    if (!Array.isArray(records) || records.some(record =>
      !record || typeof record.id !== 'string' || typeof record.clientId !== 'string' ||
      typeof record.actionId !== 'string' || typeof record.moduleId !== 'string' ||
      typeof record.note !== 'string' || typeof record.at !== 'string'
    )) {
      throw new Error('Saved intervention data has an invalid format.');
    }
    return records;
  } catch (error) {
    interventionStorageIssue = 'Saved intervention entries could not be loaded. No records were changed.';
    console.error('Unable to restore intervention records.', error);
    return null;
  }
}

function interventionHistoryFor(client) {
  return interventionRecords
    .filter(record => record.clientId === client.id)
    .sort((a, b) => String(b.at).localeCompare(String(a.at)));
}

function interventionActionsFor(client) {
  if (client.id === 'MRN-20418') return INTERVENTION_ACTIONS;
  const cues = [client.diagnosis, ...(client.alerts || []), ...(client.flags || [])].join(' ');
  return INTERVENTION_ACTIONS.filter(action => {
    if (action.id === 'psychiatry') return Boolean(client.diagnosis);
    if (action.id === 'withdrawal') return /withdrawal|detox|alcohol|opioid/i.test(cues);
    if (action.id === 'safety') return /suicid|self-harm|violence|aggression|safeguard/i.test(cues);
    if (action.id === 'medication') return MEDICATIONS.some(item => item.client === client.name);
    if (action.id === 'psychotherapy') return client.type === 'outpatient' || /depress|anxiety|panic|bipolar/i.test(client.diagnosis || '');
    if (action.id === 'followup') return client.type === 'inpatient' || Boolean(client.nextAppt);
    return false;
  }).map(action => ({
    ...action,
    status: 'Suggested',
    goal: 'Suggested from the diagnosis, alerts, or medication list in this client record.'
  }));
}

function interventionDate(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? 'Date not recorded' : date.toLocaleString();
}

function interventionModuleRecommended(module, client, actions = interventionActionsFor(client)) {
  return module.signal(client, actions);
}

function interventionRateText(module) {
  if (!module.rateService) return 'Not separately priced in Billing';
  const rate = PSYCHIATRY_BILLING_RATES[module.rateService];
  return Number.isFinite(rate) ? `KES ${rate.toLocaleString()} · rate configured in Billing` : 'No rate configured in Billing';
}

function renderInterventionModules(client) {
  const host = document.getElementById('intervention-module-list');
  if (!host) return;
  const actions = interventionActionsFor(client);
  const modules = INTERVENTION_MODULES.filter(module => interventionScope === 'all' ||
    interventionModuleRecommended(module, client, actions) ||
    actions.some(action => action.id === module.actionId)
  );
  const sortedModules = modules.slice().sort((a, b) =>
    [...new Set(INTERVENTION_MODULES.map(module => module.group))].indexOf(a.group) -
      [...new Set(INTERVENTION_MODULES.map(module => module.group))].indexOf(b.group) ||
    Number(interventionModuleRecommended(b, client, actions)) - Number(interventionModuleRecommended(a, client, actions)) ||
    INTERVENTION_MODULES.indexOf(a) - INTERVENTION_MODULES.indexOf(b)
  );
  let activeGroup = '';
  host.innerHTML = sortedModules.map(module => {
    const action = actions.find(item => item.id === module.actionId);
    const recommended = interventionModuleRecommended(module, client, actions);
    const reason = recommended ? module.reason : (action ? `Linked to ${action.name}` : interventionRateText(module));
    const heading = module.group !== activeGroup
      ? (activeGroup = module.group, `<div class="grp">${escapeHTML(module.group)}</div>`)
      : '';
    const delivered = interventionHistoryFor(client)
      .filter(record => record.moduleId === module.id)
      .reduce((total, record) => total + (Number(record.qty) || 1), 0);
    return `${heading}<button class="intervention-module" type="button" data-intervention-module="${escapeHTML(module.id)}" aria-label="Record ${escapeHTML(module.name)}">
      <span class="intervention-module-icon" aria-hidden="true">${escapeHTML(module.name.slice(0, 1))}</span>
      <span class="intervention-module-copy"><span class="intervention-module-title">${escapeHTML(module.name)}${recommended ? '<span class="intervention-recommended">Recommended</span>' : ''}</span><span class="intervention-module-meta">${escapeHTML(recommended ? interventionRateText(module) : reason)}</span></span>
      ${delivered ? `<span class="intervention-delivered">${delivered} delivered</span>` : ''}
      <span aria-hidden="true" style="color:var(--faint);font-size:18px">›</span>
    </button>`;
  }).join('');
  document.getElementById('intervention-plan-count').textContent = String(modules.length);
  document.getElementById('intervention-all-count').textContent = String(INTERVENTION_MODULES.length);
}

function renderInterventionData(client) {
  const history = interventionHistoryFor(client);
  const actionsHost = document.getElementById('intervention-actions');
  if (!actionsHost) return;
  const actions = interventionActionsFor(client);
  actionsHost.innerHTML = actions.map(action => {
    const records = history.filter(record => record.actionId === action.id);
    const count = records.reduce((total, record) => total + (Number(record.qty) || 1), 0);
    const latest = records[0];
    const priority = ['RED', 'ORANGE', 'YELLOW', 'GREEN'].includes(client.priority) ? client.priority : '';

function renderInterventionDrawerTab() {
  const client = currentClient || CLIENTS[0];
  const module = INTERVENTION_MODULES.find(item => item.id === interventionOpenModuleId);
  const recordPanel = document.getElementById('intervention-record-panel');
  const secondaryPanel = document.getElementById('intervention-secondary-panel');
  if (!module || !recordPanel || !secondaryPanel) return;

  document.querySelectorAll('[data-intervention-tab]').forEach(button =>
    button.setAttribute('aria-selected', String(button.dataset.interventionTab === interventionDrawerTab))
  );
  const showingRecord = interventionDrawerTab === 'Record';
  recordPanel.hidden = !showingRecord;
  secondaryPanel.hidden = showingRecord;
  recordPanel.querySelectorAll('input, select, textarea, button').forEach(control => {
    if (control.id !== 'intervention-save') control.disabled = !showingRecord;
  });
  document.getElementById('intervention-save').disabled = !showingRecord || Boolean(interventionStorageIssue);
  if (showingRecord) return;

  if (interventionDrawerTab === 'History') {
    const records = interventionHistoryFor(client).filter(record => record.moduleId === module.id);
    secondaryPanel.innerHTML = records.length
      ? `<div class="card"><div class="card-header">Recorded ${escapeHTML(module.name)} activity</div><div class="card-body">${records.map(record => `<div class="timeline-item"><div class="timeline-title">${escapeHTML(record.intervention || module.name)} <span class="tag">${escapeHTML(interventionDate(record.at))}</span></div><div class="timeline-desc">${escapeHTML(record.note)}${record.response ? `<br>Response: ${escapeHTML(record.response)}` : ''}${record.outcome ? `<br>Outcome: ${escapeHTML(record.outcome)}` : ''}${record.next ? `<br>Next: ${escapeHTML(record.next)}` : ''}<br><span style="color:var(--muted)">${escapeHTML(record.by || 'Provider not recorded')}</span></div></div>`).join('')}</div></div>`
      : `<p class="intervention-live">No ${escapeHTML(module.name.toLowerCase())} entries are recorded for ${escapeHTML(client.name)}.</p>`;
    return;
  }

  const action = interventionActionsFor(client).find(item => item.id === module.actionId);
  const recommended = interventionModuleRecommended(module, client);
  secondaryPanel.innerHTML = `<div class="card"><div class="card-header">About this Psychiatry module</div><div class="card-body">
    <p>${recommended ? escapeHTML(module.reason) : 'No matching diagnosis, alert, or medication entry was found in this client record.'}</p>
    <p style="margin-top:10px"><strong>Care-plan link:</strong> ${escapeHTML(action?.name || 'No matching action in the current care plan; an entry can be saved without a link.')}</p>
    ${action ? `<p style="margin-top:6px"><strong>Plan focus:</strong> ${escapeHTML(action.goal)}</p>` : ''}
    <p style="margin-top:10px"><strong>Record types:</strong> ${module.options.map(option => escapeHTML(option)).join(', ')}</p>
    <p style="margin-top:10px;color:var(--muted)">This is a documentation aid. It does not replace clinical assessment or create a billing event.</p>
  </div></div>`;
}

function initInterventions() {
  const client = currentClient || CLIENTS[0];
  interventionScope = 'plan';
  interventionStorageIssue = '';
  const loadedRecords = loadInterventionRecords();
  interventionRecords = loadedRecords || [];
  const live = document.getElementById('intervention-live');
  if (live && interventionStorageIssue) {
    live.textContent = interventionStorageIssue;
    live.classList.add('error');
  }
  renderInterventionData(client);
  renderInterventionModules(client);

  document.querySelectorAll('[data-intervention-scope]').forEach(button => {
    button.addEventListener('click', () => {
      interventionScope = button.dataset.interventionScope;
      document.querySelectorAll('[data-intervention-scope]').forEach(item =>
        item.setAttribute('aria-pressed', String(item === button))
      );
      renderInterventionModules(client);
    });
  });
  document.getElementById('intervention-module-list')?.addEventListener('click', event => {
    const button = event.target.closest('[data-intervention-module]');
    if (button) openInterventionDrawer(button.dataset.interventionModule);
  });
  document.getElementById('intervention-open-record')?.addEventListener('click', () => openInterventionDrawer('psychiatry'));
  document.getElementById('intervention-drawer-tabs')?.addEventListener('click', event => {
    const button = event.target.closest('[data-intervention-tab]');
    if (!button) return;
    interventionDrawerTab = button.dataset.interventionTab;
    renderInterventionDrawerTab();
  });
  document.getElementById('intervention-chips')?.addEventListener('click', event => {
    const button = event.target.closest('[data-intervention-choice]');
    if (!button) return;
    document.querySelectorAll('#intervention-chips [data-intervention-choice]').forEach(choice =>
      choice.setAttribute('aria-pressed', String(choice === button))
    );
    document.getElementById('intervention-type').value = button.dataset.interventionChoice;
  });

  const overlay = document.getElementById('intervention-overlay');
  document.getElementById('intervention-drawer-close')?.addEventListener('click', closeInterventionDrawer);
  overlay?.addEventListener('click', event => {
    if (event.target === overlay) closeInterventionDrawer();
  });
  overlay?.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !overlay.hidden) {
      closeInterventionDrawer();
      return;
    }
    if (event.key !== 'Tab') return;
    const focusable = [...overlay.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled])')];
    if (!focusable.length) {
      event.preventDefault();
      return;
    }
    if (event.shiftKey && document.activeElement === focusable[0]) {
      event.preventDefault();
      focusable[focusable.length - 1].focus();
    } else if (!event.shiftKey && document.activeElement === focusable[focusable.length - 1]) {
      event.preventDefault();
      focusable[0].focus();
    }
  });

  document.getElementById('intervention-form')?.addEventListener('submit', event => {
    event.preventDefault();
    if (interventionDrawerTab !== 'Record') return;
    const note = document.getElementById('intervention-note').value.trim();
    const module = INTERVENTION_MODULES.find(item =>
      item.options.includes(document.getElementById('intervention-type').value)
    );
    const quantity = Number(document.getElementById('intervention-quantity').value);
    if (!note || !module || !Number.isInteger(quantity) || quantity < 1) {
      const status = document.getElementById('intervention-form-live');
      status.textContent = 'Enter a clinical note and a quantity of at least 1.';
      status.classList.add('error');
      return;
    }
    const record = {
      id: `INT-${Date.now()}`,
      clientId: client.id,
      actionId: document.getElementById('intervention-action').value,
      moduleId: module.id,
      moduleName: module.name,
      intervention: document.getElementById('intervention-type').value,
      qty: quantity,
      note,
      response: document.getElementById('intervention-response').value.trim(),
      outcome: document.getElementById('intervention-outcome').value.trim(),
      next: document.getElementById('intervention-next').value.trim(),
      completesAction: document.getElementById('intervention-complete').checked,
      at: new Date().toISOString(),
      by: 'J. Njoroge, RN'
    };
    const nextRecords = [...interventionRecords, record];
    try {
      localStorage.setItem(INTERVENTION_STORAGE_KEY, JSON.stringify(nextRecords));
    } catch (error) {
      console.error('Unable to save intervention record.', error);
      const status = document.getElementById('intervention-form-live');
      status.textContent = 'This intervention could not be saved in this browser. No record was added.';
      status.classList.add('error');
      return;
    }
    interventionRecords = nextRecords;
    closeInterventionDrawer();
    renderInterventionData(client);
    renderInterventionModules(client);
    const status = document.getElementById('intervention-live');
    status.textContent = `Intervention recorded for ${client.name}.`;
    status.classList.remove('error');
  });
}

const PSYCHIATRY_BILLING_RATES = {
  "Emergency Care": 5000,
  "Blood Work": 900,
  "Medical Review": 3000,
  "Appointments": 2000,
  "Psychiatry": 6000,
  "Admission": 15000,
  "Withdrawal Management (Detox)": 12000,
  "Opioid Agonist Therapy": 600,
  "Psychiatric Nursing": 8000,
  "Psychotherapy": 5000,
  "Psychosocial Support": 2000,
  "Nutrition & Fitness": 1500,
  "Discharge": 4000,
  "Follow-up & After-care": 2500
};
const PSYCHIATRY_BILLING_STORAGE_KEY = "citramac.v4.session";

function readBillingEvents() {
  let raw;
  try {
    raw = localStorage.getItem(PSYCHIATRY_BILLING_STORAGE_KEY);
  } catch (error) {
    console.error("Unable to read saved Psychiatry billing records.", error);
    return { events: [], issue: "Billing records could not be read from browser storage.", unavailable: true };
  }
  if (!raw) return { events: [], issue: "" };

  let snapshot;
  try {
    snapshot = JSON.parse(raw);
  } catch (error) {
    console.error("Saved Psychiatry billing records contain invalid JSON.", error);
    return { events: [], issue: "Saved billing records could not be read. Please contact your system administrator.", unavailable: true };
  }
  if (snapshot?.v !== 4 || !Array.isArray(snapshot.patients)) {
    console.error("Saved Psychiatry billing records have an unsupported data format.");
    return { events: [], issue: "Saved billing records use an unsupported format.", unavailable: true };
  }

  const events = [];
  const unpricedServices = new Set();
  snapshot.patients.forEach(patient => {
    const delivered = patient?.delivered && typeof patient.delivered === "object" ? patient.delivered : {};
    const clientEvents = [];
    Object.entries(delivered).forEach(([service, records]) => {
      const rate = PSYCHIATRY_BILLING_RATES[service];
      if (!Array.isArray(records)) return;
      records.forEach(record => {
        const quantity = Number(record?.qty);
        if (!(quantity > 0) || !Number.isFinite(quantity)) return;
        if (!Number.isFinite(rate)) {
          unpricedServices.add(service);
          return;
        }
        clientEvents.push({
          clientId: String(patient.id || ""),
          clientName: String(patient.reg?.preferredName || patient.reg?.name || "Client record"),
          payer: String(snapshot.hie?.[patient.id]?.payer || patient.reg?.payer?.scheme || patient.reg?.payer || "Not recorded"),
          service,
          at: record.at || "",
          quantity,
          amount: quantity * rate,
          paidAmount: 0,
          paidClaimedAmount: 0,
          paidUnbilledAmount: 0,
          claimedAmount: 0,
          unbilledAmount: 0,
          status: "unbilled"
        });
      });
    });
    if (!clientEvents.length) return;

    const byDateAscending = (a, b) => {
      const dateA = new Date(a.at).getTime();
      const dateB = new Date(b.at).getTime();
      return (Number.isFinite(dateA) ? dateA : 0) - (Number.isFinite(dateB) ? dateB : 0);
    };
    clientEvents.sort(byDateAscending);

    const claim = patient.claim && typeof patient.claim === "object" ? patient.claim : {};
    const claimStage = Number(claim.stage) > 0 || Boolean(claim.submittedAt);
    const claimedQty = new Map();
    if (claimStage) {
      const submittedLines = Array.isArray(claim.submittedLines)
        ? claim.submittedLines
        : Object.keys(delivered).map(service => ({
            name: service,
            qty: Array.isArray(delivered[service])
              ? delivered[service].reduce((sum, record) => sum + Math.max(0, Number(record?.qty) || 0), 0)
              : 0
          }));
      submittedLines.forEach(line => {
        const quantity = Number(line?.qty);
        if (line?.name && quantity > 0 && Number.isFinite(quantity)) {
          claimedQty.set(line.name, (claimedQty.get(line.name) || 0) + quantity);
        }
      });
    }

    const submittedAmount = Number(claim.submittedAmount);
    const hasSubmittedAmount = claimStage && claim.submittedAmount != null && Number.isFinite(submittedAmount);
    let claimBudget = hasSubmittedAmount
      ? Math.max(0, submittedAmount)
      : clientEvents.reduce((sum, event) => sum + Math.min(event.quantity, claimedQty.get(event.service) || 0) * (event.amount / event.quantity), 0);
    clientEvents.forEach(event => {
      const availableQty = claimedQty.get(event.service) || 0;
      const eligibleAmount = Math.min(event.quantity, availableQty) * (event.amount / event.quantity);
      const claimedAmount = Math.min(eligibleAmount, claimBudget);
      event.claimedAmount = claimedAmount;
      event.unbilledAmount = event.amount - claimedAmount;
      claimBudget = Math.max(0, claimBudget - claimedAmount);
      claimedQty.set(event.service, Math.max(0, availableQty - Math.min(event.quantity, availableQty)));
    });

    const payments = Array.isArray(patient.payments) ? patient.payments : [];
    let paymentBudget = payments.reduce((sum, payment) => {
      const amount = Number(payment?.amount);
      return sum + (Number.isFinite(amount) && amount > 0 ? amount : 0);
    }, 0);
    clientEvents.filter(event => event.claimedAmount > 0).forEach(event => {
      event.paidClaimedAmount = Math.min(event.claimedAmount, paymentBudget);
      event.paidAmount += event.paidClaimedAmount;
      paymentBudget = Math.max(0, paymentBudget - event.paidClaimedAmount);
    });
    clientEvents.filter(event => event.unbilledAmount > 0).forEach(event => {
      event.paidUnbilledAmount = Math.min(event.unbilledAmount, paymentBudget);
      event.paidAmount += event.paidUnbilledAmount;
      paymentBudget = Math.max(0, paymentBudget - event.paidUnbilledAmount);
    });
    clientEvents.forEach(event => {
      const unpaid = event.amount - event.paidAmount;
      if (unpaid <= 0) event.status = "paid";
      else if (event.paidAmount > 0) event.status = "partial";
      else if (event.claimedAmount > 0 && event.unbilledAmount > 0) event.status = "partial-claim";
      else if (event.claimedAmount > 0) event.status = "claimed";
      else event.status = "unbilled";
    });
    events.push(...clientEvents);
  });

  if (unpricedServices.size) {
    console.warn("Delivered billing services were excluded because no rate is configured:", [...unpricedServices]);
  }
  return {
    events: events.sort((a, b) => {
      const dateA = new Date(a.at).getTime();
      const dateB = new Date(b.at).getTime();
      return (Number.isFinite(dateB) ? dateB : 0) - (Number.isFinite(dateA) ? dateA : 0);
    }),
    issue: unpricedServices.size
      ? `Some delivered services were not included because their rates are not configured: ${[...unpricedServices].join(", ")}.`
      : "",
    unavailable: false
  };
}

  };
  const metrics = [

    { key: "unbilled", label: "Unbilled", amount: unbilled, detail: `${unbilledEventCount} ${unbilledEventCount === 1 ? "event" : "events"} with a balance`, tone: "var(--urgent)" },
    { key: "claimed", label: "Claimed", amount: claimed, detail: `${claimedEventCount} ${claimedEventCount === 1 ? "event" : "events"} with a balance`, tone: "var(--focus)" },
    { key: "paid", label: "Paid", amount: paid, detail: `${paidEventCount} ${paidEventCount === 1 ? "event" : "events"} settled`, tone: "var(--routine)" }
  ];
  const tableRows = events.length

        const statusLabel = event.status === "partial" ? "Part paid" : event.status === "partial-claim" ? "Part claimed" : event.status;
        return `<tr>

          <td>${escapeHTML(event.service)}</td>

    : `<tr><td colspan="6"><div class="billing-empty"><strong>${issue ? "Billing data unavailable" : "No billable events yet"}</strong><span>${escapeHTML(issue || "Delivered services recorded in the Psychiatry module will appear here.")}</span></div></td></tr>`;

  return `

      <div>

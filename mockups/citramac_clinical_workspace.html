function validOutcomeDate(value) {
  if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const date = new Date(`${value}T00:00:00Z`);
  return !Number.isNaN(date.getTime()) && date.toISOString().slice(0, 10) === value;
}

function loadOutcomeScores() {
  outcomeStorageIssue = "";
  try {
    const saved = localStorage.getItem(OUTCOME_SCORE_STORAGE_KEY);
    const records = saved ? JSON.parse(saved) : [];
    if (!Array.isArray(records) || records.some(record =>
      !record || typeof record.id !== "string" || typeof record.clientId !== "string" ||
      !Object.hasOwn(OUTCOME_MEASURES, record.measure) ||
      !Number.isInteger(record.score) || record.score < 0 ||
      record.score > OUTCOME_MEASURES[record.measure].max ||
      !validOutcomeDate(record.date) || typeof record.recordedAt !== "string" ||
      typeof record.provider !== "string" || typeof record.note !== "string"
    )) {
      throw new Error("Saved outcome data has an invalid format.");
    }
    outcomeScoreRecords = records;
  } catch (error) {
    outcomeStorageIssue = "Outcome measures could not be loaded. Existing saved data was left unchanged.";
    outcomeStatus = outcomeStorageIssue;
    outcomeStatusState = "error";
    console.error("Unable to restore outcome measures.", error);
  }
}

function saveOutcomeScores(records) {
  try {
    localStorage.setItem(OUTCOME_SCORE_STORAGE_KEY, JSON.stringify(records));
    return true;
  } catch (error) {
    console.error("Unable to save outcome measure.", error);
    outcomeStatus = "This score could not be saved in this browser. No record was added.";
    outcomeStatusState = "error";
    return false;
  }
}

function outcomeScoresFor(clientId, measure) {
  return outcomeScoreRecords
    .filter(record => record.clientId === clientId && (!measure || record.measure === measure))
    .sort((a, b) => a.date.localeCompare(b.date) || a.recordedAt.localeCompare(b.recordedAt));
}

function outcomeBand(measure, score) {
  if (measure === "phq9") {
    if (score < 5) return "Minimal";
    if (score < 10) return "Mild";
    if (score < 15) return "Moderate";
    if (score < 20) return "Moderately severe";
    return "Severe";
  }
  if (score < 5) return "Minimal";
  if (score < 10) return "Mild";
  if (score < 15) return "Moderate";
  return "Severe";
}

function outcomeScoreDate(value) {
  if (!validOutcomeDate(value)) return "Date not recorded";
  return new Date(`${value}T12:00:00`).toLocaleDateString(undefined, {
    year: "numeric", month: "short", day: "numeric"
  });
}

function outcomeTrend(records, measure) {
  if (records.length < 2) return { label: "Baseline only", direction: "neutral" };
  const first = records[0].score;
  const latest = records[records.length - 1].score;
  const change = latest - first;
  if (!change) return { label: "No change", direction: "neutral" };
  const improved = OUTCOME_MEASURES[measure].higherIsWorse ? change < 0 : change > 0;
  return {
    label: `${improved ? "Improved" : "Worsened"} ${Math.abs(change)} point${Math.abs(change) === 1 ? "" : "s"}`,
    direction: improved ? "better" : "worse"
  };
}

function outcomeChartSVG(records, measure) {
  const definition = OUTCOME_MEASURES[measure];
  if (!records.length) {
    return '<div class="outcome-chart-empty">No scores recorded yet. Add a completed measure below to start this client’s trend.</div>';
  }
  const width = 440, height = 174, left = 36, right = 13, top = 14, bottomPad = 32;
  const plotWidth = width - left - right, plotHeight = height - top - bottomPad;
  const bottom = top + plotHeight;
  const scores = records.map(record => record.score);
  const x = scores.map((_, index) => scores.length === 1
    ? left + plotWidth / 2
    : left + index * plotWidth / (scores.length - 1));
  const y = scores.map(score => top + (1 - score / definition.max) * plotHeight);
  const grid = [0, .25, .5, .75, 1].map(fraction => {
    const value = Math.round(definition.max * fraction);
    const lineY = top + (1 - fraction) * plotHeight;
    return `<line class="grid-line" x1="${left}" x2="${width - right}" y1="${lineY}" y2="${lineY}"/><text class="axis-label" x="${left - 7}" y="${lineY + 3.5}" text-anchor="end">${value}</text>`;
  }).join("");
  const path = x.map((position, index) =>
    `${index ? "L" : "M"}${position.toFixed(1)},${y[index].toFixed(1)}`
  ).join(" ");
  const area = scores.length > 1
    ? `<path class="trend-area" d="${path} L${x[x.length - 1].toFixed(1)},${bottom} L${x[0].toFixed(1)},${bottom} Z"/>`
    : "";
  const points = records.map((record, index) => {
    const details = `${outcomeScoreDate(record.date)} · ${record.score}/${definition.max} · ${outcomeBand(measure, record.score)}${record.provider ? ` · ${record.provider}` : ""}${record.note ? ` · ${record.note}` : ""}`;
    return `<circle class="trend-point${index === records.length - 1 ? " latest" : ""}" cx="${x[index].toFixed(1)}" cy="${y[index].toFixed(1)}" r="${index === records.length - 1 ? 5 : 4}"><title>${escapeHTML(details)}</title></circle>`;
  }).join("");
  const labels = scores.length === 1
    ? `<text class="point-label" x="${x[0]}" y="${y[0] - 10}" text-anchor="middle">${scores[0]}</text>`
    : `<text class="point-label" x="${x[0] + 5}" y="${y[0] - 9}" text-anchor="start">${scores[0]}</text><text class="point-label" x="${x[x.length - 1] - 5}" y="${y[y.length - 1] - 9}" text-anchor="end">${scores[scores.length - 1]}</text>`;
  const dates = records.map(record => outcomeScoreDate(record.date));
  const dateLabels = dates.length === 1
    ? `<text class="axis-label" x="${x[0]}" y="${height - 7}" text-anchor="middle">${escapeHTML(dates[0])}</text>`
    : `<text class="axis-label" x="${left}" y="${height - 7}" text-anchor="start">${escapeHTML(dates[0])}</text><text class="axis-label" x="${width - right}" y="${height - 7}" text-anchor="end">${escapeHTML(dates[dates.length - 1])}</text>`;
  const description = `${definition.label}, score scale 0 to ${definition.max}. ${records.map(record => `${outcomeScoreDate(record.date)}: ${record.score}`).join("; ")}.`;
  return `<svg class="outcome-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHTML(description)}"><title>${definition.label} score trend</title><desc>${escapeHTML(description)}</desc>${grid}${area}${scores.length > 1 ? `<path class="trend-line" d="${path}"/>` : ""}${points}${labels}${dateLabels}</svg>`;
}

function outcomeMeasureCard(clientId, measure) {
  const definition = OUTCOME_MEASURES[measure];
  const records = outcomeScoresFor(clientId, measure);
  const baseline = records[0];
  const latest = records[records.length - 1];
  return `<article class="outcome-chart-card">
    <div class="outcome-chart-top"><h3>${definition.label}</h3></div>
    ${latest ? `<div class="outcome-latest"><span class="outcome-latest-label">Latest</span><strong class="outcome-latest-score">${latest.score}</strong><span class="outcome-latest-scale">/ ${definition.max}</span></div>
      <div class="outcome-baseline">Baseline <strong>${baseline.score}</strong> · ${escapeHTML(outcomeScoreDate(baseline.date))}</div>`
      : `<div class="outcome-baseline">Scale: 0–${definition.max}${measure === "phq9" ? " · lower scores indicate fewer symptoms" : " · lower scores indicate fewer symptoms"}</div>`}
    <div class="outcome-svg-wrap"><div class="outcome-svg-heading"><span>Score trend</span><span>Scale 0–${definition.max}</span></div>${outcomeChartSVG(records, measure)}</div>
    ${latest ? `<div class="outcome-band"><strong>${escapeHTML(outcomeBand(measure, latest.score))} · ${escapeHTML(outcomeScoreDate(latest.date))}</strong><span class="outcome-provider">${escapeHTML(latest.provider || "Provider not recorded")}</span></div>` : ""}
  </article>`;
}

function outcomeMeasureSummary(clientId, measure) {
  const definition = OUTCOME_MEASURES[measure];
  const records = outcomeScoresFor(clientId, measure);
  const latest = records[records.length - 1];
  return `<article class="outcome-metric-card">
    <div class="outcome-metric-top"><h3>${definition.label}</h3><span class="outcome-metric-date">${latest ? `Latest · ${escapeHTML(outcomeScoreDate(latest.date))}` : "No baseline recorded"}</span></div>
    ${latest
      ? `<div class="outcome-metric-score"><strong>${latest.score}</strong><span>/ ${definition.max}</span></div><div class="outcome-metric-band">${escapeHTML(outcomeBand(measure, latest.score))}</div>`
      : '<div class="outcome-metric-empty">—</div>'}
  </article>`;
}

function outcomeLatestScores(clientId) {
  const records = outcomeScoresFor(clientId).slice().reverse().slice(0, 5);
  if (!records.length) return '<div class="outcome-dashboard-empty">No completed outcome measures are recorded for this client yet.</div>';
  return `<div class="outcome-latest-table-wrap"><table class="outcome-latest-table">
    <thead><tr><th>Date</th><th>Measure</th><th>Score</th><th>Severity band</th><th>Provider</th></tr></thead>
    <tbody>${records.map(record => `<tr><td>${escapeHTML(outcomeScoreDate(record.date))}</td><td><strong>${OUTCOME_MEASURES[record.measure].label}</strong></td><td class="score">${record.score} / ${OUTCOME_MEASURES[record.measure].max}</td><td>${escapeHTML(outcomeBand(record.measure, record.score))}</td><td>${escapeHTML(record.provider || "Not recorded")}</td></tr>`).join("")}</tbody>
  </table></div>`;
}

function outcomeHistoryTable(clientId) {
  const records = outcomeScoresFor(clientId).slice().reverse();
  if (!records.length) return '<div class="record-empty-state" style="margin:16px;">No outcome measures recorded for this client yet.</div>';
  return `<div class="outcome-table-wrap"><table class="outcome-table"><thead><tr><th>Measure</th><th>Date</th><th class="num">Score</th><th>Band</th><th>Provider</th><th>Note</th></tr></thead><tbody>${records.map(record => `<tr><td><strong>${OUTCOME_MEASURES[record.measure].label}</strong></td><td>${escapeHTML(outcomeScoreDate(record.date))}</td><td class="num">${record.score} / ${OUTCOME_MEASURES[record.measure].max}</td><td>${escapeHTML(outcomeBand(record.measure, record.score))}</td><td>${escapeHTML(record.provider || "Not recorded")}</td><td>${escapeHTML(record.note || "—")}</td></tr>`).join("")}</tbody></table></div>`;
}

function outcomeWorkspace(client) {
  const records = outcomeScoresFor(client.id);
  const latest = records[records.length - 1];
  const today = new Date();
  const localToday = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
  const allMeasures = Object.keys(OUTCOME_MEASURES).map(key => `<option value="${key}">${OUTCOME_MEASURES[key].label}</option>`).join("");
  return `<div class="outcome-panel" id="outcome-panel" data-client-id="${escapeHTML(client.id)}">
    <section class="outcome-overview-grid" aria-label="Outcome overview">
      <div class="outcome-overview-card">
        <div class="outcome-overview-main">
          <div><span class="outcome-overview-label">Outcome measures</span><h2>Clinical progress</h2>
            <p class="outcome-overview-copy">Review scores from completed PHQ-9 and GAD-7 assessments for ${escapeHTML(client.name)}. Scores are recorded as entered and are not inferred.</p>
          </div>
          <div class="outcome-overview-count"><strong>${records.length}</strong><span>assessment${records.length === 1 ? "" : "s"} recorded</span></div>
        </div>
        <div class="outcome-overview-actions"><button class="btn" type="button" data-outcome-scroll="outcome-record">Record a measure</button><button class="btn ghost sm" type="button" data-outcome-history>View score history</button></div>
      </div>
      <aside class="outcome-guidance-card">
        <div><span class="outcome-overview-label">Clinical use</span><h3>Use completed assessments</h3><p>Enter the result from an appropriate completed measure. Review scores alongside the client’s clinical presentation and care plan.</p></div>
        ${latest ? `<p class="outcome-guidance-latest"><strong>Most recent:</strong> ${OUTCOME_MEASURES[latest.measure].label} · ${latest.score}/${OUTCOME_MEASURES[latest.measure].max} · ${escapeHTML(outcomeScoreDate(latest.date))}</p>` : '<p class="outcome-guidance-latest">No completed measure has been recorded yet.</p>'}
      </aside>
    </section>
    <section class="outcome-dashboard-metrics" aria-label="Latest scores by measure">${Object.keys(OUTCOME_MEASURES).map(key => outcomeMeasureSummary(client.id, key)).join("")}</section>
    <section class="outcome-dashboard-card" aria-labelledby="outcome-latest-title">
      <div class="outcome-dashboard-card-head"><h2 id="outcome-latest-title">Latest scores</h2><button class="btn ghost sm" type="button" data-outcome-history>View all</button></div>
      ${outcomeLatestScores(client.id)}
    </section>
    <section class="outcome-dashboard-card" id="outcome-trends" aria-labelledby="outcome-chart-title">
      <div class="outcome-dashboard-card-head"><div><h2 id="outcome-chart-title">Score trends</h2><span class="outcome-section-subtitle">Baseline and repeat assessment results</span></div><button class="btn ghost sm" type="button" data-outcome-view>${outcomeView === "charts" ? "View as table" : "View as charts"}</button></div>
      ${outcomeView === "charts" ? `<div class="outcome-chart-grid">${Object.keys(OUTCOME_MEASURES).map(key => outcomeMeasureCard(client.id, key)).join("")}</div><p class="outcome-note">Scores show recorded results only. Lower scores indicate fewer symptoms; change is descriptive and does not replace clinical interpretation.</p>` : outcomeHistoryTable(client.id)}
    </section>
    <section class="card outcome-section" id="outcome-record" aria-labelledby="outcome-record-title">
      <div class="outcome-section-head"><div><h2 class="outcome-section-title" id="outcome-record-title">Record a measure <span class="outcome-section-subtitle">enter the result from a completed assessment</span></h2></div></div>
      <form class="outcome-form" id="outcome-form">
        <div class="outcome-form-grid">
          <div class="field"><label for="outcome-measure">Measure</label><select id="outcome-measure" name="measure" required>${allMeasures}</select></div>
          <div class="field"><label for="outcome-score">Score</label><input id="outcome-score" name="score" type="number" min="0" max="27" step="1" required inputmode="numeric" placeholder="0–27"></div>
          <div class="field"><label for="outcome-date">Assessment date</label><input id="outcome-date" name="date" type="date" value="${localToday}" required></div>
          <div class="field"><label for="outcome-provider">Provider <span class="hint">(optional)</span></label><input id="outcome-provider" name="provider" maxlength="100" autocomplete="name" placeholder="Name"></div>
          <div class="field outcome-note-field"><label for="outcome-note">Clinical note <span class="hint">(optional)</span></label><input id="outcome-note" name="note" maxlength="400" placeholder="Brief context for this measure"></div>
        </div>
        <div class="outcome-form-actions"><p class="outcome-status" id="outcome-status" role="status" aria-live="polite" data-state="${escapeHTML(outcomeStatusState)}">${escapeHTML(outcomeStatus || outcomeStorageIssue)}</p><button class="btn" type="submit" ${outcomeStorageIssue ? "disabled" : ""}>Record score</button></div>
      </form>
      <div class="callout outcome-measure-form-note"><span><b>Clinical use:</b> Enter a score from a completed, appropriate version of the measure. The chart does not calculate or infer scores.</span></div>
    </section>
  </div>`;
}

function initOutcomes() {
  const panel = document.getElementById("outcome-panel");
  if (!panel) return;
  panel.addEventListener("change", event => {
    if (event.target.id !== "outcome-measure") return;
    const scoreInput = panel.querySelector("#outcome-score");
    const max = OUTCOME_MEASURES[event.target.value].max;
    scoreInput.max = String(max);
    scoreInput.placeholder = `0–${max}`;
    scoreInput.setCustomValidity(Number(scoreInput.value) > max ? `Enter a score from 0 to ${max}.` : "");
  });
  panel.addEventListener("input", event => {
    if (event.target.id !== "outcome-score") return;
    const max = OUTCOME_MEASURES[panel.querySelector("#outcome-measure").value].max;
    event.target.setCustomValidity(Number(event.target.value) > max ? `Enter a score from 0 to ${max}.` : "");
  });
  panel.addEventListener("click", event => {
    if (event.target.closest("[data-outcome-scroll]")) {
      document.getElementById("outcome-record")?.scrollIntoView({ behavior: "smooth", block: "start" });
      panel.querySelector("#outcome-measure")?.focus({ preventScroll: true });
      return;
    }
    if (event.target.closest("[data-outcome-history]")) {
      outcomeView = "table";
      panel.innerHTML = outcomeWorkspace(currentClient || CLIENTS[0]).replace(/^<div[^>]*>|<\/div>$/g, "");
      document.getElementById("outcome-trends")?.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    if (event.target.closest("[data-outcome-view]")) {
      outcomeView = outcomeView === "charts" ? "table" : "charts";
      panel.innerHTML = outcomeWorkspace(currentClient || CLIENTS[0]).replace(/^<div[^>]*>|<\/div>$/g, "");
    }
  });
  panel.addEventListener("submit", event => {
    if (event.target.id !== "outcome-form") return;
    event.preventDefault();
    const form = event.target;
    const measure = form.elements.measure.value;
    const definition = OUTCOME_MEASURES[measure];
    const score = Number(form.elements.score.value);
    const date = form.elements.date.value;
    if (!definition || !Number.isInteger(score) || score < 0 || score > definition.max || !validOutcomeDate(date)) {
      outcomeStatus = "Enter a whole-number score within the selected measure’s range and a valid assessment date.";
      outcomeStatusState = "error";
      renderOutcomesPanel();
      return;
    }
    const client = currentClient || CLIENTS[0];
    const record = {
      id: `OUT-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      clientId: client.id,
      measure,
      score,
      date,
      provider: form.elements.provider.value.trim(),
      note: form.elements.note.value.trim(),
      recordedAt: new Date().toISOString()
    };
    const nextRecords = [...outcomeScoreRecords, record];
    if (!saveOutcomeScores(nextRecords)) {
      renderOutcomesPanel();
      return;
    }
    outcomeScoreRecords = nextRecords;
    outcomeStatus = `${definition.label} score recorded for ${client.name}.`;
    outcomeStatusState = "success";
    renderOutcomesPanel();
  });
}

function renderOutcomesPanel() {
  const panel = document.getElementById("outcome-panel");
  if (panel) panel.innerHTML = outcomeWorkspace(currentClient || CLIENTS[0]).replace(/^<div[^>]*>|<\/div>$/g, "");
}

function outcomes() {
  const c = currentClient || CLIENTS[0];
  loadOutcomeScores();
  outcomeStatus = outcomeStorageIssue;
  outcomeStatusState = outcomeStorageIssue ? "error" : "";
  return `
    <div class="page-header">
      <div>
        <h1 class="page-title">Outcomes</h1>
        <p class="page-subtitle">Review progress and update outcome measures for ${escapeHTML(c.name)}</p>
      </div>
    </div>

    ${renderClientBanner(c)}

    ${clientNav('outcomes')}

    <div id="outcome-workspace">${outcomeWorkspace(c)}</div>
    <div class="card" style="margin-top: 16px;">
      <div class="card-header">Care Plan Review</div>
      <div class="card-body">
        <p class="record-empty-state">Review progress against the client's documented care plan alongside these outcome measures.</p>
        <button class="btn ghost sm" type="button" onclick="openJourneyStage('careplan')">Review Care Plan</button>
      </div>
    </div>
  `;
}

// ═══════════ PAGE: FOLLOW-UP ═══════════
function followup() {
  const c = currentClient || CLIENTS[0];
  const appointments = APPOINTMENTS
    .filter(appointment => appointment.clientId === c.id)
    .sort((a, b) => `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`));
  return `
    <div class="page-header">
      <div>
        <h1 class="page-title">Follow-up</h1>
        <p class="page-subtitle">Plan and review ongoing care for ${escapeHTML(c.name)}</p>
      </div>
      <button class="btn ghost" type="button" onclick="showPage('appointments')">Schedule Appointment</button>
    </div>

    ${renderClientBanner(c)}

    ${clientNav('followup')}

    <div class="card">
      <div class="card-header">Follow-up Schedule</div>
      <div class="card-body" style="padding: 0;">
        <table class="data-table">
          <thead><tr><th>Date</th><th>Time</th><th>Type</th><th>Provider</th><th>Status</th></tr></thead>
          <tbody>
            ${appointments.length ? appointments.map(appointment => `
              <tr>
                <td>${escapeHTML(appointment.date)}</td>
                <td>${escapeHTML(appointment.time)}</td>
                <td>${escapeHTML(appointment.type)}</td>
                <td>${escapeHTML(appointment.provider)}</td>
                <td><span class="tag">${escapeHTML(appointment.status)}</span></td>
              </tr>
            `).join('') : '<tr><td colspan="5" class="triage-worklist-empty">No follow-up appointments are currently scheduled for this client.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

restoreTier1Registrations();
document.getElementById('content').innerHTML = dashboard();
</script>

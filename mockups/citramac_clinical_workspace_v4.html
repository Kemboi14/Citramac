          <label class="field" for="group-category-to-edit"><span>Category to modify</span><select id="group-category-to-edit" required>${categoryOptions}</select></label>
          <label class="field" for="group-edited-category"><span>Updated category name</span><input id="group-edited-category" type="text" maxlength="100" required></label>
          <button class="btn ghost sm" type="submit">Modify category</button>
        </form>
        <div class="group-note" style="margin-top:8px">Configured: ${groupProgrammeStore.categories.map(escapeHTML).join(" · ")}</div>
      </div>
    </details>
    <details class="group-history-details">
      <summary>Session history and corrections</summary>
    <section class="card">
      <div class="card-header">Recent sessions and attendance</div>
      <div class="card-body">
        ${recentSessions.length ? `<div class="group-history">${recentSessions.map(session => `<article class="group-history-item">
          <h3>${escapeHTML(session.category)} · ${escapeHTML(session.topic)}</h3>
          <div class="group-history-detail">${escapeHTML(session.sessionDate)} · ${escapeHTML(session.startTime)}–${escapeHTML(session.endTime)} · Facilitator: ${escapeHTML(session.facilitator)} · Documented by ${escapeHTML(session.author)}</div>
          <div class="group-history-detail">${session.clientEntries.length} client records linked · ${session.clientEntries.filter(entry => entry.attendance === "Present").length} present · ${session.clientEntries.filter(entry => entry.attendance !== "Present").length} not present</div>
          <div class="group-history-detail">${session.clientEntries.filter(entry => entry.followUpRequired && entry.followUpStatus !== "Completed").length} individual follow-up task(s) outstanding. Individual observations are not displayed in this shared session list.</div>
          <button class="btn ghost sm" type="button" data-amend-session-details="${escapeHTML(session.id)}">Correct session details</button>
          <button class="btn ghost sm" type="button" data-amend-session="${escapeHTML(session.id)}">Correct a client entry</button>
        </article>`).join("")}</div>` : '<div class="group-note">No group sessions have been confirmed.</div>'}
      </div>
    </section>
    </details>
    <div id="group-programme-modal-root"></div>
  </div>`;
}

let pendingGroupProgrammeSession = null;

function openGroupProgrammeEditor(appointmentIndex = "") {
  const details = document.getElementById("group-session-editor");
  const form = document.getElementById("group-session-form");
  if (!details || !form) return;
  details.open = true;
  groupProgrammeStatusMessage = "";
  form.reset();
  document.getElementById("group-session-date").value = dateOffset(0);
  document.getElementById("group-other-category-field").hidden = true;
  document.getElementById("group-other-category").required = false;
  document.querySelectorAll("#group-client-rows tr").forEach(row => {
    row.querySelector("[data-group-attendance]").value = "";
    row.querySelector("[data-group-observation]").value = "";
    row.querySelector("[data-group-risk]").checked = false;
    row.querySelector("[data-group-follow-up]").checked = false;
    row.querySelector("[data-group-follow-up]").required = false;
    row.querySelector("[data-group-observation]").required = false;
  });
  document.getElementById("group-scheduled").value = "";
  document.getElementById("group-filter-programme").value = groupProgrammeWorkspaceFilters.programme;
  document.getElementById("group-filter-unit").value = groupProgrammeWorkspaceFilters.unit;
  document.getElementById("group-filter-eligibility").value = groupProgrammeWorkspaceFilters.eligibility;
  if (appointmentIndex !== "") {
    const scheduledSelect = document.getElementById("group-scheduled");
    scheduledSelect.value = String(appointmentIndex);
    scheduledSelect.dispatchEvent(new Event("change"));
  }
  document.getElementById("group-session-review").replaceChildren();
  pendingGroupProgrammeSession = null;
  filterGroupProgrammeClients();
  details.scrollIntoView({ behavior: "smooth", block: "start" });
}

function updateGroupProgrammeDraft(clientId, updates) {
  const sessionKey = groupProgrammeSelectedSessionId;
  if (!sessionKey.startsWith("appointment:") && !sessionKey.startsWith("draft:")) return;
  const draft = groupProgrammeDraftAttendance[sessionKey] || (groupProgrammeDraftAttendance[sessionKey] = {});
  draft[clientId] = { ...(draft[clientId] || {}), ...updates };
}

function submitGroupProgrammeWorkspaceReview() {
  const selected = groupProgrammeWorkspaceItems(APPOINTMENTS.filter(isGroupPsychotherapyAppointment))
    .find(item => item.key === groupProgrammeSelectedSessionId);
  if (!selected || (selected.kind !== "scheduled" && selected.kind !== "draft")) return;
  openGroupProgrammeEditor(selected.kind === "scheduled" ? selected.appointmentIndex : "");
  document.getElementById("group-filter-programme").value = groupProgrammeWorkspaceFilters.programme;
  document.getElementById("group-filter-unit").value = groupProgrammeWorkspaceFilters.unit;
  document.getElementById("group-filter-eligibility").value = groupProgrammeWorkspaceFilters.eligibility;
  filterGroupProgrammeClients();
  const draft = groupProgrammeDraftAttendance[selected.key] || {};
  document.querySelectorAll("#group-client-rows tr").forEach(row => {
    const entry = draft[row.dataset.clientId] || {};
    row.querySelector("[data-group-attendance]").value = entry.attendance || "";
    row.querySelector("[data-group-observation]").value = entry.observation || "";
    const risk = row.querySelector("[data-group-risk]");
    risk.checked = Boolean(entry.riskDisclosure);
    risk.dispatchEvent(new Event("change", { bubbles: true }));
    row.querySelector("[data-group-follow-up]").checked = Boolean(entry.followUpRequired || entry.riskDisclosure);
  });
  const form = document.getElementById("group-session-form");
  form.requestSubmit();
}

function initGroupProgramme() {
  const form = document.getElementById("group-session-form");
  if (!form) return;
  const workspace = document.querySelector(".group-workspace");
  document.getElementById("group-programme-view-tabs").addEventListener("click", event => {
    const button = event.target.closest("[data-group-view]");
    if (!button) return;
    groupProgrammeView = button.dataset.groupView;
    showPage("group-programme");
  });
  workspace?.addEventListener("click", event => {
    const observationToggle = event.target.closest("[data-group-observation-toggle]");
    if (observationToggle) {
      const observationKey = observationToggle.dataset.groupObservationToggle;
      const isOpen = !groupProgrammeObservationOpen[observationKey];
      groupProgrammeObservationOpen[observationKey] = isOpen;
      observationToggle.setAttribute("aria-expanded", String(isOpen));
      observationToggle.closest(".group-client-card").querySelector(".group-client-observation").classList.toggle("is-open", isOpen);
      if (isOpen) observationToggle.closest(".group-client-card").querySelector("[data-group-ui-note]").focus();
      return;
    }
    const tabButton = event.target.closest("[data-group-session-tab]");
    if (tabButton) {
      groupProgrammeSessionTab = tabButton.dataset.groupSessionTab;
      groupProgrammeView = "session";
      groupProgrammeWorkspaceInitialized = true;
      showPage("group-programme");
      return;
    }
    const sessionButton = event.target.closest("[data-group-session-key]");
    if (sessionButton) {
      groupProgrammeSelectedSessionId = sessionButton.dataset.groupSessionKey;
      groupProgrammeClientSearch = "";
      groupProgrammeView = "session";
      showPage("group-programme");
      return;
    }
    if (event.target.closest("[data-group-new-session]")) {
      if (!groupProgrammeDraftSession) {
        groupProgrammeDraftSession = { key: `draft:${Date.now()}`, category: "Group psychotherapy" };
      }
      groupProgrammeSelectedSessionId = groupProgrammeDraftSession.key;
      groupProgrammeSessionTab = "today";
      groupProgrammeView = "session";
      showPage("group-programme");
      openGroupProgrammeEditor();
      return;
    }
    if (event.target.closest("[data-group-edit-selected]")) {
      const selected = groupProgrammeWorkspaceItems(APPOINTMENTS.filter(isGroupPsychotherapyAppointment))
        .find(item => item.key === groupProgrammeSelectedSessionId);
      if (selected?.kind === "scheduled") openGroupProgrammeEditor(selected.appointmentIndex);
      return;
    }
    const attendanceButton = event.target.closest("[data-group-ui-attendance]");
    if (attendanceButton) {
      updateGroupProgrammeDraft(attendanceButton.dataset.clientId, { attendance: attendanceButton.dataset.groupUiAttendance });
      showPage("group-programme");
      return;
    }
    if (event.target.closest("[data-group-mark-all]")) {
      const search = groupProgrammeClientSearch.trim().toLowerCase();
      activeGroupProgrammeClients().filter(client =>
        client.sessionEligible !== false &&
        (!groupProgrammeWorkspaceFilters.programme || groupProgrammeForClient(client) === groupProgrammeWorkspaceFilters.programme) &&
        (!groupProgrammeWorkspaceFilters.unit || groupUnitForClient(client) === groupProgrammeWorkspaceFilters.unit) &&
        (!search || `${client.id} ${client.name} ${groupProgrammeForClient(client)}`.toLowerCase().includes(search))
      ).forEach(client =>
        updateGroupProgrammeDraft(client.id, { attendance: "Present" })
      );
      showPage("group-programme");
      return;
    }
    if (event.target.closest("[data-group-workspace-review]")) {
      submitGroupProgrammeWorkspaceReview();
      return;
    }
    const clientButton = event.target.closest("[data-open-group-client]");
    if (clientButton) {
      currentClient = CLIENTS.find(client => client.id === clientButton.dataset.openGroupClient) || currentClient;
      showPage("interventions");
    }
  });
  workspace?.addEventListener("input", event => {
    if (event.target.matches("[data-group-client-search]")) {
      const position = event.target.selectionStart;
      groupProgrammeClientSearch = event.target.value;
      showPage("group-programme");
      const search = document.querySelector("[data-group-client-search]");
      search?.focus();
      search?.setSelectionRange(position, position);
      return;
    }
    if (event.target.matches("[data-group-ui-note]")) {
      updateGroupProgrammeDraft(event.target.dataset.clientId, { observation: event.target.value });
      event.target.closest(".group-client-card").querySelector("[data-group-observation-toggle]").textContent =
        event.target.value ? "Edit observation" : "Add observation";
    }
  });
  workspace?.addEventListener("change", event => {
    if (event.target.matches("[data-group-workspace-filter]")) {
      groupProgrammeWorkspaceFilters[event.target.dataset.groupWorkspaceFilter] = event.target.value;
      showPage("group-programme");
    } else if (event.target.matches("[data-group-ui-risk]")) {
      updateGroupProgrammeDraft(event.target.dataset.clientId, {
        riskDisclosure: event.target.checked,
        followUpRequired: event.target.checked || Boolean(groupProgrammeDraftAttendance[groupProgrammeSelectedSessionId]?.[event.target.dataset.clientId]?.followUpRequired)
      });
      showPage("group-programme");
    } else if (event.target.matches("[data-group-ui-follow-up]")) {
      updateGroupProgrammeDraft(event.target.dataset.clientId, { followUpRequired: event.target.checked });
    }
  });
  document.getElementById("group-scheduled").addEventListener("change", event => {
    const appointment = APPOINTMENTS.filter(isGroupPsychotherapyAppointment)[Number(event.currentTarget.value)];
    if (!appointment) return;
    document.getElementById("group-session-date").value = appointment.date || "";
    document.getElementById("group-start-time").value = appointment.time || "";
    document.getElementById("group-end-time").value = appointment.endTime || "";
    document.getElementById("group-topic").value = appointment.topic || appointment.type || "";
    document.getElementById("group-facilitator").value = appointment.provider || "";
    document.getElementById("group-location").value = appointment.location || "";
    const category = groupProgrammeStore.categories.includes(appointment.category)
      ? appointment.category
      : groupProgrammeStore.categories.find(item => item.toLowerCase() === String(appointment.type || "").toLowerCase()) || "";
    document.getElementById("group-category").value = category;
    document.getElementById("group-category").dispatchEvent(new Event("change", { bubbles: true }));
  });
  document.getElementById("group-category").addEventListener("change", event => {
    const isOther = event.currentTarget.value.toLowerCase().startsWith("other");
    const wrapper = document.getElementById("group-other-category-field");
    wrapper.hidden = !isOther;
    document.getElementById("group-other-category").required = isOther;
  });
  ["group-filter-programme", "group-filter-unit", "group-filter-eligibility"].forEach(id =>
    document.getElementById(id).addEventListener("change", filterGroupProgrammeClients)
  );
  document.querySelectorAll("[data-group-risk]").forEach(input => input.addEventListener("change", event => {
    const row = event.currentTarget.closest("tr");
    const followUp = row.querySelector("[data-group-follow-up]");
    followUp.checked = event.currentTarget.checked || followUp.checked;
    followUp.required = event.currentTarget.checked;
    row.querySelector("[data-group-observation]").required = event.currentTarget.checked;
  }));
  form.addEventListener("submit", reviewGroupProgrammeSession);
  document.getElementById("group-category-form").addEventListener("submit", addGroupProgrammeCategory);
  document.getElementById("group-edit-category-form").addEventListener("submit", modifyGroupProgrammeCategory);
  document.querySelectorAll("[data-amend-session]").forEach(button =>
    button.addEventListener("click", () => openGroupProgrammeAmendment(button.dataset.amendSession))
  );
  document.querySelectorAll("[data-amend-session-details]").forEach(button =>
    button.addEventListener("click", () => openGroupSessionDetailsAmendment(button.dataset.amendSessionDetails))
  );
}

function filterGroupProgrammeClients() {
  const programme = document.getElementById("group-filter-programme").value;
  const unit = document.getElementById("group-filter-unit").value;
  const eligibility = document.getElementById("group-filter-eligibility").value;
  document.querySelectorAll("#group-client-rows tr").forEach(row => {
    const matches = !(
      (programme && row.dataset.programme !== programme) ||
      (unit && row.dataset.unit !== unit) ||
      (eligibility === "eligible" && row.dataset.eligible !== "true")
    );
    const canRecord = matches && row.dataset.eligible === "true";
    row.hidden = !matches;
    const attendance = row.querySelector("[data-group-attendance]");
    attendance.disabled = !canRecord;
    attendance.required = canRecord;
    row.querySelector("[data-group-observation]").disabled = !canRecord;
    row.querySelector("[data-group-risk]").disabled = !canRecord;
    row.querySelector("[data-group-follow-up]").disabled = !canRecord;
  });
}

function addGroupProgrammeCategory(event) {
  event.preventDefault();
  const input = document.getElementById("group-new-category");
  const category = input.value.trim();
  if (!category || groupProgrammeStore.categories.some(item => item.toLowerCase() === category.toLowerCase())) {
    input.setCustomValidity(category ? "This category already exists." : "Enter a category name.");
    input.reportValidity();
    input.setCustomValidity("");
    return;
  }
  const nextStore = { ...groupProgrammeStore, categories: [...groupProgrammeStore.categories, category] };
  if (saveGroupProgrammeStore(nextStore)) showPage("group-programme");
  else document.getElementById("group-session-status").textContent = groupProgrammeStorageIssue;
}

function modifyGroupProgrammeCategory(event) {
  event.preventDefault();
  const previous = document.getElementById("group-category-to-edit").value;
  const updated = document.getElementById("group-edited-category").value.trim();
  if (!updated || groupProgrammeStore.categories.some(item => item !== previous && item.toLowerCase() === updated.toLowerCase())) {
    document.getElementById("group-edited-category").setCustomValidity("Enter a unique category name.");
    document.getElementById("group-edited-category").reportValidity();
    document.getElementById("group-edited-category").setCustomValidity("");
    return;
  }
  const nextStore = {
    ...groupProgrammeStore,
    categories: groupProgrammeStore.categories.map(item => item === previous ? updated : item)
  };
  if (saveGroupProgrammeStore(nextStore)) showPage("group-programme");
  else document.getElementById("group-session-status").textContent = groupProgrammeStorageIssue;
}

function reviewGroupProgrammeSession(event) {
  event.preventDefault();
  const form = event.currentTarget;
  if (!form.reportValidity()) return;
  const rows = [...document.querySelectorAll("#group-client-rows tr:not([hidden])")]
    .filter(row => row.dataset.eligible === "true");
  if (!rows.length) {
    document.getElementById("group-session-status").textContent = "No eligible clients match the selected filters.";
    return;
  }
  const categoryChoice = document.getElementById("group-category").value;
  const category = categoryChoice.toLowerCase().startsWith("other")
    ? document.getElementById("group-other-category").value.trim()
    : categoryChoice;
  const clientEntries = rows.map(row => {
    const riskDisclosure = row.querySelector("[data-group-risk]").checked;
    return {
      clientId: row.dataset.clientId,
      attendance: row.querySelector("[data-group-attendance]").value,
      observation: row.querySelector("[data-group-observation]").value.trim(),
      riskDisclosure,
      followUpRequired: row.querySelector("[data-group-follow-up]").checked,
      followUpStatus: row.querySelector("[data-group-follow-up]").checked ? "Open" : "Not required",
      version: 1,
      audit: []
    };
  });
  const startTime = document.getElementById("group-start-time").value;
  const endTime = document.getElementById("group-end-time").value;
  if (endTime <= startTime) {
    document.getElementById("group-end-time").setCustomValidity("End time must be after the start time.");
    document.getElementById("group-end-time").reportValidity();
    document.getElementById("group-end-time").setCustomValidity("");
    return;
  }
  pendingGroupProgrammeSession = {
    id: `GROUP-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    sessionDate: document.getElementById("group-session-date").value,
    startTime,
    endTime,
    category,
    topic: document.getElementById("group-topic").value.trim(),
    facilitator: document.getElementById("group-facilitator").value.trim(),
    author: document.getElementById("group-author").value.trim(),
    location: document.getElementById("group-location").value.trim(),
    description: document.getElementById("group-description").value.trim(),
    reviewedAt: new Date().toISOString(),
    clientEntries
  };
  const review = document.getElementById("group-session-review");
  review.innerHTML = `<section class="card group-review" aria-labelledby="group-review-title">
    <h3 id="group-review-title">Review before confirmation</h3>
    <div><strong>${escapeHTML(category)} · ${escapeHTML(pendingGroupProgrammeSession.topic)}</strong><br>${escapeHTML(pendingGroupProgrammeSession.sessionDate)} · ${escapeHTML(startTime)}–${escapeHTML(endTime)} · ${escapeHTML(pendingGroupProgrammeSession.location)}<br>Facilitator: ${escapeHTML(pendingGroupProgrammeSession.facilitator)} · Documenting staff: ${escapeHTML(pendingGroupProgrammeSession.author)}</div>
    <div class="group-table-wrap"><table><thead><tr><th>Client</th><th>Attendance</th><th>Individual note</th><th>Review flag</th></tr></thead><tbody>${clientEntries.map(entry => {
      const client = CLIENTS.find(item => item.id === entry.clientId);
      return `<tr><td>${escapeHTML(client?.id)} · ${escapeHTML(client?.name)}</td><td>${escapeHTML(entry.attendance)}</td><td>${entry.observation ? "Recorded in this client entry" : "No observation recorded"}</td><td>${entry.riskDisclosure ? "Individual clinical review required" : "None flagged"}</td></tr>`;
    }).join("")}</tbody></table></div>
    ${clientEntries.some(entry => entry.riskDisclosure) ? '<div class="group-alert">At least one individual risk disclosure is flagged. Follow-up is tracked only in the relevant client entry; no disclosure text appears in the shared session summary.</div>' : ""}
    <div class="group-actions"><button class="btn" type="button" id="group-confirm-session">Confirm and save session</button><button class="btn ghost" type="button" id="group-edit-session">Return to edit</button></div>
  </section>`;
  document.getElementById("group-session-status").textContent = "";
  document.getElementById("group-confirm-session").addEventListener("click", confirmGroupProgrammeSession);
  document.getElementById("group-edit-session").addEventListener("click", () => {
    pendingGroupProgrammeSession = null;
    review.replaceChildren();
  });
  review.scrollIntoView({ behavior: "smooth", block: "start" });
}

function confirmGroupProgrammeSession() {
  if (!pendingGroupProgrammeSession) return;
  const record = {
    ...pendingGroupProgrammeSession,
    createdAt: new Date().toISOString(),
    clientEntries: pendingGroupProgrammeSession.clientEntries.map(entry => ({
      ...entry,
      linkedSessionId: pendingGroupProgrammeSession.id
    }))
  };
  const nextStore = { ...groupProgrammeStore, sessions: [...groupProgrammeStore.sessions, record] };
  if (!saveGroupPsychotherapyInterventions(record, nextStore)) {
    document.getElementById("group-session-status").textContent = groupProgrammeStorageIssue;
    return;
  }
  pendingGroupProgrammeSession = null;
  if (groupProgrammeSelectedSessionId.startsWith("draft:")) groupProgrammeDraftSession = null;
  groupProgrammeSelectedSessionId = `session:${record.id}`;
  groupProgrammeSessionTab = groupProgrammeItemTab(record.sessionDate);
  groupProgrammeView = "session";
  groupProgrammeStatusMessage = "Session confirmed. Attendance and client-specific observations are linked to the Group Psychotherapy intervention history.";
  showPage("group-programme");
}

function openGroupSessionDetailsAmendment(sessionId) {
  const session = groupProgrammeStore.sessions.find(item => item.id === sessionId);
  if (!session) {
    console.error(`Cannot amend group session ${sessionId}: it was not found.`);
    return;
  }
  const fields = [
    ["sessionDate", "Session date", "date"],
    ["startTime", "Start time", "time"],
    ["endTime", "End time", "time"],
    ["category", "Session category", "text"],
    ["topic", "Topic or activity", "text"],
    ["facilitator", "Facilitator", "text"],
    ["author", "Documenting staff member", "text"],
    ["location", "Location", "text"],
    ["description", "Session content or intervention", "textarea"]
  ];
  const root = document.getElementById("group-programme-modal-root");
  root.innerHTML = `<div class="group-modal-backdrop">
    <section class="group-modal" role="dialog" aria-modal="true" aria-labelledby="group-session-amend-title">
      <h2 id="group-session-amend-title">Correct session details</h2>
      <p class="group-note">Changes are recorded in the session audit trail and are reflected in linked client entries. Individual observations are not changed.</p>
      <form id="group-session-amend-form" class="group-programme">
        ${fields.map(([key, label, type]) => `<div class="field"><label for="group-master-${key}">${label}</label>${type === "textarea"
          ? `<textarea id="group-master-${key}" data-session-field="${key}" rows="3" maxlength="2000" required>${escapeHTML(session[key] || "")}</textarea>`
          : `<input id="group-master-${key}" data-session-field="${key}" type="${type}" value="${escapeHTML(session[key] || "")}" maxlength="2000" required>`}</div>`).join("")}
        <div class="field"><label for="group-session-amend-reason">Reason for correction</label><textarea id="group-session-amend-reason" rows="2" maxlength="500" required></textarea></div>
        <div class="group-actions"><button class="btn" type="submit">Save session correction</button><button class="btn ghost" id="group-session-amend-cancel" type="button">Cancel</button></div>
        <div id="group-session-amend-status" class="group-status" role="status"></div>
      </form>
    </section>
  </div>`;
  const form = document.getElementById("group-session-amend-form");
  document.getElementById("group-session-amend-cancel").addEventListener("click", () => root.replaceChildren());
  form.addEventListener("submit", event => {
    event.preventDefault();
    if (!form.reportValidity()) return;
    const changes = Object.fromEntries([...form.querySelectorAll("[data-session-field]")].map(input => [
      input.dataset.sessionField,
      input.value.trim()
    ]));
    if (changes.endTime <= changes.startTime) {
      document.getElementById("group-master-endTime").setCustomValidity("End time must be after the start time.");
      document.getElementById("group-master-endTime").reportValidity();
      document.getElementById("group-master-endTime").setCustomValidity("");
      return;
    }
    const reason = document.getElementById("group-session-amend-reason").value.trim();
    const before = Object.fromEntries(fields.map(([key]) => [key, session[key] || ""]));
    const amendedSession = {
      ...session,
      ...changes,
      audit: [...(session.audit || []), {
        amendedAt: new Date().toISOString(),
        amendedBy: session.author,
        reason,
        before,
        after: changes
      }]
    };
    const nextStore = {
      ...groupProgrammeStore,
      sessions: groupProgrammeStore.sessions.map(item => item.id === sessionId ? amendedSession : item)
    };
    if (!saveGroupProgrammeStore(nextStore)) {
      document.getElementById("group-session-amend-status").textContent = groupProgrammeStorageIssue;
      return;
    }
    const interventionSynced = syncGroupPsychotherapySessionCorrection(amendedSession, before, reason);
    groupProgrammeStatusMessage = interventionSynced
      ? "Session correction saved and linked intervention details synchronized."
      : groupProgrammeStorageIssue;
    showPage("group-programme");
  });
}

function openGroupProgrammeAmendment(sessionId) {
  const session = groupProgrammeStore.sessions.find(item => item.id === sessionId);
  if (!session) {
    console.error(`Cannot amend group session ${sessionId}: it was not found.`);
    return;
  }
  const root = document.getElementById("group-programme-modal-root");
  root.innerHTML = `<div class="group-modal-backdrop" id="group-amend-backdrop">
    <section class="group-modal" role="dialog" aria-modal="true" aria-labelledby="group-amend-title">
      <h2 id="group-amend-title">Correct an individual client entry</h2>
      <p class="group-note">${escapeHTML(session.sessionDate)} · ${escapeHTML(session.category)} · ${escapeHTML(session.topic)}. Only the selected client's linked entry will be amended.</p>
      <form id="group-amend-form" class="group-programme">
        <div class="field"><label for="group-amend-client">Client</label><select id="group-amend-client" required>${session.clientEntries.map(entry => {
          const client = CLIENTS.find(item => item.id === entry.clientId);
          return `<option value="${escapeHTML(entry.clientId)}">${escapeHTML(client?.id || entry.clientId)} · ${escapeHTML(client?.name || "Client record")}</option>`;
        }).join("")}</select></div>
        <div class="field"><label for="group-amend-attendance">Correct attendance</label><select id="group-amend-attendance" required><option>Present</option><option>Absent</option><option>Excused</option><option>Declined</option></select></div>
        <div class="field"><label for="group-amend-observation">Correct individual observation</label><textarea id="group-amend-observation" rows="4" maxlength="1000"></textarea></div>
        <div class="group-inline"><label><input id="group-amend-risk" type="checkbox"> Risk disclosure requiring individual clinical review</label></div>
        <div class="group-inline"><label><input id="group-amend-follow-up" type="checkbox"> Individual follow-up task required</label></div>
        <div class="field"><label for="group-amend-reason">Reason for correction</label><textarea id="group-amend-reason" rows="2" maxlength="500" required></textarea></div>
        <div class="group-actions"><button class="btn" type="submit">Save correction</button><button class="btn ghost" id="group-amend-cancel" type="button">Cancel</button></div>
        <div id="group-amend-status" class="group-status" role="status"></div>
      </form>
    </section>
  </div>`;
  const form = document.getElementById("group-amend-form");
  const updateFields = () => {
    const entry = session.clientEntries.find(item => item.clientId === document.getElementById("group-amend-client").value);
    if (!entry) return;
    document.getElementById("group-amend-attendance").value = entry.attendance;
    document.getElementById("group-amend-observation").value = entry.observation || "";
    document.getElementById("group-amend-risk").checked = Boolean(entry.riskDisclosure);
    document.getElementById("group-amend-follow-up").checked = Boolean(entry.followUpRequired);
  };
  document.getElementById("group-amend-client").addEventListener("change", updateFields);
  const riskField = document.getElementById("group-amend-risk");
  const followUpField = document.getElementById("group-amend-follow-up");
  const observationField = document.getElementById("group-amend-observation");
  const syncAmendmentRiskRequirements = () => {
    if (riskField.checked) followUpField.checked = true;
    followUpField.required = riskField.checked;
    observationField.required = riskField.checked;
  };
  riskField.addEventListener("change", syncAmendmentRiskRequirements);
  followUpField.addEventListener("change", () => {
    if (riskField.checked && !followUpField.checked) followUpField.checked = true;
  });
  document.getElementById("group-amend-cancel").addEventListener("click", () => root.replaceChildren());
  form.addEventListener("submit", event => {
    event.preventDefault();
    syncAmendmentRiskRequirements();
    if (!form.reportValidity()) return;
    const clientId = document.getElementById("group-amend-client").value;
    const currentSession = groupProgrammeStore.sessions.find(item => item.id === sessionId);
    const originalEntry = currentSession.clientEntries.find(item => item.clientId === clientId);
    const attendance = document.getElementById("group-amend-attendance").value;
    const observation = document.getElementById("group-amend-observation").value.trim();
    const riskDisclosure = document.getElementById("group-amend-risk").checked;
    const followUpRequired = document.getElementById("group-amend-follow-up").checked;
    const reason = document.getElementById("group-amend-reason").value.trim();
    const entry = {
      ...originalEntry,
      attendance,
      observation,
      riskDisclosure,
      followUpRequired,
      followUpStatus: followUpRequired ? (originalEntry.followUpStatus === "Completed" ? "Completed" : "Open") : "Not required",
      version: (Number(originalEntry.version) || 1) + 1,
      audit: [...(originalEntry.audit || []), {
        amendedAt: new Date().toISOString(),
        amendedBy: session.author,
        reason,
        before: {
          attendance: originalEntry.attendance,
          observation: originalEntry.observation || "",
          riskDisclosure: Boolean(originalEntry.riskDisclosure),
          followUpRequired: Boolean(originalEntry.followUpRequired)
        },
        after: { attendance, observation, riskDisclosure, followUpRequired }
      }]
    };
    const amendedSession = {
      ...currentSession,
      clientEntries: currentSession.clientEntries.map(item => item.clientId === clientId ? entry : item)
    };
    const nextStore = {
      ...groupProgrammeStore,
      sessions: groupProgrammeStore.sessions.map(item => item.id === sessionId ? amendedSession : item)
    };
    if (!saveGroupProgrammeStore(nextStore)) {
      document.getElementById("group-amend-status").textContent = groupProgrammeStorageIssue;
      return;
    }
    const interventionSynced = syncGroupPsychotherapyEntryCorrection(amendedSession, entry, originalEntry, reason);
    groupProgrammeStatusMessage = interventionSynced
      ? "Client entry correction saved and linked intervention history synchronized."
      : groupProgrammeStorageIssue;
    showPage("group-programme");
  });
  updateFields();
  syncAmendmentRiskRequirements();
}

  { id: 'admission', group: 'Treat', name: 'Admission', rateService: 'Admission', actionId: '', options: ['Admission review', 'Ward coordination', 'Rights-information follow-up'], signal: client => client.type === 'inpatient', reason: 'The client record indicates inpatient care' },
  { id: 'withdrawal', group: 'Treat', name: 'Withdrawal Management (Detox)', rateService: 'Withdrawal Management (Detox)', actionId: 'withdrawal', options: ['Withdrawal assessment', 'Withdrawal monitoring', 'Review of withdrawal plan', 'Medical escalation'], signal: client => /withdrawal|detox|alcohol|opioid/i.test([client.diagnosis, ...(client.alerts || []), ...(client.flags || [])].join(' ')), reason: 'Diagnosis, alert, or flag references substance use or withdrawal' },
  { id: 'opioid-therapy', group: 'Treat', name: 'Opioid Agonist Therapy', rateService: 'Opioid Agonist Therapy', actionId: '', options: ['Methadone review', 'Buprenorphine review', 'Naloxone / overdose-risk education'], signal: client => /opioid/i.test([client.diagnosis, ...(client.alerts || []), ...(client.flags || [])].join(' ')), reason: 'Opioid use or withdrawal is documented' },
  { id: 'nursing', group: 'Treat', name: 'Psychiatric Nursing', rateService: 'Psychiatric Nursing', actionId: 'medication', options: ['Medication Administration Record (MAR)', 'PRN effectiveness review', 'Physical-care chart review', 'SBAR shift handover'], signal: client => client.type === 'inpatient', reason: 'The client record indicates inpatient care' },
  { id: 'restrictive-practice', group: 'Treat', name: 'Restrictive Practice', actionId: 'safety', options: ['De-escalation attempted', 'Authorisation review', 'Monitoring and safety checks', 'Patient debrief'], signal: () => false, reason: '' },
  { id: 'group-psychotherapy', group: 'Treat', name: 'Group Psychotherapy', actionId: 'psychotherapy', options: ['Stress-management group', 'Coping skills group', 'Relapse-prevention group', 'Psychoeducation group', 'Peer-support group'], signal: client => Boolean(client.groupPsychotherapy) || groupPsychotherapyInterventionRecordsForClient(client.id).length > 0 || (client.type === 'outpatient' && /depress|anxiety|panic|bipolar|trauma|substance/i.test(client.diagnosis || '')), reason: 'The client is linked to a group therapy session or a relevant mental-health diagnosis is documented' },
  { id: 'psychotherapy', group: 'Treat', name: 'Psychotherapy', rateService: 'Psychotherapy', actionId: 'psychotherapy', options: ['CBT session', 'Individual therapy', 'Group therapy', 'Family therapy', 'Psychoeducation'], signal: (client, actions) => actions.some(action => action.id === 'psychotherapy') || client.type === 'outpatient' || /depress|anxiety|panic|bipolar/i.test(client.diagnosis || ''), reason: 'Psychological therapy is in the care plan or a relevant diagnosis is recorded' },
  { id: 'psychosocial', group: 'Support', name: 'Psychosocial Support', rateService: 'Psychosocial Support', actionId: '', options: ['Social-work coordination', 'Peer support', 'Family psychoeducation', 'Case management'], signal: () => false, reason: '' },
  { id: 'nutrition', group: 'Support', name: 'Nutrition & Fitness', rateService: 'Nutrition & Fitness', actionId: '', options: ['Nutrition assessment coordination', 'Fitness-programme referral'], signal: () => false, reason: '' },
  { id: 'attachments', group: 'Support', name: 'Attachments', actionId: '', options: ['Attach clinical document', 'Attach referral / correspondence'], signal: () => false, reason: '' },
  { id: 'discharge', group: 'Close-out', name: 'Discharge', rateService: 'Discharge', actionId: 'followup', options: ['Discharge planning', 'Discharge summary', 'Counter-referral coordination'], signal: client => client.type === 'inpatient', reason: 'The client record indicates inpatient care' },
  { id: 'followup', group: 'Close-out', name: 'Follow-up & After-care', rateService: 'Follow-up & After-care', actionId: 'followup', options: ['Outpatient psychiatry follow-up', 'Missed-appointment follow-up', 'Care-plan review'], signal: (client, actions) => actions.some(action => action.id === 'followup') || Boolean(client.nextAppt), reason: 'Follow-up is in the care plan or an appointment is recorded' }
];

let interventionRecords = [];
let interventionStorageIssue = '';
let interventionScope = 'plan';
let interventionReturnFocus = null;
let interventionDrawerTab = 'Record';
let interventionOpenModuleId = '';

function loadInterventionRecords() {
  try {
    const saved = localStorage.getItem(INTERVENTION_STORAGE_KEY);
    const records = saved ? JSON.parse(saved) : [];
    if (!Array.isArray(records) || records.some(record =>
      !record || typeof record.id !== 'string' || typeof record.clientId !== 'string' ||
      typeof record.actionId !== 'string' || typeof record.moduleId !== 'string' ||
      typeof record.note !== 'string' || typeof record.at !== 'string'
    )) {
      throw new Error('Saved intervention data has an invalid format.');
    }
    return records;
  } catch (error) {
    interventionStorageIssue = 'Saved intervention entries could not be loaded. No records were changed.';
    console.error('Unable to restore intervention records.', error);
    return null;
  }
}

function interventionHistoryFor(client) {
  return interventionRecords
    .filter(record => record.clientId === client.id)
    .sort((a, b) => String(b.at).localeCompare(String(a.at)));
}

function interventionActionsFor(client) {
  if (client.id === 'MRN-20418') return INTERVENTION_ACTIONS;
  const cues = [client.diagnosis, ...(client.alerts || []), ...(client.flags || [])].join(' ');
  return INTERVENTION_ACTIONS.filter(action => {
    if (action.id === 'psychiatry') return Boolean(client.diagnosis);
    if (action.id === 'withdrawal') return /withdrawal|detox|alcohol|opioid/i.test(cues);
    if (action.id === 'safety') return /suicid|self-harm|violence|aggression|safeguard/i.test(cues);
    if (action.id === 'medication') return MEDICATIONS.some(item => item.client === client.name);
    if (action.id === 'psychotherapy') return client.type === 'outpatient' || Boolean(client.groupPsychotherapy) || /depress|anxiety|panic|bipolar/i.test(client.diagnosis || '');
    if (action.id === 'followup') return client.type === 'inpatient' || Boolean(client.nextAppt);
    return false;
  }).map(action => ({
    ...action,
    status: 'Suggested',
    goal: 'Suggested from the diagnosis, alerts, or medication list in this client record.'
  }));
}

function interventionDate(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? 'Date not recorded' : date.toLocaleString();
}

function interventionModuleRecommended(module, client, actions = interventionActionsFor(client)) {
  return module.signal(client, actions);
}

function interventionRateText(module) {
  if (!module.rateService) return 'Not separately priced in Billing';
  const rate = PSYCHIATRY_BILLING_RATES[module.rateService];
  return Number.isFinite(rate) ? `KES ${rate.toLocaleString()} · rate configured in Billing` : 'No rate configured in Billing';
}

function renderInterventionModules(client) {
  const host = document.getElementById('intervention-module-list');
  if (!host) return;
  const actions = interventionActionsFor(client);
  const modules = INTERVENTION_MODULES.filter(module => interventionScope === 'all' ||
    interventionModuleRecommended(module, client, actions) ||
    actions.some(action => action.id === module.actionId)
  );
  const sortedModules = modules.slice().sort((a, b) =>
    [...new Set(INTERVENTION_MODULES.map(module => module.group))].indexOf(a.group) -
      [...new Set(INTERVENTION_MODULES.map(module => module.group))].indexOf(b.group) ||
    Number(interventionModuleRecommended(b, client, actions)) - Number(interventionModuleRecommended(a, client, actions)) ||
    INTERVENTION_MODULES.indexOf(a) - INTERVENTION_MODULES.indexOf(b)
  );
  let activeGroup = '';
  host.innerHTML = sortedModules.map(module => {
    const action = actions.find(item => item.id === module.actionId);
    const recommended = interventionModuleRecommended(module, client, actions);
    const reason = recommended ? module.reason : (action ? `Linked to ${action.name}` : interventionRateText(module));
    const heading = module.group !== activeGroup
      ? (activeGroup = module.group, `<div class="grp">${escapeHTML(module.group)}</div>`)
      : '';
    const delivered = interventionHistoryFor(client)
      .filter(record => record.moduleId === module.id && !record.voided)
      .reduce((total, record) => total + (Number(record.qty) || 1), 0);
    return `${heading}<button class="intervention-module" type="button" data-intervention-module="${escapeHTML(module.id)}" aria-label="Record ${escapeHTML(module.name)}">
      <span class="intervention-module-icon" aria-hidden="true">${escapeHTML(module.name.slice(0, 1))}</span>
      <span class="intervention-module-copy"><span class="intervention-module-title">${escapeHTML(module.name)}${recommended ? '<span class="intervention-recommended">Recommended</span>' : ''}</span><span class="intervention-module-meta">${escapeHTML(recommended ? interventionRateText(module) : reason)}</span></span>
      ${delivered ? `<span class="intervention-delivered">${delivered} delivered</span>` : ''}
      <span aria-hidden="true" style="color:var(--faint);font-size:18px">›</span>
    </button>`;
  }).join('');
  document.getElementById('intervention-plan-count').textContent = String(modules.length);
  document.getElementById('intervention-all-count').textContent = String(INTERVENTION_MODULES.length);
}

function renderInterventionData(client) {
  const history = interventionHistoryFor(client);
  const actionsHost = document.getElementById('intervention-actions');
  if (!actionsHost) return;
  const actions = interventionActionsFor(client);
  actionsHost.innerHTML = actions.map(action => {
    const records = history.filter(record => record.actionId === action.id && !record.voided);
    const count = records.reduce((total, record) => total + (Number(record.qty) || 1), 0);
    const latest = records[0];
    const priority = ['RED', 'ORANGE', 'YELLOW', 'GREEN'].includes(client.priority) ? client.priority : '';
    return `<tr><td><strong>${escapeHTML(action.name)}</strong></td><td>${priority ? `<span class="pill pri-${priority}"><span class="dot"></span>${priority}</span>` : '<span class="tag">Not recorded</span>'}</td><td><span class="tag">${escapeHTML(action.status)}</span>${latest ? `<div class="intervention-action-meta">${escapeHTML(latest.by || 'Provider not recorded')} · ${escapeHTML(interventionDate(latest.at))}</div>` : ''}</td><td style="text-align:right">${count}</td></tr>`;
  }).join('');
}

function openInterventionDrawer(moduleId) {
  const client = currentClient || CLIENTS[0];
  const module = INTERVENTION_MODULES.find(item => item.id === moduleId) || INTERVENTION_MODULES[0];
  const overlay = document.getElementById('intervention-overlay');
  const form = document.getElementById('intervention-form');
  const actionSelect = document.getElementById('intervention-action');
  const typeSelect = document.getElementById('intervention-type');
  const context = document.getElementById('intervention-context');
  if (!overlay || !form || !actionSelect || !typeSelect || !context) return;

  interventionReturnFocus = document.activeElement;
  interventionOpenModuleId = module.id;
  interventionDrawerTab = 'Record';
  const activeActions = interventionActionsFor(client);
  document.getElementById('intervention-drawer-title').textContent = module.name;
  document.getElementById('intervention-drawer-icon').textContent = module.name.slice(0, 1);
  const recommended = interventionModuleRecommended(module, client, activeActions);
  document.getElementById('intervention-drawer-recommended').hidden = !recommended;
  document.getElementById('intervention-drawer-subtitle').textContent = interventionModuleRecommended(module, client)
    ? `Suggested from the existing client record · ${module.reason}`
    : 'Record care delivered and link it to a plan action when appropriate.';
  document.getElementById('intervention-drawer-rate').textContent = interventionRateText(module);
  document.getElementById('intervention-billing-note').textContent = module.rateService && PSYCHIATRY_BILLING_RATES[module.rateService]
    ? `KES ${PSYCHIATRY_BILLING_RATES[module.rateService].toLocaleString()} rate configured in Billing`
    : interventionRateText(module);
  const currentMeds = MEDICATIONS.filter(item => item.client === client.name);
  context.innerHTML = `<details class="ctx" open><summary>Clinical context <span>carried forward · confirm, don’t re-enter</span></summary>
    <div class="cr"><span class="k">Client</span><span class="v">${escapeHTML(client.name)} · ${escapeHTML(client.id)}</span></div>
    <div class="cr"><span class="k">Diagnosis</span><span class="v">${escapeHTML(client.diagnosis || 'Not recorded')}</span></div>
    <div class="cr"><span class="k">Allergies</span><span class="v">${escapeHTML(client.allergies || 'Not recorded')}</span></div>
    <div class="cr"><span class="k">Active alerts</span><span class="v">${escapeHTML((client.alerts || []).join(', ') || 'None recorded')}</span></div>
    <div class="cr"><span class="k">Current medicines</span><span class="v">${escapeHTML(currentMeds.map(item => `${item.name} ${item.dose} ${item.freq}`).join('; ') || 'No medication entries found')}</span></div>
    <div class="cr"><span class="k">Care-plan goals</span><span class="v">${escapeHTML(activeActions.map(action => action.name).join('; ') || 'No linked action recorded')}</span></div>
    </details>`;
  document.getElementById('intervention-form-live').textContent = '';
  document.getElementById('intervention-form-live').classList.remove('error');
  actionSelect.innerHTML = '<option value="">Not linked to a care-plan action</option>' + interventionActionsFor(client).map(action =>
    `<option value="${escapeHTML(action.id)}">${escapeHTML(action.name)}</option>`
  ).join('');
  actionSelect.value = activeActions.some(action => action.id === module.actionId) ? module.actionId : '';
  typeSelect.innerHTML = module.options.map(option => `<option value="${escapeHTML(option)}">${escapeHTML(option)}</option>`).join('');
  document.getElementById('intervention-chips').innerHTML = module.options.map((option, index) =>
    `<button type="button" data-intervention-choice="${escapeHTML(option)}" aria-pressed="${index === 0}">${escapeHTML(option)}</button>`
  ).join('');
  typeSelect.value = module.options[0] || '';
  document.getElementById('intervention-note').value = '';
  document.getElementById('intervention-quantity').value = '1';
  document.getElementById('intervention-response').value = '';
  document.getElementById('intervention-outcome').value = '';
  document.getElementById('intervention-next').value = '';
  document.getElementById('intervention-live').textContent = interventionStorageIssue;
  document.getElementById('intervention-live').classList.toggle('error', Boolean(interventionStorageIssue));
  const formStatus = document.getElementById('intervention-form-live');
  formStatus.textContent = interventionStorageIssue;
  formStatus.classList.toggle('error', Boolean(interventionStorageIssue));
  document.getElementById('intervention-save').disabled = Boolean(interventionStorageIssue);
  renderInterventionDrawerTab();
  overlay.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('intervention-drawer-close').focus();
}

function renderInterventionDrawerTab() {
  const client = currentClient || CLIENTS[0];
  const module = INTERVENTION_MODULES.find(item => item.id === interventionOpenModuleId);
  const recordPanel = document.getElementById('intervention-record-panel');
  const secondaryPanel = document.getElementById('intervention-secondary-panel');
  if (!module || !recordPanel || !secondaryPanel) return;

  document.querySelectorAll('[data-intervention-tab]').forEach(button =>
    button.setAttribute('aria-selected', String(button.dataset.interventionTab === interventionDrawerTab))
  );
  const showingRecord = interventionDrawerTab === 'Record';
  recordPanel.hidden = !showingRecord;
  secondaryPanel.hidden = showingRecord;
  recordPanel.querySelectorAll('input, select, textarea, button').forEach(control => {
    if (control.id !== 'intervention-save') control.disabled = !showingRecord;
  });
  document.getElementById('intervention-save').disabled = !showingRecord || Boolean(interventionStorageIssue);
  if (showingRecord) return;

  if (interventionDrawerTab === 'History') {
    const records = interventionHistoryFor(client).filter(record => record.moduleId === module.id);
    secondaryPanel.innerHTML = records.length
      ? `<div class="card"><div class="card-header">Recorded ${escapeHTML(module.name)} activity</div><div class="card-body">${records.map(record => `<div class="timeline-item"><div class="timeline-title">${escapeHTML(record.intervention || module.name)} <span class="tag">${record.voided ? "Corrected" : escapeHTML(interventionDate(record.at))}</span></div><div class="timeline-desc">${escapeHTML(record.note)}${record.voided ? `<br>Attendance corrected to ${escapeHTML(record.attendance || "not present")}; excluded from delivered intervention totals.` : ""}${record.correctionReason ? `<br>Correction: ${escapeHTML(record.correctionReason)}` : ""}${record.response ? `<br>Response: ${escapeHTML(record.response)}` : ''}${record.outcome ? `<br>Outcome: ${escapeHTML(record.outcome)}` : ''}${record.next ? `<br>Next: ${escapeHTML(record.next)}` : ''}<br><span style="color:var(--muted)">${escapeHTML(record.by || 'Provider not recorded')}</span></div></div>`).join('')}</div></div>`
      : `<p class="intervention-live">No ${escapeHTML(module.name.toLowerCase())} entries are recorded for ${escapeHTML(client.name)}.</p>`;
    return;
  }

  const action = interventionActionsFor(client).find(item => item.id === module.actionId);
  const recommended = interventionModuleRecommended(module, client);
  secondaryPanel.innerHTML = `<div class="card"><div class="card-header">About this Psychiatry module</div><div class="card-body">
    <p>${recommended ? escapeHTML(module.reason) : 'No matching diagnosis, alert, or medication entry was found in this client record.'}</p>
    <p style="margin-top:10px"><strong>Care-plan link:</strong> ${escapeHTML(action?.name || 'No matching action in the current care plan; an entry can be saved without a link.')}</p>
    ${action ? `<p style="margin-top:6px"><strong>Plan focus:</strong> ${escapeHTML(action.goal)}</p>` : ''}
    <p style="margin-top:10px"><strong>Record types:</strong> ${module.options.map(option => escapeHTML(option)).join(', ')}</p>
    <p style="margin-top:10px;color:var(--muted)">This is a documentation aid. It does not replace clinical assessment or create a billing event.</p>
  </div></div>`;
}

function closeInterventionDrawer() {
  const overlay = document.getElementById('intervention-overlay');
  if (!overlay || overlay.hidden) return;
  overlay.hidden = true;
  document.body.style.overflow = '';
  interventionReturnFocus?.focus();
  interventionReturnFocus = null;
}

function initInterventions() {
  const client = currentClient || CLIENTS[0];
  interventionScope = 'plan';
  interventionStorageIssue = '';
  const loadedRecords = loadInterventionRecords();
  interventionRecords = loadedRecords || [];
  const live = document.getElementById('intervention-live');
  if (live && interventionStorageIssue) {
    live.textContent = interventionStorageIssue;
    live.classList.add('error');
  }
  renderInterventionData(client);
  renderInterventionModules(client);

  document.querySelectorAll('[data-intervention-scope]').forEach(button => {
    button.addEventListener('click', () => {
      interventionScope = button.dataset.interventionScope;
      document.querySelectorAll('[data-intervention-scope]').forEach(item =>
        item.setAttribute('aria-pressed', String(item === button))
      );
      renderInterventionModules(client);
    });
  });
  document.getElementById('intervention-module-list')?.addEventListener('click', event => {
    const button = event.target.closest('[data-intervention-module]');
    if (button) openInterventionDrawer(button.dataset.interventionModule);
  });
  document.getElementById('intervention-open-record')?.addEventListener('click', () => openInterventionDrawer('psychiatry'));
  document.getElementById('intervention-drawer-tabs')?.addEventListener('click', event => {
    const button = event.target.closest('[data-intervention-tab]');
    if (!button) return;
    interventionDrawerTab = button.dataset.interventionTab;
    renderInterventionDrawerTab();
  });
  document.getElementById('intervention-chips')?.addEventListener('click', event => {
    const button = event.target.closest('[data-intervention-choice]');
    if (!button) return;
    document.querySelectorAll('#intervention-chips [data-intervention-choice]').forEach(choice =>
      choice.setAttribute('aria-pressed', String(choice === button))
    );
    document.getElementById('intervention-type').value = button.dataset.interventionChoice;
  });

  const overlay = document.getElementById('intervention-overlay');
  document.getElementById('intervention-drawer-close')?.addEventListener('click', closeInterventionDrawer);
  overlay?.addEventListener('click', event => {
    if (event.target === overlay) closeInterventionDrawer();
  });
  overlay?.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !overlay.hidden) {
      closeInterventionDrawer();
      return;
    }
    if (event.key !== 'Tab') return;
    const focusable = [...overlay.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled])')];
    if (!focusable.length) {
      event.preventDefault();
      return;
    }
    if (event.shiftKey && document.activeElement === focusable[0]) {
      event.preventDefault();
      focusable[focusable.length - 1].focus();
    } else if (!event.shiftKey && document.activeElement === focusable[focusable.length - 1]) {
      event.preventDefault();
      focusable[0].focus();
    }
  });

  document.getElementById('intervention-form')?.addEventListener('submit', event => {
    event.preventDefault();
    if (interventionDrawerTab !== 'Record') return;
    const note = document.getElementById('intervention-note').value.trim();
    const module = INTERVENTION_MODULES.find(item =>
      item.options.includes(document.getElementById('intervention-type').value)
    );
    const quantity = Number(document.getElementById('intervention-quantity').value);
    if (!note || !module || !Number.isInteger(quantity) || quantity < 1) {
      const status = document.getElementById('intervention-form-live');
      status.textContent = 'Enter a clinical note and a quantity of at least 1.';
      status.classList.add('error');
      return;
    }
    const record = {
      id: `INT-${Date.now()}`,
      clientId: client.id,
      actionId: document.getElementById('intervention-action').value,
      moduleId: module.id,
      moduleName: module.name,
      intervention: document.getElementById('intervention-type').value,
      qty: quantity,
      note,
      response: document.getElementById('intervention-response').value.trim(),
      outcome: document.getElementById('intervention-outcome').value.trim(),
      next: document.getElementById('intervention-next').value.trim(),
      completesAction: document.getElementById('intervention-complete').checked,
      at: new Date().toISOString(),
      by: 'J. Njoroge, RN'
    };
    const nextRecords = [...interventionRecords, record];
    try {
      localStorage.setItem(INTERVENTION_STORAGE_KEY, JSON.stringify(nextRecords));
    } catch (error) {
      console.error('Unable to save intervention record.', error);
      const status = document.getElementById('intervention-form-live');
      status.textContent = 'This intervention could not be saved in this browser. No record was added.';
      status.classList.add('error');
      return;
    }
    interventionRecords = nextRecords;
    closeInterventionDrawer();
    renderInterventionData(client);
    renderInterventionModules(client);
    const status = document.getElementById('intervention-live');
    status.textContent = `Intervention recorded for ${client.name}.`;
    status.classList.remove('error');
  });
}

// ═══════════ PAGE: BILLING ═══════════
const PSYCHIATRY_BILLING_RATES = {
  "Emergency Care": 5000,
  "Blood Work": 900,
  "Medical Review": 3000,
  "Appointments": 2000,
  "Psychiatry": 6000,
  "Admission": 15000,
  "Withdrawal Management (Detox)": 12000,
  "Opioid Agonist Therapy": 600,
  "Psychiatric Nursing": 8000,
  "Psychotherapy": 5000,
  "Psychosocial Support": 2000,
  "Nutrition & Fitness": 1500,
  "Discharge": 4000,
  "Follow-up & After-care": 2500
};
const PSYCHIATRY_BILLING_STORAGE_KEY = "citramac.v4.session";

function readBillingEvents() {
  let raw;
  try {
    raw = localStorage.getItem(PSYCHIATRY_BILLING_STORAGE_KEY);
  } catch (error) {
    console.error("Unable to read saved Psychiatry billing records.", error);
    return { events: [], issue: "Billing records could not be read from browser storage.", unavailable: true };
  }
  if (!raw) return { events: [], issue: "" };

  let snapshot;
  try {
    snapshot = JSON.parse(raw);
  } catch (error) {
    console.error("Saved Psychiatry billing records contain invalid JSON.", error);
    return { events: [], issue: "Saved billing records could not be read. Please contact your system administrator.", unavailable: true };
  }
  if (snapshot?.v !== 4 || !Array.isArray(snapshot.patients)) {
    console.error("Saved Psychiatry billing records have an unsupported data format.");
    return { events: [], issue: "Saved billing records use an unsupported format.", unavailable: true };
  }

  const events = [];
  const unpricedServices = new Set();
  snapshot.patients.forEach(patient => {
    const delivered = patient?.delivered && typeof patient.delivered === "object" ? patient.delivered : {};
    const clientEvents = [];
    Object.entries(delivered).forEach(([service, records]) => {
      const rate = PSYCHIATRY_BILLING_RATES[service];
      if (!Array.isArray(records)) return;
      records.forEach(record => {
        const quantity = Number(record?.qty);
        if (!(quantity > 0) || !Number.isFinite(quantity)) return;
        if (!Number.isFinite(rate)) {
          unpricedServices.add(service);
          return;
        }
        clientEvents.push({
          clientId: String(patient.id || ""),
          clientName: String(patient.reg?.preferredName || patient.reg?.name || "Client record"),
          payer: String(snapshot.hie?.[patient.id]?.payer || patient.reg?.payer?.scheme || patient.reg?.payer || "Not recorded"),
          service,
          at: record.at || "",
          quantity,
          amount: quantity * rate,
          paidAmount: 0,
          paidClaimedAmount: 0,
          paidUnbilledAmount: 0,
          claimedAmount: 0,
          unbilledAmount: 0,
          status: "unbilled"
        });
      });
    });
    if (!clientEvents.length) return;

    const byDateAscending = (a, b) => {
      const dateA = new Date(a.at).getTime();
      const dateB = new Date(b.at).getTime();
      return (Number.isFinite(dateA) ? dateA : 0) - (Number.isFinite(dateB) ? dateB : 0);
    };
    clientEvents.sort(byDateAscending);

    const claim = patient.claim && typeof patient.claim === "object" ? patient.claim : {};
    const claimStage = Number(claim.stage) > 0 || Boolean(claim.submittedAt);
    const claimedQty = new Map();
    if (claimStage) {
      const submittedLines = Array.isArray(claim.submittedLines)
        ? claim.submittedLines
        : Object.keys(delivered).map(service => ({
            name: service,
            qty: Array.isArray(delivered[service])
              ? delivered[service].reduce((sum, record) => sum + Math.max(0, Number(record?.qty) || 0), 0)
              : 0
          }));
      submittedLines.forEach(line => {
        const quantity = Number(line?.qty);
        if (line?.name && quantity > 0 && Number.isFinite(quantity)) {
          claimedQty.set(line.name, (claimedQty.get(line.name) || 0) + quantity);
        }
      });
    }

    const submittedAmount = Number(claim.submittedAmount);
    const hasSubmittedAmount = claimStage && claim.submittedAmount != null && Number.isFinite(submittedAmount);
    let claimBudget = hasSubmittedAmount
      ? Math.max(0, submittedAmount)
      : clientEvents.reduce((sum, event) => sum + Math.min(event.quantity, claimedQty.get(event.service) || 0) * (event.amount / event.quantity), 0);
    clientEvents.forEach(event => {
      const availableQty = claimedQty.get(event.service) || 0;
      const eligibleAmount = Math.min(event.quantity, availableQty) * (event.amount / event.quantity);
      const claimedAmount = Math.min(eligibleAmount, claimBudget);
      event.claimedAmount = claimedAmount;
      event.unbilledAmount = event.amount - claimedAmount;
      claimBudget = Math.max(0, claimBudget - claimedAmount);
      claimedQty.set(event.service, Math.max(0, availableQty - Math.min(event.quantity, availableQty)));
    });

    const payments = Array.isArray(patient.payments) ? patient.payments : [];
    let paymentBudget = payments.reduce((sum, payment) => {
      const amount = Number(payment?.amount);
      return sum + (Number.isFinite(amount) && amount > 0 ? amount : 0);
    }, 0);
    clientEvents.filter(event => event.claimedAmount > 0).forEach(event => {
      event.paidClaimedAmount = Math.min(event.claimedAmount, paymentBudget);
      event.paidAmount += event.paidClaimedAmount;
      paymentBudget = Math.max(0, paymentBudget - event.paidClaimedAmount);
    });
    clientEvents.filter(event => event.unbilledAmount > 0).forEach(event => {
      event.paidUnbilledAmount = Math.min(event.unbilledAmount, paymentBudget);
      event.paidAmount += event.paidUnbilledAmount;
      paymentBudget = Math.max(0, paymentBudget - event.paidUnbilledAmount);
    });
    clientEvents.forEach(event => {
      const unpaid = event.amount - event.paidAmount;
      if (unpaid <= 0) event.status = "paid";
      else if (event.paidAmount > 0) event.status = "partial";
      else if (event.claimedAmount > 0 && event.unbilledAmount > 0) event.status = "partial-claim";
      else if (event.claimedAmount > 0) event.status = "claimed";
      else event.status = "unbilled";
    });
    events.push(...clientEvents);
  });

  if (unpricedServices.size) {
    console.warn("Delivered billing services were excluded because no rate is configured:", [...unpricedServices]);
  }
  return {
    events: events.sort((a, b) => {
      const dateA = new Date(a.at).getTime();
      const dateB = new Date(b.at).getTime();
      return (Number.isFinite(dateB) ? dateB : 0) - (Number.isFinite(dateA) ? dateA : 0);
    }),
    issue: unpricedServices.size
      ? `Some delivered services were not included because their rates are not configured: ${[...unpricedServices].join(", ")}.`
      : "",
    unavailable: false
  };
}

function billing() {
  const { events, issue, unavailable } = readBillingEvents();
  const total = events.reduce((sum, event) => sum + event.amount, 0);

// ═══════════ PAGE: OUTCOMES ═══════════
const OUTCOME_MEASURES = {
  phq9: { label: "PHQ-9", max: 27, higherIsWorse: true },
  gad7: { label: "GAD-7", max: 21, higherIsWorse: true }
};

function validOutcomeDate(value) {
  if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const date = new Date(`${value}T00:00:00Z`);
  return !Number.isNaN(date.getTime()) && date.toISOString().slice(0, 10) === value;
}

function loadOutcomeScores() {
  outcomeStorageIssue = "";
  try {
    const saved = localStorage.getItem(OUTCOME_SCORE_STORAGE_KEY);
    const records = saved ? JSON.parse(saved) : [];
    if (!Array.isArray(records) || records.some(record =>
      !record || typeof record.id !== "string" || typeof record.clientId !== "string" ||
      !Object.hasOwn(OUTCOME_MEASURES, record.measure) ||
      !Number.isInteger(record.score) || record.score < 0 ||
      record.score > OUTCOME_MEASURES[record.measure].max ||
      !validOutcomeDate(record.date) || typeof record.recordedAt !== "string" ||
      typeof record.provider !== "string" || typeof record.note !== "string"
    )) {
      throw new Error("Saved outcome data has an invalid format.");
    }
    outcomeScoreRecords = records;
  } catch (error) {
    outcomeStorageIssue = "Outcome measures could not be loaded. Existing saved data was left unchanged.";
    outcomeStatus = outcomeStorageIssue;
    outcomeStatusState = "error";
    console.error("Unable to restore outcome measures.", error);
  }
}

function saveOutcomeScores(records) {
  try {
    localStorage.setItem(OUTCOME_SCORE_STORAGE_KEY, JSON.stringify(records));
    return true;
  } catch (error) {
    console.error("Unable to save outcome measure.", error);
    outcomeStatus = "This score could not be saved in this browser. No record was added.";
    outcomeStatusState = "error";
    return false;
  }
}

function outcomeScoresFor(clientId, measure) {
  return outcomeScoreRecords
    .filter(record => record.clientId === clientId && (!measure || record.measure === measure))
    .sort((a, b) => a.date.localeCompare(b.date) || a.recordedAt.localeCompare(b.recordedAt));
}

function outcomeBand(measure, score) {
  if (measure === "phq9") {
    if (score < 5) return "Minimal";
    if (score < 10) return "Mild";
    if (score < 15) return "Moderate";
    if (score < 20) return "Moderately severe";
    return "Severe";
  }
  if (score < 5) return "Minimal";
  if (score < 10) return "Mild";
  if (score < 15) return "Moderate";
  return "Severe";
}

function outcomeScoreDate(value) {
  if (!validOutcomeDate(value)) return "Date not recorded";
  return new Date(`${value}T12:00:00`).toLocaleDateString(undefined, {
    year: "numeric", month: "short", day: "numeric"
  });
}

function outcomeTrend(records, measure) {
  if (records.length < 2) return { label: "Baseline only", direction: "neutral" };
  const first = records[0].score;
  const latest = records[records.length - 1].score;
  const change = latest - first;
  if (!change) return { label: "No change", direction: "neutral" };
  const improved = OUTCOME_MEASURES[measure].higherIsWorse ? change < 0 : change > 0;
  return {
    label: `${improved ? "Improved" : "Worsened"} ${Math.abs(change)} point${Math.abs(change) === 1 ? "" : "s"}`,
    direction: improved ? "better" : "worse"
  };
}

function outcomeChartSVG(records, measure) {
  const definition = OUTCOME_MEASURES[measure];
  if (!records.length) {
    return '<div class="outcome-chart-empty">No scores recorded yet. Add a completed measure below to start this client’s trend.</div>';
  }
  const width = 440, height = 174, left = 36, right = 13, top = 14, bottomPad = 32;
  const plotWidth = width - left - right, plotHeight = height - top - bottomPad;
  const bottom = top + plotHeight;
  const scores = records.map(record => record.score);
  const x = scores.map((_, index) => scores.length === 1
    ? left + plotWidth / 2
    : left + index * plotWidth / (scores.length - 1));
  const y = scores.map(score => top + (1 - score / definition.max) * plotHeight);
  const grid = [0, .25, .5, .75, 1].map(fraction => {
    const value = Math.round(definition.max * fraction);
    const lineY = top + (1 - fraction) * plotHeight;
    return `<line class="grid-line" x1="${left}" x2="${width - right}" y1="${lineY}" y2="${lineY}"/><text class="axis-label" x="${left - 7}" y="${lineY + 3.5}" text-anchor="end">${value}</text>`;
  }).join("");
  const path = x.map((position, index) =>
    `${index ? "L" : "M"}${position.toFixed(1)},${y[index].toFixed(1)}`
  ).join(" ");
  const area = scores.length > 1
    ? `<path class="trend-area" d="${path} L${x[x.length - 1].toFixed(1)},${bottom} L${x[0].toFixed(1)},${bottom} Z"/>`
    : "";
  const points = records.map((record, index) => {
    const details = `${outcomeScoreDate(record.date)} · ${record.score}/${definition.max} · ${outcomeBand(measure, record.score)}${record.provider ? ` · ${record.provider}` : ""}${record.note ? ` · ${record.note}` : ""}`;
    return `<circle class="trend-point${index === records.length - 1 ? " latest" : ""}" cx="${x[index].toFixed(1)}" cy="${y[index].toFixed(1)}" r="${index === records.length - 1 ? 5 : 4}"><title>${escapeHTML(details)}</title></circle>`;
  }).join("");
  const labels = scores.length === 1
    ? `<text class="point-label" x="${x[0]}" y="${y[0] - 10}" text-anchor="middle">${scores[0]}</text>`
    : `<text class="point-label" x="${x[0] + 5}" y="${y[0] - 9}" text-anchor="start">${scores[0]}</text><text class="point-label" x="${x[x.length - 1] - 5}" y="${y[y.length - 1] - 9}" text-anchor="end">${scores[scores.length - 1]}</text>`;
  const dates = records.map(record => outcomeScoreDate(record.date));
  const dateLabels = dates.length === 1
    ? `<text class="axis-label" x="${x[0]}" y="${height - 7}" text-anchor="middle">${escapeHTML(dates[0])}</text>`
    : `<text class="axis-label" x="${left}" y="${height - 7}" text-anchor="start">${escapeHTML(dates[0])}</text><text class="axis-label" x="${width - right}" y="${height - 7}" text-anchor="end">${escapeHTML(dates[dates.length - 1])}</text>`;
  const description = `${definition.label}, score scale 0 to ${definition.max}. ${records.map(record => `${outcomeScoreDate(record.date)}: ${record.score}`).join("; ")}.`;
  return `<svg class="outcome-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHTML(description)}"><title>${definition.label} score trend</title><desc>${escapeHTML(description)}</desc>${grid}${area}${scores.length > 1 ? `<path class="trend-line" d="${path}"/>` : ""}${points}${labels}${dateLabels}</svg>`;
}

function outcomeMeasureCard(clientId, measure) {
  const definition = OUTCOME_MEASURES[measure];
  const records = outcomeScoresFor(clientId, measure);
  const baseline = records[0];
  const latest = records[records.length - 1];
  return `<article class="outcome-chart-card">
    <div class="outcome-chart-top"><h3>${definition.label}</h3></div>
    ${latest ? `<div class="outcome-latest"><span class="outcome-latest-label">Latest</span><strong class="outcome-latest-score">${latest.score}</strong><span class="outcome-latest-scale">/ ${definition.max}</span></div>
      <div class="outcome-baseline">Baseline <strong>${baseline.score}</strong> · ${escapeHTML(outcomeScoreDate(baseline.date))}</div>`
      : `<div class="outcome-baseline">Scale: 0–${definition.max}${measure === "phq9" ? " · lower scores indicate fewer symptoms" : " · lower scores indicate fewer symptoms"}</div>`}
    <div class="outcome-svg-wrap"><div class="outcome-svg-heading"><span>Score trend</span><span>Scale 0–${definition.max}</span></div>${outcomeChartSVG(records, measure)}</div>
    ${latest ? `<div class="outcome-band"><strong>${escapeHTML(outcomeBand(measure, latest.score))} · ${escapeHTML(outcomeScoreDate(latest.date))}</strong><span class="outcome-provider">${escapeHTML(latest.provider || "Provider not recorded")}</span></div>` : ""}
  </article>`;
}

function outcomeMeasureSummary(clientId, measure) {
  const definition = OUTCOME_MEASURES[measure];
  const records = outcomeScoresFor(clientId, measure);
  const latest = records[records.length - 1];
  return `<article class="outcome-metric-card">
    <div class="outcome-metric-top"><h3>${definition.label}</h3><span class="outcome-metric-date">${latest ? `Latest · ${escapeHTML(outcomeScoreDate(latest.date))}` : "No baseline recorded"}</span></div>
    ${latest
      ? `<div class="outcome-metric-score"><strong>${latest.score}</strong><span>/ ${definition.max}</span></div><div class="outcome-metric-band">${escapeHTML(outcomeBand(measure, latest.score))}</div>`
      : '<div class="outcome-metric-empty">—</div>'}
  </article>`;
}

function outcomeLatestScores(clientId) {
  const records = outcomeScoresFor(clientId).slice().reverse().slice(0, 5);
  if (!records.length) return '<div class="outcome-dashboard-empty">No completed outcome measures are recorded for this client yet.</div>';
  return `<div class="outcome-latest-table-wrap"><table class="outcome-latest-table">
    <thead><tr><th>Date</th><th>Measure</th><th>Score</th><th>Severity band</th><th>Provider</th></tr></thead>
    <tbody>${records.map(record => `<tr><td>${escapeHTML(outcomeScoreDate(record.date))}</td><td><strong>${OUTCOME_MEASURES[record.measure].label}</strong></td><td class="score">${record.score} / ${OUTCOME_MEASURES[record.measure].max}</td><td>${escapeHTML(outcomeBand(record.measure, record.score))}</td><td>${escapeHTML(record.provider || "Not recorded")}</td></tr>`).join("")}</tbody>
  </table></div>`;
}

function outcomeHistoryTable(clientId) {
  const records = outcomeScoresFor(clientId).slice().reverse();
  if (!records.length) return '<div class="record-empty-state" style="margin:16px;">No outcome measures recorded for this client yet.</div>';
  return `<div class="outcome-table-wrap"><table class="outcome-table"><thead><tr><th>Measure</th><th>Date</th><th class="num">Score</th><th>Band</th><th>Provider</th><th>Note</th></tr></thead><tbody>${records.map(record => `<tr><td><strong>${OUTCOME_MEASURES[record.measure].label}</strong></td><td>${escapeHTML(outcomeScoreDate(record.date))}</td><td class="num">${record.score} / ${OUTCOME_MEASURES[record.measure].max}</td><td>${escapeHTML(outcomeBand(record.measure, record.score))}</td><td>${escapeHTML(record.provider || "Not recorded")}</td><td>${escapeHTML(record.note || "—")}</td></tr>`).join("")}</tbody></table></div>`;
}

      </aside>

    <section class="outcome-dashboard-card" aria-labelledby="outcome-latest-title">

    <section class="outcome-dashboard-card" id="outcome-trends" aria-labelledby="outcome-chart-title">

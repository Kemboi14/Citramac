    ? `Last signed: triage v${escapeHTML(encounter.lastTriageVersion || 1)} at ${escapeHTML(formatTriageTime(encounter.lastTriageAt))}${encounter.lastTriageBy ? ` by ${escapeHTML(encounter.lastTriageBy)}` : ''}${encounter.priority ? ` — ${escapeHTML(encounter.priority)} ${escapeHTML(({ RED:'Emergency', ORANGE:'Urgent', YELLOW:'Priority', GREEN:'Routine' })[encounter.priority] || '')}` : ''}.`
    : 'No previous signed triage time is recorded.';
  const fields = [
    ['heartRate', 'Heart rate', 'bpm'],
    ['bloodPressureSystolic', 'Blood pressure — systolic', 'mmHg'],
    ['bloodPressureDiastolic', 'Blood pressure — diastolic', 'mmHg'],
    ['respiratoryRate', 'Respiratory rate', '/min'],
    ['temperature', 'Temperature', '°C'],
    ['oxygenSaturation', 'SpO₂', '%'],
    ['bloodGlucose', 'Blood glucose', 'mmol/L']
  ];
  const repeatStatus = (key) => draft.observations?.[key]?.status || 'Not repeated';
  const observationValue = (key) => draft.observations?.[key]?.value || '';

  return `
    ${renderClientBanner({ ...client, status: encounter.status, priority: encounter.priority })}
    <div class="triage-encounter-layout">
      ${renderTriageEncounterContext(encounter, client)}
      <main class="triage-encounter-main">
        <div class="triage-encounter-heading">
          <div>
            <h1 class="page-title">Triage re-check</h1>
            <p class="page-subtitle">Record what has changed and repeat observations only when taken</p>
          </div>
          <button class="btn ghost" type="button" onclick="showTriageWorklist()">Back to queue</button>
        </div>
        <div class="triage-workspace">
      <form id="quick-recheck-form" data-encounter-id="${escapeHTML(encounter.encounterId)}">
        <section class="card recheck-card">
          <div class="card-body recheck-intro">
            <div class="registration-eyebrow">${escapeHTML(encounter.visitLabel || 'Triage re-check')} · Is anything different since the last check?</div>
            <h2>Quick re-check</h2>
            <p>${prior} A re-check takes about 30 seconds; open a full re-triage if anything has changed.</p>
          </div>
          <div class="card-body recheck-fields">
            <div class="fieldgrid">
              <div class="field">
                <label for="recheck-change">Any change since the last check (client, family or staff report)? <span class="required-mark">REQUIRED</span></label>
                <select id="recheck-change" name="changeSinceLastCheck" required>
                  <option value="">— select —</option>
                  <option value="No change" ${draft.changeSinceLastCheck === 'No change' ? 'selected' : ''}>No change</option>
                  <option value="Yes — change reported" ${draft.changeSinceLastCheck === 'Yes — change reported' ? 'selected' : ''}>Yes — change reported</option>
                  <option value="Unable to determine" ${draft.changeSinceLastCheck === 'Unable to determine' ? 'selected' : ''}>Unable to determine</option>
                </select>
              </div>
              <div class="field">
                <label for="recheck-distress">Distress / behaviour now</label>
                <select id="recheck-distress" name="distressBehaviour">
                  <option value="Low — calm, engages easily" ${!draft.distressBehaviour || draft.distressBehaviour === 'Low — calm, engages easily' ? 'selected' : ''}>Low — calm, engages easily</option>
                  <option value="Moderate">Moderate</option>
                  <option value="High">High</option>
                  <option value="Unable to assess">Unable to assess</option>
                </select>
              </div>
            </div>

            <div class="recheck-observations-heading">
              <strong>Repeat observations</strong>
              <span>Leave blank if not repeated — the previous set carries forward.</span>

            <div class="recheck-observation-grid">

                const pairedBp = key === 'bloodPressureSystolic' || key === 'bloodPressureDiastolic';
                if (key === 'bloodPressureDiastolic') return '';
                const keys = pairedBp ? ['bloodPressureSystolic', 'bloodPressureDiastolic'] : [key];

        </div>

    </div>
  `;

function formatTriageDate(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return 'Not scheduled';
  const pad = part => String(part).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function formatTriageTime(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime())
    ? 'time not recorded'
    : `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
}

function triageWorklist() {
  const now = Date.now();
  const items = TRIAGE_QUEUE
    .filter(encounter =>
      ['Awaiting triage', 'Waiting', 'Re-check due'].includes(encounter.status) ||
      (encounter.status === 'In triage' && (encounter.isNewEncounter || encounter.triageStartedAt || encounter.triageDraftSavedAt || encounter.fullRetriageRequestedAt))
    )
    .map(encounter => {
      const client = CLIENTS.find(item => item.id === encounter.id);
      const dueAt = encounter.dueAt ? new Date(encounter.dueAt).getTime() : Number.POSITIVE_INFINITY;
      const isAwaiting = encounter.status !== 'Re-check due';
      const isOverdue = isAwaiting && dueAt < now;
      const arrivalAt = encounter.arrivalAt
        ? new Date(encounter.arrivalAt).getTime()
        : Number.isFinite(dueAt) ? dueAt - 10 * 60 * 1000 : now;
      const waitMinutes = Math.max(0, Math.floor((now - arrivalAt) / 60000));
      return { encounter, client, dueAt, isOverdue, waitMinutes };
    })
    .sort((a, b) =>
      Number(b.isOverdue) - Number(a.isOverdue) ||
      a.dueAt - b.dueAt
    );
  const overdueCount = items.filter(item => item.isOverdue).length;

  return `
    <div class="page-header">
      <div>
        <div class="registration-eyebrow">Clinical workflow</div>
        <h1 class="page-title">Triage — awaiting and re-checks due</h1>
        <p class="page-subtitle">${items.length} ${items.length === 1 ? 'item' : 'items'} · ${overdueCount} overdue</p>
        <p class="page-subtitle">Overdue first, then due time. Priority is assigned after triage.</p>
        <p class="page-subtitle">Fictional training cases are marked DEMO.</p>
      </div>
    </div>

    ${registrationStorageIssue ? `<div class="callout" role="status">${escapeHTML(registrationStorageIssue)}</div>` : ''}
    <div class="card triage-worklist-card">
      <div class="card-header">
        <span>Triage — awaiting and re-checks due</span>
        <span class="tag">${items.length} ${items.length === 1 ? 'item' : 'items'} · ${overdueCount} overdue</span>
      </div>
      <div class="triage-worklist-scroll">
        <table class="data-table triage-worklist-table" aria-label="Triage awaiting and re-checks due">
          <thead><tr><th>Client</th><th>Setting / status</th><th>Detail</th><th>Due</th><th><span class="sr-only">Open encounter</span></th></tr></thead>
          <tbody>
            ${items.length ? items.map(({ encounter, client, isOverdue, waitMinutes }) => {
              const status = encounter.status === 'Re-check due'
                ? 'Re-check due'
                : encounter.status === 'In triage' ? 'In triage' : 'Awaiting triage';
              const detail = status === 'Re-check due'
                ? `Re-check due · last triage v${escapeHTML(encounter.lastTriageVersion || 1)} ${escapeHTML(formatTriageTime(encounter.lastTriageAt))}`
                : `${waitMinutes} min · triage target`;
              return `
                <tr class="${isOverdue ? 'triage-worklist-overdue' : ''}">
                  <td><strong>${escapeHTML(encounter.name || client?.name || 'Unknown client')}${encounter.isDemo ? ' <span class="tag">DEMO</span>' : ''} · ${escapeHTML(encounter.id)}</strong><br><span class="triage-worklist-id">${escapeHTML(client?.citramacId || 'CITRAMAC ID not recorded')}</span></td>
                  <td>${escapeHTML((client?.type || 'outpatient').replace(/^./, character => character.toUpperCase()))} · ${escapeHTML(status)}</td>
                  <td>${detail}${isOverdue ? `<br><span class="triage-overdue-label">Overdue</span>` : ''}</td>
                  <td>${escapeHTML(formatTriageDate(encounter.dueAt))}</td>
                  <td><button class="btn ghost sm" type="button" data-open-triage="${escapeHTML(encounter.encounterId)}">Open</button></td>
                </tr>
              `;
            }).join('') : '<tr><td colspan="5" class="triage-worklist-empty">No arrivals or re-checks are currently due.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function triageFormControls(form) {
  return Array.from(form.querySelectorAll('input, select, textarea'))
    .filter(control => !control.readOnly && !['button', 'submit'].includes(control.type));
}

function readTriageFormDraft(form) {
  return triageFormControls(form).map(control => ({
    value: control.value,
    checked: control.type === 'checkbox' || control.type === 'radio' ? control.checked : undefined
  }));
}

function readTriageStructuredFields(form) {
  return triageFormControls(form).flatMap((control, index) => {
    if (!control.getClientRects().length) return [];
    const group = Array.from(control.classList).find(name => /^t-[a-z]-/.test(name));
    const key = group || control.id || control.name || `field-${index + 1}`;
    const label = control.closest('.field')?.querySelector('label')?.textContent.trim()
      || control.closest('label')?.textContent.trim()
      || key.replace(/^t-/, '').replace(/-/g, ' ');
    if (control.type === 'checkbox' || control.type === 'radio') {
      if (!control.checked) return [];
      const choice = control.closest('label')?.textContent.trim() || control.value;
      return [{ key, label: control.type === 'checkbox' ? `${key.replace(/^t-/, '').replace(/-/g, ' ')} — selected` : label, value: choice }];
    }
    return [{ key, label, value: control.value.trim() }];
  });
}

function restoreTriageFormDraft(form, draft) {
  if (!Array.isArray(draft)) return;
  triageFormControls(form).forEach((control, index) => {
    const saved = draft[index];
    if (!saved) return;
    if (control.type === 'checkbox' || control.type === 'radio') control.checked = Boolean(saved.checked);
    else control.value = saved.value ?? '';
  });
}

function updateTriageBranches(form) {
  const clientAbsent = form.querySelector('input[name="present"][value="no"]').checked;
  document.getElementById('telephone-screen').style.display = clientAbsent ? '' : 'none';
  document.getElementById('direct-obs').style.display = clientAbsent ? 'none' : '';
  const overrideSelected = form.querySelector('input[name="decision"][value="override"]').checked;
  const overrideReason = document.getElementById('override-reason');
  overrideReason.disabled = !overrideSelected;
  overrideReason.required = overrideSelected;
  if (overrideSelected) overrideReason.closest('details').open = true;
}

function saveTriageDraft(form, encounter) {
  encounter.triageDraft = readTriageFormDraft(form);
  encounter.triageDraftSavedAt = new Date().toISOString();
  saveTriageEncounters();
  const status = document.getElementById('triage-draft-status');
  if (status) status.textContent = `Draft saved ${formatTriageTime(encounter.triageDraftSavedAt)}`;
}

function collectQuickRecheck(form) {
  const values = new FormData(form);
  const statusOf = name => values.get(`observationStatus-${name}`);
  const observation = name => ({
    value: values.get(name) || '',
    status: statusOf(name)
  });
  return {
    changeSinceLastCheck: values.get('changeSinceLastCheck'),
    distressBehaviour: values.get('distressBehaviour'),
    note: String(values.get('note') || '').trim(),
    observations: {
      heartRate: observation('heartRate'),
      bloodPressureSystolic: { value: values.get('bloodPressureSystolic') || '', status: statusOf('bloodPressure') },
      bloodPressureDiastolic: { value: values.get('bloodPressureDiastolic') || '', status: statusOf('bloodPressure') },
      respiratoryRate: observation('respiratoryRate'),
      temperature: observation('temperature'),
      oxygenSaturation: observation('oxygenSaturation'),
      bloodGlucose: observation('bloodGlucose')
    }
  };
}

function initQuickRecheck(form) {
  const encounter = TRIAGE_QUEUE.find(item => item.encounterId === form.dataset.encounterId);
  if (!encounter) {
    console.error(`Cannot save quick re-check: encounter ${form.dataset.encounterId} was not found.`);
    return;
  }
  const statusControl = name => form.elements.namedItem(`observationStatus-${name}`);
  const observationInputs = name => name === 'bloodPressure'
    ? ['bloodPressureSystolic', 'bloodPressureDiastolic'].map(key => form.elements.namedItem(key))
    : [form.elements.namedItem(name)];
  const applyMeasurementRequirement = () => {
    const bloodPressureMeasured = statusControl('bloodPressure').value === 'Measured';
    form.elements.namedItem('bloodPressureSystolic').required = bloodPressureMeasured;
    form.elements.namedItem('bloodPressureDiastolic').required = bloodPressureMeasured;
    ['heartRate','respiratoryRate','temperature','oxygenSaturation','bloodGlucose'].forEach(name => {
      form.elements.namedItem(name).required = statusControl(name).value === 'Measured';
    });
  };
  const saveDraft = () => {
    applyMeasurementRequirement();
    encounter.recheckDraft = { ...collectQuickRecheck(form), savedAt: new Date().toISOString() };
    saveTriageEncounters();
    const status = document.getElementById('recheck-draft-status');
    if (status) status.textContent = `Draft saved ${formatTriageTime(encounter.recheckDraft.savedAt)}`;
  };
  form.addEventListener('input', saveDraft);
  form.addEventListener('change', saveDraft);
  form.querySelectorAll('[name^="observationStatus-"]').forEach(select => {
    select.addEventListener('change', () => {
      if (select.value !== 'Measured') observationInputs(select.name.replace('observationStatus-', '')).forEach(input => { input.value = ''; });
      applyMeasurementRequirement();
    });
  });
  form.querySelectorAll('.recheck-observation input').forEach(input => {
    input.addEventListener('input', () => {
      if (input.value) {
        const measurementName = input.name.startsWith('bloodPressure') ? 'bloodPressure' : input.name;
        statusControl(measurementName).value = 'Measured';
        applyMeasurementRequirement();
      }
    });
  });
  applyMeasurementRequirement();

  document.getElementById('open-full-retriage').addEventListener('click', () => {
    encounter.status = 'In triage';
    encounter.fullRetriageRequestedAt = new Date().toISOString();
    saveTriageEncounters();
    showPage('triage');
  });
  form.addEventListener('submit', event => {
    event.preventDefault();
    applyMeasurementRequirement();
    if (!form.reportValidity()) return;
    const signedAt = new Date().toISOString();
    const signedBy = 'J. Njoroge, RN';
    const signedRecheck = {
      ...collectQuickRecheck(form),
      signedAt,
      signedBy,
      version: (encounter.rechecks?.length || 0) + 1
    };
    encounter.rechecks = [...(encounter.rechecks || []), signedRecheck];
    encounter.lastRecheckAt = signedAt;
    encounter.lastRecheckBy = signedBy;
    encounter.recheckDraft = null;
    encounter.status = 'Re-check completed';
    saveTriageEncounters();
    showTriageWorklist();
  });
}

function organizeTriageSections(form) {
  const cards = Array.from(form.children).filter(element => element.classList.contains('card'));
  cards.forEach(card => {
    const heading = card.querySelector('.card-header');
    const body = card.querySelector('.card-body');
    if (!heading || !body) return;
    const details = document.createElement('details');
    details.className = 'triage-section card';
    details.id = card.id;
    details.style.cssText = card.style.cssText;
    const title = heading.textContent.trim();
    details.dataset.sectionTitle = title;
    const summary = document.createElement('summary');
    summary.className = 'triage-section-heading';
    summary.textContent = title;
    details.append(summary, body);
    if (title.startsWith('Section B —') || title.startsWith('Section C —')) details.open = true;
    card.replaceWith(details);
  });
}

function initTriage() {
  document.querySelectorAll('[data-open-triage]').forEach(button => {
    button.addEventListener('click', () => openTriageEncounter(button.dataset.openTriage));
  });
  const recheckForm = document.getElementById('quick-recheck-form');
  if (recheckForm) {
    initQuickRecheck(recheckForm);
    return;
  }
  const f = document.getElementById('triage-form');
  if (!f) return;
  organizeTriageSections(f);
  const activeEncounter = TRIAGE_QUEUE.find(encounter => encounter.encounterId === currentTriageEncounterId);
  restoreTriageFormDraft(f, activeEncounter?.triageDraft);
  if (!activeEncounter?.triageDraft) {
    document.getElementById('final-priority').value =
      activeEncounter?.lastTriageAt || activeEncounter?.triageRecord ? activeEncounter.priority || '' : '';
  }
  updateTriageBranches(f);
  if (activeEncounter?.triageDraftSavedAt) {
    document.getElementById('triage-draft-status').textContent = `Draft saved ${formatTriageTime(activeEncounter.triageDraftSavedAt)}`;
  }
  f.addEventListener('input', () => {
    if (activeEncounter) saveTriageDraft(f, activeEncounter);
  });
  const rv = (id) => (document.getElementById(id) || {}).value;
  const anyChecked = (cls) => document.querySelectorAll('.' + cls + ':checked');

  function recompute() {
    const rows = []; let rec = 'GREEN'; const reasons = []; const alerts = [];
    const bump = (p) => { const o = { GREEN:0, YELLOW:1, ORANGE:2, RED:3 }; if (o[p] > o[rec]) rec = p; };
    const now = new Date().toLocaleTimeString();
    const coreScreens = [
      ['t-d-suicidal', 'Suicide / self-harm'],
      ['t-e-thoughts', 'Risk of harm to others'],
      ['t-f-change', 'Acute mental state'],
      ['t-h-concern', 'Urgent medical concern'],
      ['t-i-safe', 'Safeguarding / current safety'],
      ['t-j-concern', 'Immediate functional safety']
    ];
    const unansweredScreens = coreScreens
      .filter(([id]) => rv(id) === '')
      .map(([, label]) => label);
    const uncertainValues = new Set(['unable', 'unknown', 'unsure', 'uncertain']);
    const unresolvedScreens = coreScreens
      .filter(([id]) => uncertainValues.has(rv(id)))
      .map(([, label]) => label);

    // D
    if (rv('t-d-suicidal') === 'yes') {
      alerts.push('Suicide risk'); bump('ORANGE'); reasons.push('suicidal thoughts present');
      rows.push(['Suicide risk', rv('t-d-actnow') === 'yes' ? 'Thoughts of acting now — YES' : 'Suicidal thoughts documented', 'Client report']);
      if (rv('t-d-actnow') === 'yes') { bump('RED'); rows.push(['Acting now', 'Intent to act on thoughts now', 'Client report']); }
      if (rv('t-d-attempt') === 'yes') { bump('RED'); rows.push(['Recent self-harm / attempt', 'Reported', 'Client report']); }
      if (rv('t-d-means') === 'yes') { bump('ORANGE'); rows.push(['Access to means', 'Known access', 'Client report']); }
      document.getElementById('t-trig-d').style.display = '';
    } else { document.getElementById('t-trig-d').style.display = 'none'; }

    // E
    if (rv('t-e-thoughts') === 'yes' || rv('t-e-behaviour') === 'yes' || rv('t-e-act') === 'yes') {
      alerts.push('Aggression / violence risk'); bump('ORANGE'); reasons.push('risk of harm to others present');
      rows.push(['Risk to others', 'Thoughts/behaviour/act documented', 'Client report']);
      if (rv('t-e-danger') === 'yes') { bump('RED'); rows.push(['Immediate danger', 'Behaviour suggests immediate danger', 'Clinician observation']); }
      document.getElementById('t-trig-e').style.display = '';
    } else { document.getElementById('t-trig-e').style.display = 'none'; }

    // F
    const fFeats = Array.from(anyChecked('t-f-feature')).map(e => e.value);
    if (rv('t-f-change') === 'yes' || fFeats.length) {
      bump('ORANGE'); reasons.push('acute mental state change');
      rows.push(['Acute mental state change', fFeats.join(', ') || 'Change reported', 'Clinician observation']);
      document.getElementById('t-trig-f').style.display = '';
    } else { document.getElementById('t-trig-f').style.display = 'none'; }
    const loc = rv('t-f-loc');
    if (loc && loc !== 'Alert') { alerts.push('Altered consciousness'); bump('RED'); reasons.push('altered consciousness'); rows.push(['Altered consciousness', loc, 'Clinician observation']); }

    // G
    const wd = Array.from(anyChecked('t-g-wd')).map(e => e.value).filter(v => v !== 'None');
    if ((rv('t-g-use') === 'yes' && (rv('t-g-intox') === 'Significant' || rv('t-g-intox') === 'Severe')) ||
        (rv('t-g-stopped') === 'yes' && wd.length) || wd.length) {
      alerts.push('Withdrawal risk'); bump('ORANGE'); reasons.push('withdrawal risk');
      rows.push(['Withdrawal risk', (wd.length ? 'Symptoms: ' + wd.join(', ') : 'Recent heavy use / stopped') + (rv('t-g-seizure') === 'yes' ? ' · prior seizure' : ''), 'Client report']);
      document.getElementById('t-trig-g').style.display = '';
    } else { document.getElementById('t-trig-g').style.display = 'none'; }

    // H
    const hflags = Array.from(anyChecked('t-h-flag')).map(e => e.value);
    let vitalAbn = false;
    const bp = rv('t-h-bp'), pulse = parseInt(rv('t-h-pulse')), spo2 = parseInt(rv('t-h-spo2')), temp = parseFloat(rv('t-h-temp'));
    const bpHi = bp && bp.split('/')[0] && parseInt(bp.split('/')[0]) > 160;
    if (hflags.length || rv('t-h-concern') === 'yes') {
      bump('ORANGE'); reasons.push('acute medical concern');
      rows.push(['Medical concern', hflags.join(', ') || 'Concern reported', 'Client report']);
      if (hflags.some(x => ['Chest pain','Recent seizure','Suspected overdose','Difficulty breathing','Loss/alteration of consciousness'].includes(x))) bump('RED');
      document.getElementById('t-trig-h').style.display = '';
    } else if (bp || pulse || spo2 || temp) { document.getElementById('t-trig-h').style.display = ''; }
    else { document.getElementById('t-trig-h').style.display = 'none'; }
    if (bpHi || (pulse && (pulse > 120 || pulse < 50)) || (spo2 && spo2 < 92) || (temp && temp > 38.5)) {
      vitalAbn = true; alerts.push('Abnormal vital signs'); bump('RED'); reasons.push('abnormal vital signs');
      rows.push(['Abnormal vital signs', [bp && 'BP ' + bp, pulse && 'Pulse ' + pulse, spo2 && 'SpO2 ' + spo2 + '%', temp && 'Temp ' + temp].filter(Boolean).join(' · '), 'Measured result']);
    }

    // I
    const iflags = Array.from(anyChecked('t-i-flag')).map(e => e.value).filter(v => v !== 'None identified');
    if (iflags.length || rv('t-i-safe') === 'no' || rv('t-i-return') === 'no') {
      alerts.push('Safeguarding concern'); bump('ORANGE'); reasons.push('safeguarding concern');
      rows.push(['Safeguarding concern', iflags.join(', ') || 'Client does not feel safe', 'Client report']);
      document.getElementById('t-trig-i').style.display = '';
    } else { document.getElementById('t-trig-i').style.display = 'none'; }

    // J
    if (rv('t-j-concern') === 'yes') { bump('YELLOW'); reasons.push('immediate functional safety concern'); rows.push(['Functional safety concern', 'Unable to meet basic needs', 'Client report']); }

    // K (only meaningful when not present)
    if (document.querySelector('input[name="present"][value="no"]').checked) {
      const kflags = Array.from(anyChecked('t-k-flag')).map(e => e.value);
      rows.push(['Telephone / third-party screen', kflags.join(', ') || 'No concerns reported', 'Third-party report']);
      if (rv('t-k-emergency') === 'yes') { bump('RED'); alerts.push('Telephone screen: emergency assistance required'); reasons.push('emergency assistance required (third-party report)'); }
      if (kflags.some(x => x.includes('Suicide'))) { alerts.push('Suicide risk'); bump('ORANGE'); reasons.push('suicide concern via third party'); }
    }

    if (unansweredScreens.length) {
      rows.push(['Safety screen incomplete', `Not assessed: ${unansweredScreens.join(', ')}`, 'Triage screen']);
    }
    if (unresolvedScreens.length) {
      rows.push(['Clinical review required', `Unable to determine: ${unresolvedScreens.join(', ')}`, 'Triage screen']);
    }
    const recommendationReady = unansweredScreens.length === 0 && unresolvedScreens.length === 0;
    const hasTriggeredPriority = rec !== 'GREEN' && reasons.length > 0;
    const recommendationLabel = recommendationReady
      ? rec
      : hasTriggeredPriority ? `${rec} — preliminary` : 'Review required';
    const summaryReasons = [
      reasons.length ? reasons.join(' · ') : recommendationReady
        ? 'No immediate safety/medical concern identified in the completed screen.'
        : 'Complete the immediate safety and urgent medical questions. Unanswered items are not treated as negative findings.',
      alerts.length ? `Alerts: ${Array.from(new Set(alerts)).join(', ')}` : ''
    ].filter(Boolean);

    // Render summary + recommendation
    const sb = document.getElementById('summary-body');
    sb.innerHTML = rows.length
      ? rows.map(r => `<tr><td><strong>${escapeHTML(r[0])}</strong></td><td>${escapeHTML(r[1])}</td><td>${escapeHTML(r[2])} <span style="color:var(--faint)">· ${escapeHTML(now)}</span></td></tr>`).join('')
      : '<tr><td colspan="3" style="color: var(--muted);">No positive findings recorded. Complete all core safety screens; this is not an assessed negative screen.</td></tr>';
    document.getElementById('sys-rec').textContent = recommendationLabel;
    document.getElementById('rec-reasons').textContent = summaryReasons.join(' · ');
    document.getElementById('triage-live-summary').dataset.priority =
      recommendationReady || hasTriggeredPriority ? rec : 'pending';
    if (recommendationReady && document.querySelector('input[name="decision"][value="confirm"]').checked) {
      document.getElementById('final-priority').value = rec;
    }
  }

  f.addEventListener('change', recompute);

  // Physically present branching
  f.addEventListener('change', (e) => {
    if (e.target.name === 'present') {
      updateTriageBranches(f);
    }
    if (e.target.name === 'decision') {
      updateTriageBranches(f);
    }
  });

  // Keep allergy status and details aligned across the triage form and patient banner.
  const allergyStatusInput = document.getElementById('t-allergy-status');
  const allergyDetailInput = document.getElementById('t-allergy-detail');
  const syncTriageAllergy = () => {
    const c = currentClient || CLIENTS.find(x => x.id === TRIAGE_QUEUE[0]?.id);
    if (!c) return;
    c.allergyStatus = allergyStatusInput.value === 'Known'
      ? 'Client reports an allergy'
      : allergyStatusInput.value === 'No known allergies'
        ? 'Client reports none'
        : 'Not asked / unknown';
    c.allergies = allergyDetailInput.value;
    const summary = document.getElementById('triage-allergy-value');
    if (summary) {
      const allergy = clientBannerAllergyState(c);
      summary.textContent = allergy.state === 'known'
        ? allergy.items.join(', ') || 'Known allergy — details not recorded'
        : allergy.label;
    }
    refreshClientBannerAllergy(c);
  };
  allergyStatusInput.addEventListener('change', syncTriageAllergy);
  allergyDetailInput.addEventListener('change', syncTriageAllergy);

  // Register actions as trackable tasks
  document.getElementById('t-n-register').addEventListener('click', () => {
    const checked = Array.from(document.querySelectorAll('.t-n-action:checked'));
    const tl = document.getElementById('task-list');
    if (!checked.length) return;
    const status = document.getElementById('t-n-status').value;
    const rows = checked.map(cb => `<tr><td><strong>${cb.value}</strong></td><td>Psychiatry / Nursing</td><td><span class="tag">${status}</span></td><td>${new Date().toLocaleString()}</td></tr>`).join('');
    if (tl.querySelector('td[colspan]')) tl.innerHTML = '';
    tl.innerHTML += rows;
    checked.forEach(cb => cb.checked = false);
  });

  document.getElementById('save-triage-draft').addEventListener('click', () => {
    if (activeEncounter) saveTriageDraft(f, activeEncounter);
  });

  document.getElementById('sign-triage').addEventListener('click', () => {
    if (!activeEncounter) {
      console.error('Cannot sign triage: no active encounter is selected.');
      return;
    }
    const invalidControl = f.querySelector(':invalid');
    if (invalidControl) {
      invalidControl.closest('details.triage-section')?.setAttribute('open', '');
      invalidControl.focus();
      invalidControl.reportValidity();
      const signStatus = document.getElementById('triage-sign-status');
      signStatus.hidden = false;
      signStatus.className = 'callout';
      signStatus.textContent =
        'Complete the required safety screens and select a final priority before signing.';
      return;
    }
    const decision = f.querySelector('input[name="decision"]:checked')?.value;
    const overrideReason = document.getElementById('override-reason').value.trim();
    if (decision === 'override' && !overrideReason) {
      document.getElementById('override-reason').required = true;
      document.getElementById('override-reason').focus();
      document.getElementById('override-reason').reportValidity();
      return;
    }
    const signedAt = new Date().toISOString();
    const signedBy = 'J. Njoroge, RN';
    const finalPriority = document.getElementById('final-priority').value;
    const findings = Array.from(document.querySelectorAll('#summary-body tr'))
      .filter(row => row.cells.length === 3)
      .map(row => Array.from(row.cells, cell => cell.textContent.trim()));
    activeEncounter.triageRecord = {
      fields: readTriageFormDraft(f),
      structuredFields: readTriageStructuredFields(f),
      recommendation: document.getElementById('sys-rec').textContent,
      recommendationReasons: document.getElementById('rec-reasons').textContent,
      findings,
      priority: finalPriority,
      decision,
      overrideReason: decision === 'override' ? overrideReason : '',
      signedAt,
      signedBy
    };
    activeEncounter.priority = finalPriority;
    activeEncounter.presenting = document.getElementById('t-c-concern').value.trim();
    activeEncounter.lastTriageAt = signedAt;
    activeEncounter.lastTriageBy = signedBy;
    activeEncounter.lastTriageVersion = (activeEncounter.lastTriageVersion || 0) + 1;
    activeEncounter.status = 'Triage completed';
    activeEncounter.triageDraft = null;
    activeEncounter.triageDraftSavedAt = null;
    currentClient.priority = finalPriority;
    saveTriageEncounters();
    const signStatus = document.getElementById('triage-sign-status');
    signStatus.hidden = false;
    signStatus.className = 'callout alert-success';
    signStatus.textContent =
      `Triage signed. ${currentClient.name || 'Client'} has been added to the Psychiatry queue with ${finalPriority} priority. You can continue here or open Psychiatric from the left menu.`;
    f.querySelectorAll('input, select, textarea').forEach(control => { control.disabled = true; });
    document.getElementById('save-triage-draft').disabled = true;
    document.getElementById('sign-triage').disabled = true;
  });

  recompute();
}

function restoreGroupProgrammeRecords() {
  try {
    const raw = localStorage.getItem(GROUP_PROGRAMME_STORAGE_KEY);
    if (!raw) {
      groupProgrammeStore = { categories: DEFAULT_GROUP_PROGRAMME_CATEGORIES.slice(), sessions: [] };
      return;
    }
    const saved = JSON.parse(raw);
    if (!saved || !Array.isArray(saved.categories) || !saved.categories.every(category => typeof category === "string") ||
        !Array.isArray(saved.sessions) || saved.sessions.some(session =>
          !session || typeof session.id !== "string" || !Array.isArray(session.clientEntries) ||
          session.clientEntries.some(entry => !entry || typeof entry.clientId !== "string" || typeof entry.attendance !== "string")
        )) {
      throw new Error("Saved group programme data has an invalid format.");
    }
    groupProgrammeStore = { categories: saved.categories, sessions: saved.sessions };
  } catch (error) {
    groupProgrammeStore = { categories: DEFAULT_GROUP_PROGRAMME_CATEGORIES.slice(), sessions: [] };
    groupProgrammeStorageIssue = "Saved group programme records could not be loaded. No saved data was changed.";
    groupProgrammeStorageBlocked = true;
    console.error("Unable to restore group programme records.", error);
  }
}

function saveGroupProgrammeStore(nextStore) {
  if (groupProgrammeStorageBlocked) return false;
  try {
    localStorage.setItem(GROUP_PROGRAMME_STORAGE_KEY, JSON.stringify(nextStore));
    groupProgrammeStore = nextStore;
    groupProgrammeStorageIssue = "";
    return true;
  } catch (error) {
    groupProgrammeStorageIssue = "The group programme record could not be saved in this browser. No confirmation was recorded.";
    console.error("Unable to save group programme records.", error);
    return false;
  }
}

  return CLIENTS.filter(client =>
    ["Active", "Admitted", "Review"].includes(client.status) &&
    client.identityStatus !== "unknown" &&
    !/discharged/i.test(String(client.status || ""))
  );
}

function groupProgrammeForClient(client) {
  return client.programme || client.program || "Not assigned";
}

function groupUnitForClient(client) {
  return client.ward || (client.type === "inpatient" ? "Residential unit not recorded" : "Outpatient");
}

function isGroupPsychotherapyAppointment(appointment) {
  return /group|programme|program|psychoeducation|spiritual|life skills|recreational/i.test(
    [appointment.type, appointment.category, appointment.topic].filter(Boolean).join(" ")
  );
}

let groupInterventionRecordsReady = false;
let groupInterventionRecordsBlocked = false;

function ensureInterventionRecordsLoaded() {
  if (groupInterventionRecordsReady) return true;
  if (groupInterventionRecordsBlocked) return false;
  const loaded = loadInterventionRecords();
  if (!Array.isArray(loaded)) {
    groupInterventionRecordsBlocked = true;
    return false;
  }
  interventionRecords = loaded;
  groupInterventionRecordsReady = true;
  return true;
}

function groupPsychotherapyInterventionRecordsForClient(clientId) {
  if (!ensureInterventionRecordsLoaded()) return [];
  return interventionRecords.filter(record =>
    record.clientId === clientId && record.moduleId === "group-psychotherapy" && !record.voided
  );
}

function syncGroupPsychotherapyClientData(record, clientEntry) {
  const client = CLIENTS.find(item => item.id === clientEntry.clientId);
  if (!client) return;
  const sessionPayload = {
    id: record.id,
    category: record.category,
    topic: record.topic,
    sessionDate: record.sessionDate,
    facilitator: record.facilitator,
    location: record.location,
    attendance: clientEntry.attendance,
    linkedIntervention: "Group Psychotherapy"
  };
  client.groupPsychotherapy = sessionPayload;
  client.groupPsychotherapyHistory = Array.isArray(client.groupPsychotherapyHistory)
    ? [sessionPayload, ...client.groupPsychotherapyHistory.filter(item => item.id !== record.id)].slice(0, 12)
    : [sessionPayload];
  client.lastIntervention = client.lastIntervention || "Group Psychotherapy";
}

function removeGroupPsychotherapyClientData(sessionId, clientId) {
  const client = CLIENTS.find(item => item.id === clientId);
  if (!client) return;
  client.groupPsychotherapyHistory = (client.groupPsychotherapyHistory || [])
    .filter(item => item.id !== sessionId);
  if (client.groupPsychotherapy?.id === sessionId) {
    client.groupPsychotherapy = client.groupPsychotherapyHistory[0] || null;
  }
}

function groupPsychotherapyInterventionRecord(record, entry) {
  return {
    id: `INT-GRP-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    clientId: entry.clientId,
    actionId: "psychotherapy",
    moduleId: "group-psychotherapy",
    moduleName: "Group Psychotherapy",
    intervention: "Group therapy",
    qty: 1,
    note: `${record.topic} · ${record.category} · ${record.facilitator} (${record.sessionDate})`,
    response: entry.observation || "",
    outcome: "",
    next: entry.followUpRequired ? "Individual follow-up task required." : "",
    completesAction: false,
    at: new Date().toISOString(),
    by: record.author,
    linkedSessionId: record.id,
    attendance: entry.attendance,
    riskReviewRequired: Boolean(entry.riskDisclosure),
    followUpRequired: Boolean(entry.followUpRequired),
    entryVersion: Number(entry.version) || 1
  };
}

function saveGroupPsychotherapyInterventions(record, nextStore) {
  if (groupProgrammeStorageBlocked) {
    groupProgrammeStorageIssue = "Saved group records could not be safely loaded; no session or intervention data was changed.";
    return false;
  }
  if (!ensureInterventionRecordsLoaded()) {
    groupProgrammeStorageIssue = interventionStorageIssue || "Linked intervention records could not be loaded; the intervention history was not changed.";
    return false;
  }
  const linkedEntries = record.clientEntries.filter(entry => {
    if (entry.attendance !== "Present") return false;
    return true;
  });

  const nextInterventionRecords = linkedEntries.length
    ? [...interventionRecords, ...linkedEntries.map(entry => groupPsychotherapyInterventionRecord(record, entry))]
    : interventionRecords;
  let previousGroupStore;
  let previousInterventions;
  try {
    previousGroupStore = localStorage.getItem(GROUP_PROGRAMME_STORAGE_KEY);
    previousInterventions = localStorage.getItem(INTERVENTION_STORAGE_KEY);
  } catch (error) {
    console.error("Unable to inspect stored group psychotherapy data before saving.", error);
    groupProgrammeStorageIssue = "Existing session and intervention records could not be checked; no confirmation was recorded.";
    return false;
  }

  try {
    localStorage.setItem(GROUP_PROGRAMME_STORAGE_KEY, JSON.stringify(nextStore));
    if (linkedEntries.length) localStorage.setItem(INTERVENTION_STORAGE_KEY, JSON.stringify(nextInterventionRecords));
    groupProgrammeStore = nextStore;
    interventionRecords = nextInterventionRecords;
    linkedEntries.forEach(entry => syncGroupPsychotherapyClientData(record, entry));
    groupProgrammeStorageIssue = "";
    return true;
  } catch (error) {
    console.error("Unable to save group psychotherapy intervention records.", error);
    try {
      if (previousGroupStore === null) localStorage.removeItem(GROUP_PROGRAMME_STORAGE_KEY);
      else localStorage.setItem(GROUP_PROGRAMME_STORAGE_KEY, previousGroupStore);
      if (previousInterventions === null) localStorage.removeItem(INTERVENTION_STORAGE_KEY);
      else localStorage.setItem(INTERVENTION_STORAGE_KEY, previousInterventions);
      groupProgrammeStorageIssue = "The group session and linked intervention records could not be saved. No confirmation was recorded.";
    } catch (rollbackError) {
      console.error("Unable to roll back the incomplete group psychotherapy save.", rollbackError);
      groupProgrammeStorageIssue = "The group session save failed and the browser could not fully restore prior stored values. Verify the session and intervention records before retrying.";
    }
    return false;
  }
}

function syncGroupPsychotherapyEntryCorrection(session, entry, before, reason) {
  if (!ensureInterventionRecordsLoaded()) {
    groupProgrammeStorageIssue = interventionStorageIssue || "Linked intervention records could not be loaded; the intervention history was not changed.";
    return false;
  }
  const correctedAt = new Date().toISOString();
  const nextRecords = interventionRecords.map(record => {
    if (record.moduleId !== "group-psychotherapy" ||
        record.linkedSessionId !== session.id ||
        record.clientId !== entry.clientId) return record;
    const correction = {
      amendedAt: correctedAt,
      reason,
      before: { attendance: before.attendance, observation: before.observation || "" },
      after: { attendance: entry.attendance, observation: entry.observation || "" }
    };
    if (entry.attendance !== "Present") {
      return {
        ...record,
        qty: 0,
        voided: true,
        attendance: entry.attendance,
        riskReviewRequired: Boolean(entry.riskDisclosure),
        followUpRequired: Boolean(entry.followUpRequired),
        correctedAt,
        correctionReason: reason,
        correctionAudit: [...(record.correctionAudit || []), correction]
      };
    }
    return {
      ...record,
      qty: 1,
      voided: false,
      attendance: "Present",
      note: `${session.topic} · ${session.category} · ${session.facilitator} (${session.sessionDate})`,
      response: entry.observation || "",
      outcome: "",
      next: entry.followUpRequired ? "Individual follow-up task required." : "",
      completesAction: false,
      riskReviewRequired: Boolean(entry.riskDisclosure),
      followUpRequired: Boolean(entry.followUpRequired),
      entryVersion: Number(entry.version) || 1,
      correctedAt,
      correctionReason: reason,
      correctionAudit: [...(record.correctionAudit || []), correction]
    };
  });
  const existing = nextRecords.some(record =>
    record.moduleId === "group-psychotherapy" && record.linkedSessionId === session.id &&
    record.clientId === entry.clientId && !record.voided
  );
  if (!existing && entry.attendance === "Present") {
    const added = groupPsychotherapyInterventionRecord(session, entry);
    added.correctedAt = correctedAt;
    added.correctionReason = reason;
    added.correctionAudit = [{
      amendedAt: correctedAt,
      reason,
      before: { attendance: before.attendance, observation: before.observation || "" },
      after: { attendance: entry.attendance, observation: entry.observation || "" }
    }];
    nextRecords.push(added);
  }
  try {
    localStorage.setItem(INTERVENTION_STORAGE_KEY, JSON.stringify(nextRecords));
    interventionRecords = nextRecords;
    if (entry.attendance === "Present") syncGroupPsychotherapyClientData(session, entry);
    else removeGroupPsychotherapyClientData(session.id, entry.clientId);
    return true;
  } catch (error) {
    console.error("Unable to synchronize corrected group psychotherapy entry.", error);
    groupProgrammeStorageIssue = "The client entry was corrected, but its intervention history could not be synchronized in this browser.";
    return false;
  }
}

function syncGroupPsychotherapySessionCorrection(session, before, reason) {
  if (!ensureInterventionRecordsLoaded()) {
    groupProgrammeStorageIssue = interventionStorageIssue || "Linked intervention records could not be loaded; the intervention history was not changed.";
    return false;
  }
  const correctedAt = new Date().toISOString();
  const nextRecords = interventionRecords.map(record => {
    if (record.moduleId !== "group-psychotherapy" || record.linkedSessionId !== session.id) return record;
    return {
      ...record,
      note: `${session.topic} · ${session.category} · ${session.facilitator} (${session.sessionDate})`,
      correctedAt,
      correctionReason: reason,
      correctionAudit: [...(record.correctionAudit || []), {
        amendedAt: correctedAt,
        reason,
        before: { topic: before.topic, category: before.category, sessionDate: before.sessionDate },
        after: { topic: session.topic, category: session.category, sessionDate: session.sessionDate }
      }]
    };
  });
  try {
    localStorage.setItem(INTERVENTION_STORAGE_KEY, JSON.stringify(nextRecords));
    interventionRecords = nextRecords;
    session.clientEntries.filter(entry => entry.attendance === "Present")
      .forEach(entry => syncGroupPsychotherapyClientData(session, entry));
    return true;
  } catch (error) {
    console.error("Unable to synchronize corrected group psychotherapy session.", error);
    groupProgrammeStorageIssue = "Session details were corrected, but linked intervention records could not be synchronized in this browser.";
    return false;
  }
}

let groupProgrammeSelectedSessionId = "";
let groupProgrammeSessionTab = "today";
let groupProgrammeView = "session";
let groupProgrammeDraftSession = null;
let groupProgrammeClientSearch = "";
let groupProgrammeStatusMessage = "";
let groupProgrammeWorkspaceInitialized = false;
let groupProgrammeWorkspaceFilters = { programme: "", unit: "", eligibility: "eligible" };
const groupProgrammeDraftAttendance = {};
const groupProgrammeObservationOpen = {};

function groupProgrammeClientInitials(name) {
  return String(name).split(/\s+/).filter(Boolean).map(word => word[0]).join("").slice(0, 2).toUpperCase();
}

function groupProgrammeSessionStatus(item) {
  if (item.kind === "saved") return { label: "Confirmed", className: "is-completed" };
  if (item.kind === "draft") return { label: "Draft", className: "is-upcoming" };
  const today = dateOffset(0);
  if (item.date > today) return { label: "Upcoming", className: "is-upcoming" };
  if (item.date < today) return { label: "Awaiting documentation", className: "is-past-due" };
  if (!item.time) return { label: "Scheduled", className: "is-upcoming" };
  const now = new Date();
  const currentTime = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
  if (item.time > currentTime) return { label: "Scheduled", className: "is-upcoming" };
  if (!item.endTime || item.endTime > currentTime) return { label: "In progress", className: "is-live" };
  return { label: "Awaiting documentation", className: "is-past-due" };
}

function groupProgrammeSessionDateLabel(date) {
  if (date === dateOffset(0)) return "Today";
  const [year, month, day] = date.split("-").map(Number);
  return new Intl.DateTimeFormat(undefined, { weekday: "short", day: "numeric", month: "short" })
    .format(new Date(year, month - 1, day, 12));
}

function groupProgrammeItemTab(date) {
  if (date < dateOffset(0)) return "past";
  return date > dateOffset(0) ? "week" : "today";
}

function groupProgrammeWorkspaceItems(scheduled) {
  const savedItems = groupProgrammeStore.sessions.map(session => ({
    key: `session:${session.id}`,
    kind: "saved",
    session,
    date: session.sessionDate,
    time: session.startTime,
    endTime: session.endTime,
    category: session.category,
    topic: session.topic,
    facilitator: session.facilitator,
    location: session.location,
    tab: groupProgrammeItemTab(session.sessionDate),
    label: "Confirmed"
  }));
  const scheduledItems = scheduled.map((appointment, index) => ({
    key: `appointment:${index}`,
    kind: "scheduled",
    appointment,
    appointmentIndex: index,
    date: appointment.date || dateOffset(0),
    time: appointment.time || "",
    endTime: appointment.endTime || "",
    category: appointment.category || appointment.type || "Group session",
    topic: appointment.topic || appointment.type || "Group psychotherapy session",
    facilitator: appointment.provider || "Facilitator not assigned",
    location: appointment.location || "Location not assigned",
    tab: groupProgrammeItemTab(appointment.date || dateOffset(0)),
    label: "Scheduled"
  }));
  const draftItems = groupProgrammeDraftSession ? [{
    ...groupProgrammeDraftSession,
    kind: "draft",
    date: dateOffset(0),
    time: "",
    endTime: "",
    category: groupProgrammeDraftSession.category || "Group psychotherapy",
    topic: "New group session",
    facilitator: "Facilitator not assigned",
    location: "Location not assigned",
    tab: "today",
    label: "Draft"
  }] : [];
  return [...savedItems, ...scheduledItems, ...draftItems].sort((a, b) =>
    `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`)
  );
}

function groupProgrammeWorkspaceHTML(scheduled, clients, programmes, units) {
  const items = groupProgrammeWorkspaceItems(scheduled);
  if (!groupProgrammeWorkspaceInitialized && !items.some(item => item.tab === groupProgrammeSessionTab)) {
    groupProgrammeSessionTab = ["today", "week", "past"].find(tab => items.some(item => item.tab === tab)) || "today";
  }
  groupProgrammeWorkspaceInitialized = true;
  const visibleItems = items.filter(item => item.tab === groupProgrammeSessionTab);
  const selectedItem = visibleItems.find(item => item.key === groupProgrammeSelectedSessionId) ||
    visibleItems[0] || null;
  if (selectedItem) groupProgrammeSelectedSessionId = selectedItem.key;
  const matchingClients = clients.filter(client =>
    (!groupProgrammeWorkspaceFilters.programme || groupProgrammeForClient(client) === groupProgrammeWorkspaceFilters.programme) &&
    (!groupProgrammeWorkspaceFilters.unit || groupUnitForClient(client) === groupProgrammeWorkspaceFilters.unit) &&
    (groupProgrammeWorkspaceFilters.eligibility === "all" || client.sessionEligible !== false)
  );
  const selectableClients = matchingClients.filter(client => client.sessionEligible !== false);
  const sessionList = visibleItems.map(item => {
    const status = groupProgrammeSessionStatus(item);
    return `<button class="group-session-item" type="button" data-group-session-key="${escapeHTML(item.key)}" aria-current="${item.key === selectedItem?.key}">
    <span class="group-session-item-top"><span>${escapeHTML(groupProgrammeSessionDateLabel(item.date))} · ${escapeHTML(item.time || "Time not set")}</span><span class="group-session-chip ${status.className}">${escapeHTML(status.label)}</span></span>
    <span class="group-session-item-title">${escapeHTML(item.topic)}</span>
    <span class="group-session-item-meta">${escapeHTML(item.category)} · ${escapeHTML(item.facilitator)}</span>

  let attendeeCards = "";

      <p class="group-note" style="padding:10px 12px">Aggregate counts only. Individual observations and risk disclosures are excluded.</p>
    </section>
    <section class="card" style="margin-top:14px"><div class="card-header">Clinical continuity</div>
      <div class="group-table-wrap"><table aria-label="Group psychotherapy clinical continuity">
        <thead><tr><th>Continuity metric</th><th>Current</th></tr></thead>
        <tbody><tr><td>Sessions with linked intervention records</td><td>${groupProgrammeStore.sessions.filter(item => item.clientEntries.some(entry => groupPsychotherapyInterventionRecordsForClient(entry.clientId).some(record => record.linkedSessionId === item.id))).length}</td></tr><tr><td>Risk disclosures flagged for individual review</td><td>${groupProgrammeStore.sessions.reduce((count, item) => count + item.clientEntries.filter(entry => entry.riskDisclosure).length, 0)}</td></tr></tbody>
      </table></div>
    </section>
  </div>`;
  return `<section class="group-workspace" aria-label="Group psychotherapy session workspace">
    <aside class="group-workspace-rail">
      <div class="group-workspace-rail-head"><h1>Group programme</h1><p>From the weekly programme calendar</p></div>
      <button class="btn group-workspace-new" type="button" data-group-new-session>New group session</button>
      <div class="group-session-tabs" role="tablist" aria-label="Filter sessions">
        ${[["today","Today"],["week","This week"],["past","Past"]].map(([tab,label]) => `<button type="button" role="tab" data-group-session-tab="${tab}" aria-selected="${groupProgrammeSessionTab === tab}">${label}</button>`).join("")}
      </div>
      <div class="group-session-list">${sessionList || '<p class="group-empty">No sessions in this view. Create a group session or check another tab.</p>'}</div>
    </aside>
    <section class="group-workspace-main" aria-live="polite">
      ${groupProgrammeView === "utilisation" ? utilisationHTML : selectedItem ? `<div class="group-workspace-content">
        <div class="group-workspace-heading"><div><h2>${escapeHTML(selectedItem.topic)}</h2><p class="group-workspace-sub">${escapeHTML(selectedItem.category)} · ${escapeHTML(session?.id || (selectedItem.kind === "draft" ? "Draft session" : "Scheduled session"))}</p></div>
          <div class="group-workspace-actions"><span class="group-session-chip ${groupProgrammeSessionStatus(selectedItem).className}">${escapeHTML(groupProgrammeSessionStatus(selectedItem).label)}</span>${selectedItem.kind === "saved" ? `<button class="btn ghost sm" type="button" data-amend-session-details="${escapeHTML(session.id)}">Edit details</button><button class="btn ghost sm" type="button" data-amend-session="${escapeHTML(session.id)}">Correct client entry</button>` : selectedItem.kind === "scheduled" ? `<button class="btn ghost sm" type="button" data-group-edit-selected>Edit details</button>` : ""}</div>
        </div>
        <div class="group-session-facts">
          ${[["Date", selectedItem.kind === "draft" ? "Not scheduled" : groupProgrammeSessionDateLabel(selectedItem.date)],["Time", selectedItem.kind === "draft" ? "Not set" : `${selectedItem.time || "—"}${selectedItem.endTime ? `–${selectedItem.endTime}` : ""}`],["Facilitator", selectedItem.kind === "draft" ? "Not assigned" : selectedItem.facilitator],["Location", selectedItem.kind === "draft" ? "Not assigned" : selectedItem.location],["Documented by", session?.author || document.querySelector(".nav-user-name")?.textContent.trim() || "Not yet documented"]].map(([label,value]) => `<div class="group-session-fact"><small>${escapeHTML(label)}</small><strong>${escapeHTML(value || "Not recorded")}</strong></div>`).join("")}
        </div>
        <div class="group-attendance-tally">
          <div class="group-attendance-tally-head"><strong>${presentCount} of ${selectedItem.kind === "saved" ? session.clientEntries.length : selectableClients.length} present</strong><span class="group-attendance-legend"><span style="--legend-color:var(--routine)">Present</span><span style="--legend-color:var(--emergency)">Absent</span><span style="--legend-color:var(--triage-yellow)">Excused</span><span style="--legend-color:var(--muted)">Declined</span></span></div>
          <div class="group-attendance-bar" aria-label="Attendance summary">
            ${["Present","Absent","Excused","Declined"].map(status => {
              const count = selectedItem.kind === "saved"
                ? session.clientEntries.filter(entry => entry.attendance === status).length
                : Object.values(groupProgrammeDraftAttendance[selectedItem.key] || {}).filter(entry => entry.attendance === status).length;
              const denominator = selectedItem.kind === "saved" ? session.clientEntries.length : selectableClients.length;
              const colors = { Present:"var(--routine)", Absent:"var(--emergency)", Excused:"var(--triage-yellow)", Declined:"var(--muted)" };
              return `<span style="width:${denominator ? count / denominator * 100 : 0}%;background:${colors[status]}"></span>`;
            }).join("")}
          </div>
        </div>
        <div class="group-workspace-tools">
          ${editable ? `<input class="group-workspace-search" type="search" data-group-client-search value="${escapeHTML(groupProgrammeClientSearch)}" placeholder="Search client name or ID" aria-label="Search clients">
          <select data-group-workspace-filter="programme" aria-label="Programme"><option value="">All programmes</option>${programmes.map(programme => `<option value="${escapeHTML(programme)}" ${groupProgrammeWorkspaceFilters.programme === programme ? "selected" : ""}>${escapeHTML(programme)}</option>`).join("")}</select>
          <select data-group-workspace-filter="unit" aria-label="Residential unit"><option value="">All units</option>${units.map(unit => `<option value="${escapeHTML(unit)}" ${groupProgrammeWorkspaceFilters.unit === unit ? "selected" : ""}>${escapeHTML(unit)}</option>`).join("")}</select>
          <select data-group-workspace-filter="eligibility" aria-label="Session eligibility"><option value="eligible" ${groupProgrammeWorkspaceFilters.eligibility === "eligible" ? "selected" : ""}>Eligible clients only</option><option value="all" ${groupProgrammeWorkspaceFilters.eligibility === "all" ? "selected" : ""}>All active clients</option></select>` : `<span class="group-workspace-sub">${markedCount} attendance records · ${riskCount} risk flag${riskCount === 1 ? "" : "s"}</span>`}
        </div>
        ${editable ? `<p class="group-workspace-sub group-active-cohort">${matchingClients.length} active admission${matchingClients.length === 1 ? "" : "s"} · ${selectableClients.length} eligible for this session</p>` : ""}
        <div class="group-client-cards">${attendeeCards || '<p class="group-empty">No clients match your search, or no client attendance has been recorded for this session.</p>'}</div>
        ${auditHTML}
      </div>
      <footer class="group-workspace-footer" ${editable && groupProgrammeView === "session" ? "" : "hidden"}><small>${`${Math.max(0, selectableClients.length - markedCount)} client${selectableClients.length - markedCount === 1 ? "" : "s"} still to mark${riskCount ? ` · ${riskCount} risk flag${riskCount === 1 ? "" : "s"}` : ""}`}</small>
        <button class="btn" type="button" data-group-workspace-review ${canReview ? "" : "disabled"}>Review session</button>
      </footer>` : `<div class="group-workspace-content"><div class="group-empty">No sessions here. Create a group session or choose another session period.</div></div>`}
    </section>
  </section>`;
}

            <div class="field"><label for="group-session-date">Session date</label><input id="group-session-date" name="sessionDate" type="date" value="${dateOffset(0)}" required></div>
            <div class="field"><label for="group-category">Session category</label><select id="group-category" name="category" required>${categoryOptions}</select></div>
            <div class="field" id="group-other-category-field" hidden><label for="group-other-category">Approved category name</label><input id="group-other-category" name="otherCategory" type="text"></div>
            <div class="field"><label for="group-start-time">Start time</label><input id="group-start-time" name="startTime" type="time" required></div>
            <div class="field"><label for="group-end-time">End time</label><input id="group-end-time" name="endTime" type="time" required></div>
            <div class="field"><label for="group-topic">Topic or activity</label><input id="group-topic" name="topic" type="text" maxlength="160" required></div>
            <div class="field"><label for="group-facilitator">Facilitator</label><input id="group-facilitator" name="facilitator" type="text" maxlength="120" required></div>
            <div class="field"><label for="group-author">Documenting staff member</label><input id="group-author" name="author" type="text" maxlength="120" placeholder="Enter documenting staff member" required></div>
            <div class="field"><label for="group-location">Session location</label><input id="group-location" name="location" type="text" maxlength="120" required></div>
            <div class="field" style="grid-column:1/-1"><label for="group-description">Brief session content or intervention</label><textarea id="group-description" name="description" rows="3" maxlength="2000" required></textarea><span class="group-note">Describe the shared intervention only; keep client-specific observations in that client’s row.</span></div>
          </div>
        </div>
      </section>
      <section class="card">
        <div class="card-header">Eligible clients (${clients.length})</div>
        <div class="card-body">
          <p class="group-note" style="margin-bottom:12px">Active admissions only. Select an attendance status for every listed client. Individual observations are optional; do not record details for another client here.</p>
          <div class="group-filter-grid" style="margin-bottom:14px">
            <div class="field"><label for="group-filter-programme">Programme</label><select id="group-filter-programme"><option value="">All programmes</option>${programmeOptions}</select></div>
            <div class="field"><label for="group-filter-unit">Residential unit / setting</label><select id="group-filter-unit"><option value="">All units / settings</option>${unitOptions}</select></div>
            <div class="field"><label for="group-filter-eligibility">Session eligibility</label><select id="group-filter-eligibility"><option value="eligible">Eligible clients only</option><option value="all">Show all active admissions</option></select></div>

            <table aria-label="Client attendance and individual observations">
              <thead><tr><th>Client identifier and name</th><th>Programme / unit</th><th>Attendance</th><th>Individual observation or response</th><th>Risk / follow-up</th></tr></thead>
              <tbody id="group-client-rows">
                ${clients.map(client => `<tr data-client-id="${escapeHTML(client.id)}" data-programme="${escapeHTML(groupProgrammeForClient(client))}" data-unit="${escapeHTML(groupUnitForClient(client))}" data-eligible="${client.sessionEligible !== false}">
                  <td><strong>${escapeHTML(client.id)}</strong><br>${escapeHTML(client.name)}${client.sessionEligible === false ? '<br><span class="tag risk">Eligibility review required</span>' : ""}</td>
                  <td>${escapeHTML(groupProgrammeForClient(client))}<br><span class="group-note">${escapeHTML(groupUnitForClient(client))}</span></td>
                  <td><select data-group-attendance ${client.sessionEligible === false ? "disabled" : "required"} aria-label="Attendance for ${escapeHTML(client.name)}"><option value="">Select status</option><option>Present</option><option>Absent</option><option>Excused</option><option>Declined</option></select></td>
                  <td><textarea class="group-observation" data-group-observation rows="2" maxlength="1000" aria-label="Optional individual observation for ${escapeHTML(client.name)}" placeholder="Optional; record only this client's response, insight, difficulty or follow-up" ${client.sessionEligible === false ? "disabled" : ""}></textarea></td>
                  <td><label><input type="checkbox" data-group-risk aria-label="Flag a risk disclosure for ${escapeHTML(client.name)}" ${client.sessionEligible === false ? "disabled" : ""}> Risk disclosure</label><br><label><input type="checkbox" data-group-follow-up aria-label="Require individual follow-up for ${escapeHTML(client.name)}" ${client.sessionEligible === false ? "disabled" : ""}> Individual follow-up task</label></td>
                </tr>`).join("")}
              </tbody>
            </table>
          </div>
          ${clients.length ? "" : '<p class="group-note">No active clients are available for a new group session.</p>'}
        </div>
      </section>
      <div class="group-actions">
        <button class="btn" type="submit" ${clients.length ? "" : "disabled"}>Review session</button>
        <span class="group-note">No record is saved until the reviewed session is confirmed.</span>
      </div>
      <div id="group-session-review"></div>
      <div class="group-status" id="group-session-status" role="status" aria-live="polite"></div>
    </form>
    </details>
    <details class="card">
      <summary class="card-header">Category configuration · administrator workflow</summary>
      <div class="card-body">
        <p class="group-note">Add an approved category for this prototype. Production changes must be restricted by the authenticated administrator role and centrally versioned.</p>
        <form id="group-category-form" class="group-inline" style="margin-top:10px">
          <label class="field" for="group-new-category"><span>New category</span><input id="group-new-category" type="text" maxlength="100" required></label>

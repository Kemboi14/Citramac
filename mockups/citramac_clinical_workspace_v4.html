<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CITRAMAC — Inpatient & Outpatient System</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23006e51'/%3E%3Cpath d='M9 3h6v6h6v6h-6v6H9v-6H3V9h6z' fill='white'/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --brand: #006e51;
  --accent: #00503a;
  --accent-soft: #e9f6f0;
  --accent-line: #b9dccf;
  --primary-soft: #e9f6f0;
  --ground: #f5f8f7;
  --line: #dce7e2;
  --line-2: #edf2ef;
  --ink: #13231f;
  --ink-2: #30453e;
  --muted: #202124;
  --faint: #383a3d;
  --focus: #006e51;
  --surface: #ffffff;
  --surface-2: #f0f5f3;
  --surface-3: #e4ede9;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.1), 0 2px 6px rgba(0,0,0,.06);
  --radius: 12px;
  --radius-sm: 8px;
  --emergency: #b42318;
  --emergency-bg: #fde8e6;
  --urgent: #b54708;
  --urgent-bg: #fff0e5;
  --priority: #006e51;
  --priority-bg: #e9f6f0;
  --triage-yellow: #8a6100;
  --triage-yellow-bg: #fff6cc;
  --routine: #18794e;
  --routine-bg: #e8f5ed;
  --nav: #00503a;
  --nav-ink: #d8eee5;
  --nav-hover: rgba(255,255,255,.09);
  --nav-active: #eafaf4;
  --hdr: #00503a;
  --hdr-ink: #ffffff;
  --hdr-2: rgba(255,255,255,.08);
  --hdr-line: rgba(255,255,255,.12);
  --hdr-muted: #b7dccb;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --brand: #36b795;
  --accent: #123d32;
  --accent-soft: #173a31;
  --accent-line: #285c4c;
  --primary-soft: #173a31;
  --ground: #111b19;
  --line: #30413c;
  --line-2: #263630;
  --ink: #e6efeb;
  --ink-2: #c5d4ce;
  --muted: #e0e3e1;
  --faint: #c2c8c5;
  --focus: #56c9a5;
  --surface: #192521;
  --surface-2: #202e29;
  --surface-3: #293a34;
  --shadow: 0 1px 3px rgba(0,0,0,.24), 0 1px 2px rgba(0,0,0,.2);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.24);
  --emergency: #f07169;
  --emergency-bg: #3c2422;
  --urgent: #f0a257;
  --urgent-bg: #3d3022;
  --priority: #d9bd64;
  --priority-bg: #39341f;
  --triage-yellow: #dfc267;
  --triage-yellow-bg: #39341f;
  --routine: #67c990;
  --routine-bg: #1b3829;
  --nav: #102d25;
  --nav-ink: #d8eee5;
  --nav-hover: rgba(255,255,255,.09);
  --nav-active: #24483b;
  --hdr: #102d25;
  --hdr-ink: #ffffff;
  --hdr-2: rgba(255,255,255,.08);
  --hdr-line: rgba(255,255,255,.12);
  --hdr-muted: #b7dccb;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Inter, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--ground);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5, h6 {
  font-family: Lexend, "Trebuchet MS", sans-serif;
}

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ── Layout ── */
.app-shell {
  display: flex;
  min-height: 100vh;
}

/* ── Sidebar ── */
.sidenav {
  width: 260px;
  background: linear-gradient(180deg, #00503a, #003f2e);
  color: var(--nav-ink);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  transition: width .2s;
}

.sidenav.rail { width: 68px; min-width: 68px; flex-basis: 68px; }
.sidenav.rail .nav-label,
.sidenav.rail .nav-section,
.sidenav.rail .nav-badge,
.sidenav.rail .nav-user-info { display: none; }
.sidenav.rail .nav-item { justify-content: center; padding: 10px 0; }
.sidenav.rail .nav-item .nav-icon { margin: 0; }
.sidenav.rail .nav-group-label,
.sidenav.rail .nav-chevron,
.sidenav.rail .nav-submenu { display: none; }
.sidenav.rail .nav-group-label,
.sidenav.rail .nav-chevron,
.sidenav.rail .nav-submenu { display: none; }

.nav-brand {
  padding: 16px 18px;
  border-bottom: 1px solid var(--hdr-line);
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-brand-icon {
  width: 36px; height: 36px;
  border-radius: 9px;
  background: var(--brand);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
}

.nav-brand-text {
  font-family: Lexend, sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  letter-spacing: .04em;
}

.nav-brand-sub {
  font-size: 10px;
  color: var(--hdr-muted);
  letter-spacing: .06em;
  text-transform: uppercase;
}

.nav-section {
  padding: 12px 18px 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: #8fc9b3;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 18px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--nav-ink);
  text-decoration: none;
  border-radius: 8px;
  margin: 1px 8px;
  transition: background .15s;
  cursor: pointer;
  border: none;
  background: transparent;
  width: calc(100% - 16px);
  text-align: left;
}

.nav-item:hover { background: var(--nav-hover); color: #fff; }
.nav-item.active { background: var(--nav-active); color: var(--nav); font-weight: 700; }

.nav-group-trigger { justify-content: flex-start; }
.nav-group-label { flex: 1; }
.nav-chevron {
  width: 14px;
  height: 14px;
  transition: transform .15s;
}
.nav-group-trigger[aria-expanded="true"] .nav-chevron { transform: rotate(180deg); }
.nav-group-trigger[aria-expanded="true"] .nav-chevron-right { transform: rotate(90deg); }
.nav-submenu { padding: 2px 0 4px; }
.nav-submenu[hidden] { display: none; }
.nav-submenu .nav-item {
  min-height: 34px;
  padding: 7px 12px 7px 38px;
  font-size: 12px;
}

.nav-group-trigger { justify-content: flex-start; }
.nav-group-label { flex: 1; }
.nav-chevron {
  width: 14px;
  height: 14px;
  transition: transform .15s;
}
.nav-group-trigger[aria-expanded="true"] .nav-chevron { transform: rotate(180deg); }
.nav-submenu { padding: 2px 0 4px; }
.nav-submenu[hidden] { display: none; }
.nav-submenu .nav-item {
  min-height: 34px;
  padding: 7px 12px 7px 38px;
  font-size: 12px;
}

.nav-icon {
  width: 18px; height: 18px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
}

.nav-icon svg { width: 16px; height: 16px; }

.nav-badge {
  margin-left: auto;
  background: var(--emergency);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 999px;
}

.nav-user {
  margin-top: auto;
  padding: 12px 18px;
  border-top: 1px solid var(--hdr-line);
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-user-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--brand);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 12px;
  flex-shrink: 0;
}

.nav-user-info { flex: 1; min-width: 0; }
.nav-user-name { font-size: 12px; font-weight: 600; color: #fff; }
.nav-user-role { font-size: 10px; color: var(--hdr-muted); }

/* ── Main ── */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* ── Topbar ── */
.topbar {
  height: 56px;
  background: var(--hdr);
  color: var(--hdr-ink);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  position: sticky;
  top: 0;
  z-index: 40;
  border-bottom: 1px solid var(--hdr-line);
}

.topbar-btn {
  width: 36px; height: 36px;
  border-radius: 8px;
  border: 1px solid var(--hdr-line);
  background: var(--hdr-2);
  color: var(--hdr-ink);
  display: grid;
  place-items: center;
  transition: background .15s;
}

.topbar-btn:hover { background: rgba(255,255,255,.15); }
.topbar-btn svg { width: 17px; height: 17px; }

.topbar-title {
  font-family: Lexend, sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-search {
  height: 36px;
  border-radius: 8px;
  border: 1px solid var(--hdr-line);
  background: var(--hdr-2);
  color: var(--hdr-ink);
  padding: 0 12px;
  font-size: 12.5px;
  width: 240px;
  outline: none;
}

.topbar-search::placeholder { color: var(--hdr-muted); }
.topbar-search:focus { border-color: #8fd9bd; background: rgba(255,255,255,.12); }

@media (max-width: 700px) {
  .topbar { gap: 8px; padding: 0 10px; }
  .topbar-search { width: min(180px, 30vw); }
}

@media (max-width: 480px) {
  .topbar-search { display: none; }
}

/* ── Content ── */
.content {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
}

.reference-workflow-frame {
  display: block;
  width: 100%;
  min-height: 760px;
  height: calc(100vh - 250px);
  border: 0;
  border-radius: 0;
  background: transparent;
}

@media (max-width: 700px) {
  .reference-workflow-frame {
    min-height: 680px;
    height: calc(100vh - 220px);
  }
}

/* ── Page Header ── */
.page-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.page-title {
  font-size: 20px;
  font-weight: 600;
  color: var(--ink);
}

.page-subtitle {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 2px;
}

/* ── Cards ── */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.card-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--line-2);
  font-weight: 700;
  font-size: 13px;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.card-body { padding: 18px; }

/* ── Grid ── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

@media (max-width: 1024px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 640px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

/* ── Psychiatric interventions ── */
.psychiatric-interventions { margin-top: 20px; }
.intervention-eyebrow { color: var(--brand); font-size: 11px; font-weight: 700; letter-spacing: .35px; }
.intervention-lede { max-width: 640px; margin: 4px 0 18px; color: var(--ink-2); font-size: 12.5px; }
.intervention-section-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin: 20px 0 8px; }
.intervention-section-head b { color: var(--ink-2); font-size: 11px; letter-spacing: .4px; text-transform: uppercase; }
.intervention-section-head .intervention-hint { margin-left: 8px; color: var(--muted); font-size: 12px; }
.intervention-actions-table { overflow-x: auto; }
.intervention-actions-table .data-table { min-width: 600px; }
.intervention-actions-table .data-table th { color: var(--ink-2); }
.intervention-actions-table td { vertical-align: middle; }
.intervention-action-meta { margin-top: 2px; color: var(--ink-2); font-size: 11px; }
.intervention-scope { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); }
.intervention-scope button { border: 0; border-radius: 7px; background: transparent; color: var(--muted); padding: 5px 9px; font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; }
.intervention-scope button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.intervention-list { padding: 0; }
.intervention-list .grp { padding: 9px 16px 5px; font-size: 10px; }
.intervention-module { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line-2); background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
.intervention-module:last-child { border-bottom: 0; }
.intervention-module:hover { background: var(--surface-2); }
.intervention-module-icon { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 9px; background: var(--surface-3); color: var(--brand); font-weight: 700; }
.intervention-module-copy { min-width: 0; flex: 1; }
.intervention-module-title { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-weight: 700; }
.intervention-module-meta { margin-top: 2px; color: var(--muted); font-size: 12px; }
.intervention-recommended { color: var(--brand); background: var(--priority-bg); border-radius: 20px; padding: 2px 7px; font-size: 10px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; }
.intervention-delivered { color: var(--brand); background: var(--priority-bg); border: 0; border-radius: 20px; padding: 4px 9px; font-size: 10px; font-weight: 600; white-space: nowrap; }
.intervention-empty { color: var(--muted); padding: 16px; font-size: 12px; }
.intervention-record-overlay { position: fixed; inset: 0; z-index: 400; display: flex; justify-content: center; overflow: auto; background: var(--ground); }
.intervention-record-overlay[hidden] { display: none; }
.intervention-drawer { display: flex; flex-direction: column; width: 100%; min-height: 100%; background: var(--surface); }
.intervention-drawer-head { display: flex; align-items: center; gap: 12px; padding: 18px clamp(18px, 4vw, 48px); border-bottom: 1px solid var(--line); }
.intervention-drawer-head h2 { font-size: 18px; }
.intervention-drawer-head p { margin-top: 3px; color: var(--muted); font-size: 12px; }
.intervention-context .ctx { margin: 0 0 6px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.intervention-context .ctx summary { display: flex; align-items: center; gap: 8px; min-height: 38px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .35px; text-transform: uppercase; cursor: pointer; }
.intervention-context .ctx summary span { color: var(--faint); font-size: 11px; font-weight: 400; letter-spacing: 0; text-transform: none; }
.intervention-context .cr { display: grid; grid-template-columns: 82px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line-2); font-size: 12px; }
.intervention-context .cr .k { color: var(--muted); font-weight: 600; }
.intervention-drawer-head .intervention-module-icon { width: 42px; height: 42px; }
.intervention-drawer-head .intervention-module-copy { padding-top: 1px; }
.intervention-drawer-head .intervention-module-title h2 { font-size: 15px; }
.intervention-drawer-head .intervention-module-title { gap: 8px; }
.intervention-drawer-head .intervention-module-meta { margin-top: 3px; }
.intervention-drawer-close { margin-left: auto; min-width: 36px; min-height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 24px; cursor: pointer; }
.intervention-drawer-close:hover { background: var(--surface-2); }
.intervention-drawer-tabs { display: flex; gap: 2px; padding: 0 clamp(18px, 4vw, 48px); border-bottom: 1px solid var(--line); }
.intervention-drawer-tabs button { min-height: 40px; padding: 9px 12px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.intervention-drawer-tabs button[aria-selected="true"] { border-bottom-color: var(--brand); color: var(--brand); }
.intervention-drawer-secondary { flex: 1; overflow: auto; padding: 24px clamp(18px, 4vw, 48px); }
.intervention-drawer-secondary[hidden] { display: none; }
.intervention-drawer-secondary .card { margin-bottom: 12px; }
.intervention-drawer-secondary .card-body { font-size: 13px; }
.intervention-form { width: min(100%, 1120px); flex: 1; align-self: center; overflow-y: auto; padding: 24px clamp(18px, 4vw, 48px) 32px; }
.intervention-context { margin-bottom: 14px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 12px; }
.intervention-context p + p { margin-top: 4px; }
.intervention-form .field { margin-top: 12px; }
.intervention-form .field textarea { resize: vertical; }
.intervention-form details.more { margin: 14px 0 4px; padding: 8px 12px; border: 1px dashed var(--line); border-radius: 8px; }
.intervention-form details.more summary { display: flex; align-items: center; min-height: 28px; color: var(--brand); font-size: 12px; font-weight: 600; cursor: pointer; }
.intervention-form details.more .g { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.intervention-form .chk { display: flex; align-items: center; gap: 8px; margin-top: 28px; color: var(--muted); font-size: 12px; }
.intervention-form .chk input { width: auto; min-height: 0; }
.intervention-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.intervention-chips button { min-height: 30px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); color: var(--ink); font: inherit; font-size: 11px; cursor: pointer; }
.intervention-chips button[aria-pressed="true"] { border-color: var(--brand); background: var(--priority-bg); color: var(--brand); font-weight: 600; }
.intervention-option-select { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
.intervention-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.intervention-form-actions { position: sticky; bottom: -32px; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 16px calc(-1 * clamp(18px, 4vw, 48px)) -32px; padding: 12px clamp(18px, 4vw, 48px); border-top: 1px solid var(--line); background: var(--surface); }
.intervention-live { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
.intervention-live:empty { display: none; }
.intervention-live.error { color: var(--emergency); }
@media (max-width: 520px) { .intervention-form-grid { grid-template-columns: 1fr; gap: 0; } }

/* ── Stat Cards ── */
.stat-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
}

.stat-value {
  font-size: 28px;
  font-weight: 800;
  color: var(--ink);
  font-family: Lexend, sans-serif;
}

.stat-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .4px;
  margin-top: 2px;
}

.stat-change {
  font-size: 11.5px;
  margin-top: 6px;
  font-weight: 500;
}

.dashboard-quick-access { margin-bottom: 24px; }
.dashboard-quick-heading { margin-bottom: 11px; }
.dashboard-quick-heading h2 { margin: 0; font-size: 15px; font-weight: 700; color: var(--ink); }
.dashboard-quick-heading p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
.dashboard-quick-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 10px;
}
.dashboard-quick-link {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: border-color .15s, background .15s, box-shadow .15s, transform .15s;
}
.dashboard-quick-link:hover {
  border-color: color-mix(in srgb, var(--brand) 38%, var(--line));
  background: var(--surface-2);
  box-shadow: var(--shadow);
  transform: translateY(-1px);
}
.dashboard-quick-link:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.dashboard-quick-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  border-radius: 11px;
  background: var(--primary-soft);
  color: var(--brand);
}
.dashboard-quick-icon svg { width: 19px; height: 19px; }

  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  background: var(--surface);
  color: var(--ink);
  font: inherit;
}
.recheck-fields .field label,
.recheck-observation > label { color: var(--ink); font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; }
.recheck-observations-heading { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin: 20px 0 10px; font-size: 13px; }
.recheck-observations-heading span { color: var(--muted); font-size: 12px; }
.recheck-observation-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.recheck-observation { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 10px; border: 1px solid var(--line-2); border-radius: 8px; }
.recheck-reading { display: flex; align-items: center; gap: 8px; }
.recheck-unit { flex: 0 0 auto; color: var(--muted); font-size: 11px; }
.recheck-bp-inputs { display: flex; align-items: center; gap: 6px; }
.recheck-bp-inputs input { width: 72px; }
.recheck-bp-inputs > span:not(.recheck-unit) { color: var(--muted); }
.recheck-observation select { font-size: 11px; }
.recheck-note-field { margin-top: 14px; }
.recheck-actionbar { margin-top: 0; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 6px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.tab {
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  padding: 9px 12px;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  cursor: pointer;
  transition: color .15s;
}

.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); border-bottom-color: var(--brand); }

/* ── Stepper ── */
.stepper {
  display: flex;
  gap: 0;
  overflow-x: auto;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 6px;
  margin-bottom: 16px;
  scrollbar-width: thin;
}

.step {
  flex: 1 0 auto;
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 9px 14px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 9px;
  white-space: nowrap;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}

.step:hover { background: var(--surface-3); }

.step[aria-current="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
}

.step .n {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  display: grid;
  place-items: center;
  font-family: ui-monospace, monospace;
  font-size: 11px;
  flex-shrink: 0;
  color: var(--muted);
}

.step[aria-current="true"] .n {
  border-color: var(--brand);
  color: var(--brand);
}

.step.done .n {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}

.step.locked { opacity: .5; cursor: not-allowed; }

/* ── Banner ── */
.banner-meta {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 8px 18px;
  padding: 0 18px 12px;
}

.banner-meta .bmeta .lbl {
  display: block;
  font-family: ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--faint);
  margin-bottom: 2px;
}

.banner-meta .bmeta .val {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink);
}

.banner {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  overflow: hidden;
}

.banner-top {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 16px 18px;
  flex-wrap: wrap;
}

.avatar {
  width: 44px; height: 44px;
  border-radius: 11px;
  background: var(--primary-soft);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 15px;
  flex-shrink: 0;
}

.pt-id {
  font-family: ui-monospace, monospace;
  font-size: 11px;
  color: var(--muted);
}

.pt-name {
  font-weight: 700;
  font-size: 16px;
}

.pt-demo {
  color: var(--muted);
  font-size: 12px;
  margin-top: 1px;
}

.banner-flags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 0 18px 14px;
  align-items: center;
}

.banner-flags .lbl {
  font-family: ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--faint);
  margin-right: 2px;
}

.banner.client-safety-banner {
  position: sticky;
  top: 0;
  z-index: 30;
  color: var(--ink);
  background: linear-gradient(180deg, #ffffff, #fafbfd);
  border: 0;
  border-bottom: 1px solid #e2e8f0;
  margin-bottom: 16px;
  border-radius: 0;
  box-shadow: 0 20px 40px -24px rgba(15,27,45,.28);
  container-type: inline-size;
  overflow: visible;
}
.banner.client-safety-banner::before {
  position: absolute;
  inset: 0;
  background: radial-gradient(700px 150px at 10% 0, rgba(25,165,171,.10), transparent 70%);
  content: "";
  pointer-events: none;
}
.client-banner-grid {
  position: relative;
  display: grid;
  grid-template-columns: minmax(250px, 1.1fr) minmax(300px, 1.8fr) minmax(200px, .9fr) minmax(210px, 1fr);
  align-items: stretch;
  max-width: 1360px;
  margin: 0 auto;
}
.client-banner-cell {
  min-width: 0;
  padding: 14px 20px;
}
.client-banner-cell + .client-banner-cell {
  border-left: 1px solid #e2e8f0;
}
.client-banner-identity {
  display: flex;
  align-items: center;
  gap: 14px;
}
.client-banner-avatar {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  border: 0;
  border-radius: 15px;
  background: linear-gradient(135deg, #7debe4, #19a5ab 60%, #0e6f73);
  color: #06303a;
  font-size: 16px;
  font-weight: 800;
  box-shadow: 0 8px 18px -6px rgba(25,165,171,.5), inset 0 0 0 1px rgba(255,255,255,.5);
}
.client-banner-avatar.temporary {
  color: #4a586b;
  background: linear-gradient(135deg, #e6eaf1, #d3dae5);
  box-shadow: inset 0 0 0 1px #c9d2df;
}
.client-banner-copy { min-width: 0; }
.client-banner-name {
  color: #0f1b2d;
  font-family: Lexend, Inter, sans-serif;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -.4px;
  line-height: 1.15;
  overflow-wrap: anywhere;
}
.client-banner-name .tag {
  display: inline-block;
  margin-left: 5px;
  padding: 1px 7px;
  border: 1px solid #f0ce8a;
  border-radius: 6px;
  background: #fff4de;
  color: #a15c00;
  font-size: 10px;
  vertical-align: 3px;
}
.client-banner-identifiers {
  display: flex;
  flex-wrap: wrap;
  gap: 3px 7px;
  margin-top: 4px;
  color: #0e6f73;
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.client-banner-identifiers span + span::before {
  content: "·";
  margin-right: 7px;
  color: #7a8799;
}
.client-banner-demographics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 9px;
}
.client-banner-demographics span {
  display: inline-flex;
  align-items: center;
  min-height: 25px;
  padding: 3px 10px;
  border: 1px solid #e0e6ef;
  border-radius: 999px;
  background: #f3f5f9;
  color: #3d4b5f;
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1.3;
}
.client-banner-label {
  margin-bottom: 7px;
  color: #7a8799;
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1.3;
}
.client-banner-allergy {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-self: center;
  justify-self: stretch;
  width: 100%;
  max-width: 100%;
  min-height: 0;
  padding: 12px 15px;
  border: 1px solid #dce2ea;
  border-radius: 14px;
  background: #f4f6fa;
  gap: 8px;
}
.client-banner-allergy[data-state="known"] {
  border-color: #e5372b;
  background: #fff3f1;
  box-shadow: none;
}
.client-banner-allergy[data-state="none"] {
  border-color: #8fd3b0;
  background: linear-gradient(135deg, #edf9f2, #e1f4ea);
}
.client-banner-allergy[data-state="unknown"] {
  border-color: #d98e00;
  background: repeating-linear-gradient(135deg, #fff4de 0 10px, #ffebc2 10px 20px);
}
.client-banner-allergy-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 0;
  color: #c8281e;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .3px;
}
.client-banner-allergy[data-state="known"] .client-banner-allergy-title { color: #c8281e; }
.client-banner-allergy[data-state="none"] .client-banner-allergy-title { color: #127a4b; }
.client-banner-allergy[data-state="unknown"] .client-banner-allergy-title { color: #8a5200; font-size: 11.5px; letter-spacing: .1px; }
.client-banner-allergy-title svg,
.client-banner-alerts svg { width: 15px; height: 15px; flex: none; }
.client-banner-allergy-items,
.client-banner-alert-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.client-banner-allergy-note {
  color: #526174;
  font-size: 12px;
  font-weight: 600;
}
.client-banner-allergy[data-state="none"] .client-banner-allergy-note { color: #3b7555; }
.client-banner-allergy[data-state="unknown"] .client-banner-allergy-note { color: #80500a; }
.client-banner-allergy-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  max-width: 100%;
  padding: 3px 9px;
  border: 1px solid #f2b8b3;
  border-radius: 8px;
  background: #fff;
  color: #0f1b2d;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.client-banner-allergy[data-state="known"] .client-banner-allergy-item strong { color: #c8281e; }
.client-banner-allergy[data-state="none"] .client-banner-allergy-item { border-color: #b8e2c9; }
.client-banner-allergy[data-state="unknown"] .client-banner-allergy-item { border-color: #e7bc69; }
.client-banner-priority {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  width: fit-content;
  max-width: 100%;
  padding: 5px 12px 5px 7px;
  border: 1px solid transparent;
  border-radius: 11px;
  font-size: 13px;
  font-weight: 800;
  line-height: 1.35;
  color: #fff;
  box-shadow: 0 8px 20px -8px currentColor, inset 0 0 0 1px rgba(255,255,255,.25);
}
.client-banner-priority::before {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,.9);
  content: "";
  flex: none;
  box-shadow: 0 0 0 4px rgba(255,255,255,.16);
}
.client-banner-priority.pri-RED { background: #c8281e; }
.client-banner-priority.pri-ORANGE { background: #d9570f; }
.client-banner-priority.pri-YELLOW { background: #a15c00; }
.client-banner-priority.pri-GREEN { background: #127a4b; }
.client-banner-setting-cell .tag {
  display: inline-flex;
  padding: 5px 10px;
  border-radius: 9px;
  background: #f3f5f9;
  color: #4a586b;
  font-size: 12px;
  font-weight: 650;
}
.client-banner-setting {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  color: #0f1b2d;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.client-banner-setting .setting-dot {
  width: 8px;
  height: 8px;
  flex: none;
  margin-top: 5px;
  border-radius: 50%;
  background: #1fa866;
  box-shadow: 0 0 0 4px #d2f0e0;
}
.client-banner-setting.outpatient .setting-dot { background: #0e6f73; box-shadow: 0 0 0 4px #d9eeee; }
.client-banner-stack > div + div { margin-top: 14px; }
.client-banner-alerts { min-width: 0; }
.client-banner-alert {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  padding: 4px 10px;
  border: 1px solid #f5c9aa;
  border-radius: 9px;
  background: #fff1e8;
  color: #9a3b07;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.client-banner-no-alerts {
  color: #7a8799;
  font-size: 12px;
  font-weight: 600;
}
.client-banner-team {
  color: #0f1b2d;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
@container (max-width: 950px) {
  .client-banner-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .client-banner-cell:nth-child(2n) { border-right: 0; }
  .client-banner-cell:nth-child(n+3) { border-top: 1px solid #e2e8f0; }
  .client-banner-cell:nth-child(3) { border-left: 0; }
  .client-banner-allergy-cell { border-right: 0; }
}
@container (max-width: 570px) {
  .client-banner-grid { grid-template-columns: minmax(0, 1fr); }
  .client-banner-cell { padding: 14px 15px; }
  .client-banner-cell + .client-banner-cell,
  .client-banner-cell:nth-child(3) { border-left: 0; border-top: 1px solid var(--line-2); }
  .client-banner-cell:nth-child(2n) { border-right: 0; }
  .client-banner-allergy-cell { grid-column: auto; }
  .client-banner-name { font-size: 16px; }
  .client-banner-allergy { min-height: 0; }
}
:root[data-theme="dark"] .banner.client-safety-banner {
  color: var(--ink);
  background: linear-gradient(180deg, var(--surface), var(--ground));
  border-bottom-color: var(--line);
}
:root[data-theme="dark"] .banner.client-safety-banner::before {
  background: radial-gradient(700px 150px at 10% 0, color-mix(in srgb, var(--brand) 15%, transparent), transparent 70%);
}
:root[data-theme="dark"] .client-banner-cell + .client-banner-cell,
:root[data-theme="dark"] .client-banner-cell:nth-child(n+3) { border-color: var(--line-2); }
:root[data-theme="dark"] .client-banner-name,
:root[data-theme="dark"] .client-banner-setting,
:root[data-theme="dark"] .client-banner-team { color: var(--ink); }
:root[data-theme="dark"] .client-banner-identifiers { color: var(--brand); }
:root[data-theme="dark"] .client-banner-label,
:root[data-theme="dark"] .client-banner-no-alerts { color: var(--muted); }
:root[data-theme="dark"] .client-banner-demographics span,
:root[data-theme="dark"] .client-banner-setting-cell .tag { border-color: var(--line); background: var(--surface-2); color: var(--ink-2); }
:root[data-theme="dark"] .client-banner-allergy { border-color: var(--line); background: var(--surface-2); }
:root[data-theme="dark"] .client-banner-allergy[data-state="known"] { border-color: var(--emergency); background: var(--emergency-bg); }
:root[data-theme="dark"] .client-banner-allergy[data-state="none"] { border-color: var(--routine); background: var(--routine-bg); }
:root[data-theme="dark"] .client-banner-allergy[data-state="unknown"] { border-color: var(--urgent); background: var(--urgent-bg); }
:root[data-theme="dark"] .client-banner-allergy[data-state="known"] .client-banner-allergy-title,
:root[data-theme="dark"] .client-banner-allergy[data-state="known"] .client-banner-allergy-item strong { color: var(--emergency); }
:root[data-theme="dark"] .client-banner-allergy[data-state="none"] .client-banner-allergy-title,
:root[data-theme="dark"] .client-banner-allergy[data-state="none"] .client-banner-allergy-note { color: var(--routine); }
:root[data-theme="dark"] .client-banner-allergy[data-state="unknown"] .client-banner-allergy-title,
:root[data-theme="dark"] .client-banner-allergy[data-state="unknown"] .client-banner-allergy-note { color: var(--urgent); }
:root[data-theme="dark"] .client-banner-allergy-note { color: var(--ink-2); }
:root[data-theme="dark"] .client-banner-allergy-item { border-color: var(--line); background: var(--surface); color: var(--ink); }
:root[data-theme="dark"] .client-banner-alert { border-color: var(--line); background: var(--urgent-bg); color: var(--urgent); }
:root[data-theme="dark"] .client-banner-avatar { color: var(--accent); background: linear-gradient(145deg, var(--primary-soft), var(--surface-2)); box-shadow: none; }

/* ── Callout ── */
.callout {
  display: flex;
  gap: 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  margin-top: 16px;
  font-size: 12.5px;
  color: var(--ink);
}

.callout svg {
  width: 16px; height: 16px;
  flex-shrink: 0;
  color: var(--brand);
  margin-top: 1px;
}

.callout b { color: var(--ink); }
.callout.alert-success {
  background: var(--priority-bg);
  border-color: color-mix(in srgb, var(--brand) 24%, var(--line));
  color: var(--accent);
}
#triage-sign-status[hidden] { display: none; }

/* ── Timeline ── */
.timeline {
  position: relative;
  padding-left: 24px;
}

.timeline::before {
  content: "";
  position: absolute;
  left: 8px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--line);
}

.timeline-item {
  position: relative;
  padding-bottom: 18px;
}

.timeline-item:last-child { padding-bottom: 0; }

.timeline-item::before {
  content: "";
  position: absolute;
  left: -20px;
  top: 4px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--brand);
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 2px var(--brand);
}

.timeline-time {
  font-size: 11px;
  color: var(--faint);
  font-weight: 600;
  font-family: ui-monospace, monospace;
}

.timeline-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
}

.timeline-desc {
  font-size: 12px;
  color: var(--muted);
}

/* ── Layout 2-col ── */
.layout2 {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 16px;
  align-items: start;
}

@media (max-width: 800px) {
  .layout2 { grid-template-columns: 1fr; }
}

/* ── Panel ── */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  position: sticky;
  top: 80px;
}

.panel-h {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line-2);
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--ink);
}

.panel-h svg {
  width: 15px; height: 15px;
  color: var(--brand);
}

.panel-note {
  font-size: 11.5px;
  color: var(--muted);
  padding: 10px 14px 4px;
}

/* ── Vitals ── */
.vitals {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

@media (max-width: 560px) {
  .vitals { grid-template-columns: repeat(2, 1fr); }
}

.vital {
  text-align: center;
}

.vital label {
  font-size: 10px;
  display: block;
}

.vital input {
  font-family: ui-monospace, monospace;
  text-align: center;
}

/* ── Ward Grid ── */
.ward-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

@media (max-width: 768px) {
  .ward-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 480px) {
  .ward-grid { grid-template-columns: repeat(2, 1fr); }
}

.bed-card {
  background: var(--surface);
  border-radius: var(--radius-sm);
  border: 2px solid var(--line);
  padding: 12px 8px;
  text-align: center;
  transition: border-color .15s;
}

.bed-card:hover { border-color: var(--brand); }
.bed-card.occupied { border-color: var(--brand); background: var(--primary-soft); }
.bed-card.reserved { border-color: var(--urgent); background: var(--urgent-bg); }
.bed-card.available { border-color: var(--line); }

.bed-num {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
}

.bed-status {
  font-size: 12px;
  font-weight: 600;
  margin-top: 4px;
}

.bed-patient {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

/* ── Med Items ── */
.med-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line-2);
}

.med-item:last-child { border-bottom: none; }

.med-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--primary-soft);
  color: var(--brand);
  display: grid;
  place-items: center;
  font-size: 16px;
  flex-shrink: 0;
}

.med-info { flex: 1; }
.med-name { font-size: 13px; font-weight: 600; }
.med-dose { font-size: 12px; color: var(--muted); }

/* ── Note Card ── */
.note-card {
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 8px;
}

.note-card:last-child { margin-bottom: 0; }

.note-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}

.note-author {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
}

.note-time {
  font-size: 11px;
  color: var(--faint);
  font-family: ui-monospace, monospace;
}

.note-text {
  font-size: 12.5px;
  color: var(--muted);
}

/* ── Checkbox ── */
.checkbox-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  font-size: 13px;
  cursor: pointer;
}

.checkbox-item input {
  appearance: none;
  width: 17px; height: 17px;
  border: 1.5px solid var(--faint);
  border-radius: 5px;
  flex-shrink: 0;
  position: relative;
  cursor: pointer;
  margin: 0;
}

.checkbox-item input:checked {
  background: var(--brand);
  border-color: var(--brand);
}

.checkbox-item input:checked::after {
  content: "";
  position: absolute;
  left: 5px;
  top: 2px;
  width: 4px;
  height: 8px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

/* ── Progress ── */
.progress-bar {
  height: 6px;
  background: var(--surface-3);
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 999px;
  transition: width .3s;
}

.progress-fill.green { background: var(--brand); }
.progress-fill.orange { background: var(--urgent); }
.progress-fill.red { background: var(--emergency); }

/* ── Alert ── */
.alert {
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
}

.alert:last-child { margin-bottom: 0; }

.alert-warning {
  background: var(--urgent-bg);
  border: 1px solid var(--urgent);
  color: #7a4a08;
}

.alert-danger {
  background: var(--emergency-bg);
  border: 1px solid var(--emergency);
  color: #7a1f16;
}

.alert-success {
  background: var(--priority-bg);
  border: 1px solid var(--brand);
  color: var(--accent);
}

/* ── Section Label ── */
.grouplabel {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .4px;
  text-transform: uppercase;
  color: var(--muted);
  margin: 18px 0 9px;
}

/* ── Hidden ── */
.hidden { display: none !important; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--faint); }

  .content { padding: 0; }
  .card, .banner, .panel { box-shadow: none; border: 1px solid #ccc; }

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[character]);
}

function restoreTier1Registrations() {
  try {
    const saved = localStorage.getItem(TIER1_STORAGE_KEY);
    const registrations = saved ? JSON.parse(saved) : [];
    if (!Array.isArray(registrations) || registrations.some(record =>
      !record || typeof record.id !== "string" || typeof record.citramacId !== "string" ||
      typeof record.name !== "string" || typeof record.identityStatus !== "string"
    )) {
      throw new Error("Saved registration data has an invalid format.");
    }
    registrations.forEach(record => {
      const index = CLIENTS.findIndex(client => client.id === record.id);
      if (index >= 0) CLIENTS[index] = { ...CLIENTS[index], ...record };
      else CLIENTS.push(record);
    });
  } catch (error) {
    registrationStorageIssue = "Saved registrations could not be loaded. Existing data was left unchanged.";
    console.error("Unable to restore saved Tier 1 registrations.", error);
  }

  try {
    const saved = localStorage.getItem(TRIAGE_ENCOUNTER_STORAGE_KEY);
    if (!saved) return;
    const encounters = JSON.parse(saved);
    if (!Array.isArray(encounters) || encounters.some(encounter =>
      !encounter || typeof encounter.encounterId !== "string" || typeof encounter.id !== "string"
    )) {
      throw new Error("Saved triage encounter data has an invalid format.");
    }
    let migratedLegacyEncounter = false;
    encounters.slice().reverse().forEach(encounter => {
      const existingIndex = TRIAGE_QUEUE.findIndex(existing => existing.encounterId === encounter.encounterId);
      if (existingIndex >= 0) {
        TRIAGE_QUEUE[existingIndex] = { ...TRIAGE_QUEUE[existingIndex], ...encounter };
        return;
      }
      if (encounter.isNewEncounter && encounter.status === "Waiting") {
        const registeredAt = CLIENTS.find(client => client.id === encounter.id)?.registeredAt;
        const arrivalAt = registeredAt && !Number.isNaN(Date.parse(registeredAt))
          ? new Date(registeredAt)
          : new Date();
        encounter.status = "Awaiting triage";
        encounter.arrivalAt ||= arrivalAt.toISOString();
        encounter.dueAt ||= new Date(arrivalAt.getTime() + 10 * 60 * 1000).toISOString();
        migratedLegacyEncounter = true;
      }
      TRIAGE_QUEUE.unshift(encounter);
    });
    TRIAGE_QUEUE.forEach(encounter => {
      if (!encounter.triageRecord || !encounter.priority) return;
      const client = CLIENTS.find(item => item.id === encounter.id);
      if (client) client.priority = encounter.priority;
    });
    if (migratedLegacyEncounter) saveTriageEncounters();
  } catch (error) {
    registrationStorageIssue = "Some saved triage encounters could not be loaded. Existing client records were left unchanged.";
    console.error("Unable to restore saved triage encounters.", error);
  }
}

function saveTriageEncounters() {
  try {
    localStorage.setItem(
      TRIAGE_ENCOUNTER_STORAGE_KEY,
      JSON.stringify(TRIAGE_QUEUE)
    );
  } catch (error) {
    console.error("Unable to save triage encounters.", error);
    registrationStorageIssue = "This new triage encounter is available for this session, but could not be saved in this browser.";
  }
}

function scheduleAppointment(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const formData = new FormData(form);
  const clientId = formData.get('clientId');
  const client = CLIENTS.find(item => item.id === clientId);
  if (!client) {
    form.elements.clientId.focus();
    return;
  }
  const startTime = formData.get('time');
  const endTime = formData.get('endTime');
  if (endTime && endTime <= startTime) {
    form.elements.endTime.setCustomValidity('End time must be after the start time.');
    form.elements.endTime.reportValidity();
    form.elements.endTime.setCustomValidity('');
    return;
  }

  APPOINTMENTS.push({
    clientId,
    date: formData.get('date'),
    time: startTime,
    endTime,
    location: formData.get('location'),
    type: formData.get('type'),
    provider: formData.get('provider'),
    status: 'Confirmed'
  });
  showPage('appointments');
}

function syncPatientWorkflowTheme() {
  const frame = document.getElementById('patient-workflow-frame');
  if (!frame?.contentWindow) return;
  const style = getComputedStyle(document.documentElement);
  const theme = Object.fromEntries([
    'ground', 'surface', 'surface-2', 'surface-3', 'ink', 'ink-2', 'muted', 'faint',
    'line', 'line-2', 'brand', 'accent', 'accent-soft', 'focus', 'emergency',
    'emergency-bg', 'urgent', 'urgent-bg', 'priority', 'priority-bg', 'routine',
    'routine-bg', 'shadow'
  ].map(name => [name, style.getPropertyValue(`--${name}`).trim()]));
  theme.mode = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
  frame.contentWindow.postMessage({ type: 'citramac:theme', theme }, '*');
}

function patientWorkflowHandoff(client, triage) {
  const priority = { RED: 'Emergency', ORANGE: 'Urgent', YELLOW: 'Priority', GREEN: 'Routine' }[triage.priority];
  if (!priority) return null;
  return {
    type: 'citramac:open-patient',
    route: patientWorkflowRoute(),
    patient: {
      id: client.id,
      name: client.name || '',
      citramacId: client.citramacId || client.id,
      preferredName: client.alias || '',
      pronouns: client.pronouns || '',
      dob: /^\d{4}-\d{2}-\d{2}$/.test(client.dob || '') ? client.dob : '',
      age: client.age,
      sex: client.sex || '',
      setting: client.type || '',
      phone: client.phone || '',
      nok: client.nok || '',
      referral: client.referral || '',
      payer: client.payer || '',
      identityStatus: client.identityStatus || 'identified',
      presenting: triage.presenting || client.presenting || '',
      allergies: client.allergies || '',
      allergyStatus: client.allergyStatus || '',
      priority,
      role: 'psych',
      recommendation: triage.triageRecord.recommendation || '',
      overrideReason: triage.triageRecord.overrideReason || '',
      signedAt: triage.triageRecord.signedAt || '',
      signedBy: triage.triageRecord.signedBy || '',
      findings: Array.isArray(triage.triageRecord.findings) ? triage.triageRecord.findings : [],
      structuredFields: Array.isArray(triage.triageRecord.structuredFields) ? triage.triageRecord.structuredFields : []
    }
  };
}

async function loadBundledPatientWorkflow() {
  const binary = atob(PATIENT_WORKFLOW_GZIP_BASE64);
  const compressedBytes = Uint8Array.from(binary, character => character.charCodeAt(0));
  const decompressedStream = new Blob([compressedBytes])
    .stream()
    .pipeThrough(new DecompressionStream('gzip'));
  return new TextDecoder().decode(await new Response(decompressedStream).arrayBuffer());
}

function initPatientWorkflowFrame() {
  const frame = document.getElementById('patient-workflow-frame');
  const client = currentClient;
  const triage = client && latestSignedTriage(client.id);
  if (!frame || !client || !triage) return;
  const handoff = patientWorkflowHandoff(client, triage);
  if (!handoff) {
    console.error(`Cannot hand off triage priority ${triage.priority} for client ${client.id}.`);
    return;
  }
  frame.addEventListener('load', () => {
    const status = document.getElementById('patient-workflow-status');
    if (status) {
      status.hidden = false;
      status.className = 'callout';
      status.textContent = 'Loading the v4 patient workflow…';
      window.setTimeout(() => {
        if (status.isConnected && !status.hidden && status.textContent.startsWith('Loading')) {
          status.className = 'callout';
          status.setAttribute('role', 'alert');
          status.textContent = 'The bundled patient workflow did not respond. Reload the application and try again.';
        }
      }, 10000);
    }
    syncPatientWorkflowTheme();
    frame.contentWindow?.postMessage(handoff, '*');
  }, { once: true });
  loadBundledPatientWorkflow().then(workflowHTML => {
    if (frame.isConnected) frame.srcdoc = workflowHTML;
  }).catch(error => {
    console.error('Unable to load the bundled patient workflow.', error);
    const status = document.getElementById('patient-workflow-status');
    if (status?.isConnected) {
      status.hidden = false;
      status.className = 'callout';
      status.setAttribute('role', 'alert');
      status.textContent = 'The bundled patient workflow could not be loaded in this browser. Try a current version of Chrome, Edge, or Firefox.';
    }
  });
}

function clientBannerAllergyState(c) {
  const detail = String(c.allergies || '').trim();
  const status = String(c.allergyStatus || '').toLowerCase();
  if (status.includes('reports none') || /^no known allergies$/i.test(status) || /^(none known|no known allergies|client reports none)$/i.test(detail)) {
    return { state: 'none', label: 'No known allergies', items: [] };
  }
  if (status === 'not asked / unknown' || status === 'unknown' || /^(not asked\s*\/\s*unknown|unknown|n\/?a)$/i.test(detail)) {
    return { state: 'unknown', label: 'Allergy status unknown', items: [] };
  }
  if (status.includes('reports an allergy') || status === 'known' || (detail && !/^(not asked\s*\/\s*unknown|unknown|n\/?a)$/i.test(detail))) {
    const items = detail && !/^client reports an allergy$/i.test(detail)
      ? detail.split(/[;,]/).map(item => item.trim()).filter(Boolean)
      : [];
    return { state: 'known', label: 'Known allergy', items };
  }
  return { state: 'unknown', label: 'Allergy status unknown', items: [] };
}

function renderClientBannerAllergy(c) {
  const allergy = clientBannerAllergyState(c);
  const icon = allergy.state === 'none'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4m0 4h.01M10.3 3.9 2.5 17.4A2 2 0 0 0 4.2 20h15.6a2 2 0 0 0 1.7-2.6L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>';
  const items = allergy.items.length
    ? allergy.items.map(item => `<span class="client-banner-allergy-item">${escapeHTML(item)}</span>`).join('')
    : `<span class="client-banner-allergy-note">${escapeHTML(allergy.state === 'none' ? 'Confirmed at triage' : allergy.state === 'known' ? 'Details not recorded' : 'Confirm at triage')}</span>`;
  const title = allergy.state === 'known' ? 'ALLERGIES' : allergy.state === 'unknown' ? 'ALLERGIES UNKNOWN' : allergy.label;
  return `
    <section class="client-banner-cell client-banner-allergy-cell" aria-label="Allergy information">
      <div class="client-banner-allergy" id="banner-allergy" data-state="${allergy.state}" aria-live="polite">
        <div class="client-banner-allergy-title">${icon}<span>${escapeHTML(title)}</span></div>
        <div class="client-banner-allergy-items">${items}</div>
      </div>
    </section>
  `;
}

function clientNav(active) {

    { key: 'charts', label: 'Charts' },

  ];

    { key: 'interventions', label: 'Interventions' },
    { key: 'outcomes', label: 'Outcomes' },

  return `

      ${views.map(view => `<button class="tab ${view.key === activeView ? 'active' : ''}" type="button" aria-current="${view.key === activeView ? 'page' : 'false'}" onclick="showPatientRecordView('${view.key}')">${view.label}</button>`).join('')}
    </nav>

function completeGroupProgrammeFollowUp(sessionId, clientId) {
  const session = groupProgrammeStore.sessions.find(item => item.id === sessionId);
  const existingEntry = session?.clientEntries.find(item => item.clientId === clientId);
  if (!session || !existingEntry || !existingEntry.followUpRequired) {
    console.error(`Cannot complete follow-up for client ${clientId}: the linked task was not found.`);
    return;
  }
  if (existingEntry.followUpStatus === "Completed") return;
  const completedAt = new Date().toISOString();
  const amendedEntry = {
    ...existingEntry,
    followUpStatus: "Completed",
    version: (Number(existingEntry.version) || 1) + 1,
    audit: [...(existingEntry.audit || []), {
      amendedAt: completedAt,
      amendedBy: session.author,
      reason: "Individual follow-up task marked completed",
      before: { followUpStatus: existingEntry.followUpStatus || "Open" },
      after: { followUpStatus: "Completed" }
    }]
  };
  const amendedSession = {
    ...session,
    clientEntries: session.clientEntries.map(entry => entry.clientId === clientId ? amendedEntry : entry)
  };
  const nextStore = {
    ...groupProgrammeStore,
    sessions: groupProgrammeStore.sessions.map(item => item.id === sessionId ? amendedSession : item)
  };
  if (saveGroupProgrammeStore(nextStore)) {
    showPage("patient-record", "psychiatric");
  } else {
    const status = document.getElementById("group-follow-up-save-status");
    if (status) status.textContent = groupProgrammeStorageIssue;
  }
}

function latestSignedTriage(clientId) {
  return TRIAGE_QUEUE
    .filter(encounter => encounter.id === clientId && encounter.triageRecord)
    .sort((a, b) => String(b.triageRecord.signedAt || '').localeCompare(String(a.triageRecord.signedAt || '')))[0];
}

function renderGroupProgrammeRecordEntries(clientId) {
  const entries = groupProgrammeStore.sessions
    .flatMap(session => (session.clientEntries || [])
      .filter(entry => entry.clientId === clientId)
      .map(entry => ({ session, entry })))
    .sort((a, b) => String(b.session.sessionDate).localeCompare(String(a.session.sessionDate)));
  if (!entries.length) return groupProgrammeStorageIssue
    ? `<div class="callout" role="alert">${escapeHTML(groupProgrammeStorageIssue)}</div>`
    : "";
  return `<section class="card" style="margin:16px 0;" aria-labelledby="group-record-title">
    <div class="card-header" id="group-record-title">Group psychotherapy clinical entries</div>
    <div class="card-body">
    ${groupProgrammeStorageIssue ? `<div class="callout" role="alert">${escapeHTML(groupProgrammeStorageIssue)}</div>` : ""}
    ${entries.map(({ session, entry }) => `<article class="group-history-item">
        <h3>${escapeHTML(session.category)} · ${escapeHTML(session.topic)}</h3>
        <div class="group-history-detail">${escapeHTML(session.sessionDate)} · ${escapeHTML(session.startTime)}–${escapeHTML(session.endTime)} · Facilitator: ${escapeHTML(session.facilitator)} · Documented by ${escapeHTML(session.author)}</div>
        <div class="group-history-row"><strong>Session intervention:</strong> ${escapeHTML(session.description || "Not recorded")}</div>
        <div class="group-history-row"><strong>Location:</strong> ${escapeHTML(session.location || "Not recorded")}</div>
        <div class="group-history-row"><strong>Attendance:</strong> ${escapeHTML(entry.attendance)}</div>
        ${entry.observation ? `<div class="group-history-row"><strong>Individual observation:</strong> ${escapeHTML(entry.observation)}</div>` : ""}
        ${entry.riskDisclosure ? `<div class="group-alert" role="status">Risk disclosure flagged for individual clinical review${entry.followUpRequired ? "; follow-up task required" : ""}. Details are restricted to this client record.</div>` : ""}
        ${entry.followUpRequired ? `<div class="group-history-row"><strong>Follow-up:</strong> ${escapeHTML(entry.followUpStatus || "Open")}${entry.followUpStatus !== "Completed" ? ` <button class="btn ghost sm" type="button" data-complete-group-follow-up="${escapeHTML(session.id)}" data-client-id="${escapeHTML(clientId)}">Mark completed</button>` : ""}</div>` : ""}
        <div class="group-history-detail">Linked session: ${escapeHTML(session.id)} · Version ${Number(entry.version) || 1}</div>
      </article>`).join("")}
      <div id="group-follow-up-save-status" class="group-status" role="status" aria-live="polite"></div>

  </section>`;
}

function filterClients(query) {
  const results = document.getElementById('client-search-results');
  const normalizedQuery = query.trim().toLowerCase();
  if (!results) return;
  if (!normalizedQuery) {
    results.hidden = true;
    results.innerHTML = '';
    return;
  }
  const matches = CLIENTS.filter(client =>
    [client.name, client.alias, client.identityDescription, client.phone,
      client.nationalId, client.documentNumber, client.citramacId, client.id]
      .filter(Boolean)
      .some(value => String(value).toLowerCase().includes(normalizedQuery))
  ).slice(0, 6);
  results.hidden = false;
  results.innerHTML = matches.length
    ? matches.map(client => `
      <button class="registration-search-result" type="button"
        data-client-action="select"
        data-client-id="${escapeHTML(client.id)}">
        <span>
          <strong>${escapeHTML(client.name)}</strong>
          <span class="registration-note">${escapeHTML([client.citramacId || client.id, client.phone || 'Phone not recorded', client.dob || 'DOB not recorded', client.identityLabel || ''].filter(Boolean).join(' · '))}</span>
        </span>
        <span class="tag">Load details</span>
      </button>
    `).join('')
    : '<p class="registration-note" style="padding: 10px;">No matching client found. Check the details or continue with a new registration.</p>';
  results.querySelectorAll('[data-client-action]').forEach(button => {
    button.addEventListener('click', () => {
      selectExistingClientForRegistration(button.dataset.clientId);
    });
  });
}

      const selectedClient = CLIENTS.find(client => client.id === form.dataset.selectedClientId);
      const nextStatus = button.dataset.identityMode;
      if ((selectedClient?.identityStatus || 'identified') === 'identified' && nextStatus !== 'identified') {
        clearRegistrationSelection();
      }
      updateIdentityFields(nextStatus);
    });
  });
}

function setRegistrationField(id, value) {
  const field = document.getElementById(id);
  if (!field) return;
  const normalizedValue = value == null ? '' : String(value);
  if (field instanceof HTMLSelectElement && !Array.from(field.options).some(option => option.value === normalizedValue || option.textContent === normalizedValue)) {
    field.value = '';
  } else {
    field.value = normalizedValue;
  }
}

function selectExistingClientForRegistration(clientId) {
  const client = CLIENTS.find(item => item.id === clientId);
  if (!client) {
    console.error(`Cannot load registration details: client ${clientId} was not found.`);
    return;
  }
  const form = document.getElementById('new-client-form');
  form.dataset.selectedClientId = client.id;
  delete form.dataset.updateClientId;
  const identityStatus = client.identityStatus || 'identified';
  updateIdentityFields(identityStatus);
  setRegistrationField('reg-full-name', identityStatus === 'identified' ? client.name : '');
  setRegistrationField('reg-description', client.identityDescription || client.alias || '');
  setRegistrationField('reg-preferred-name', client.preferredName || '');
  setRegistrationField('reg-pronouns', client.pronouns || '');
  setRegistrationField('reg-dob', client.dob === 'Not recorded' ? '' : client.dob);
  setRegistrationField('reg-age', client.age === 'Unknown' ? '' : client.age);
  setRegistrationField('reg-sex', client.sex);
  setRegistrationField('reg-phone', client.phone);
  setRegistrationField('reg-nok', client.nok);
  setRegistrationField('reg-address', client.address);
  setRegistrationField('reg-id-type', client.idType);
  setRegistrationField('reg-document-number', client.documentNumber);
  setRegistrationField('reg-referral', '');
  setRegistrationField('reg-language', client.language || 'English');
  setRegistrationField('reg-interpreter', client.interpreter === 'Not recorded' ? 'No' : client.interpreter);
  setRegistrationField('reg-allergy-status', client.allergyStatus);
  setRegistrationField('reg-allergy-details', client.allergies === 'Not asked / unknown' || client.allergies === 'Client reports none' ? '' : client.allergies);
  setRegistrationField('reg-payer', client.payer);
  setRegistrationField('reg-reason', '');
  document.getElementById('reg-allergy-details-field').hidden = client.allergyStatus !== 'Client reports an allergy';
  document.getElementById('selected-client-name').textContent = `${client.name} · ${client.citramacId || client.id}`;
  document.getElementById('selected-client-detail').textContent = 'Saved registration details loaded. Sending to triage creates a new encounter; it does not reopen an earlier one.';
  document.getElementById('selected-client-notice').hidden = false;
  document.getElementById('client-search-results').hidden = true;
  document.getElementById('client-search').value = '';
  document.getElementById('registration-submit').textContent = 'Register & send new encounter to triage';
  document.getElementById('reg-reason').focus();
}

function clearRegistrationSelection() {
  const form = document.getElementById('new-client-form');
  delete form.dataset.selectedClientId;
  delete form.dataset.updateClientId;
  form.reset();
  document.getElementById('selected-client-notice').hidden = true;
  document.getElementById('reg-language').value = 'English';
  updateIdentityFields('identified');
}

function updateIdentityFields(identityStatus) {
  const fullName = document.getElementById('reg-full-name');
  const description = document.getElementById('reg-description');
  const identityStatusField = document.getElementById('reg-identity-status');
  const requiredLabel = document.getElementById('reg-name-required');
  const isIdentified = identityStatus === 'identified';
  identityStatusField.value = identityStatus;
  fullName.required = isIdentified;
  description.required = identityStatus === 'unidentified';
  requiredLabel.textContent = isIdentified ? 'REQUIRED' : '';
  fullName.closest('.field').hidden = identityStatus !== 'identified';
  document.getElementById('reg-description-field').hidden = isIdentified;
  document.getElementById('reg-mode-hint').textContent = identityStatus === 'identified'
    ? 'Identified arrival. Search first to avoid creating a duplicate record.'
    : identityStatus === 'unidentified'
      ? 'The person is present but their name has not been confirmed. Add a brief description or alias so they can be safely identified later.'
      : 'Emergency — identity unknown. Capture only what is available; registration must never delay urgent care.';
  description.placeholder = identityStatus === 'unidentified'
    ? 'Required: brief description or reported temporary alias'
    : 'Optional observations to help identify the person later';
  document.querySelectorAll('[data-identity-mode]').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.identityMode === identityStatus));
  });
  document.getElementById('registration-submit').textContent = identityStatus === 'unknown'
    ? 'Create emergency record & send to triage'
    : identityStatus === 'unidentified'
      ? 'Register unidentified person & send to triage'
      : 'Register & send to triage';
  const allergyDetails = document.getElementById('reg-allergy-status').value === 'Client reports an allergy';
  document.getElementById('reg-allergy-details-field').hidden = !allergyDetails;
}

function beginIdentityResolution(clientId) {
  const client = CLIENTS.find(item => item.id === clientId && item.registrationMode);
  if (!client) {
    console.error(`Cannot resolve identity: temporary client ${clientId} was not found.`);
    return;
  }
  showPage('frontdesk');
  selectExistingClientForRegistration(client.id);
  updateIdentityFields('identified');
  setRegistrationField('reg-full-name', '');
  document.getElementById('reg-full-name').focus();
}

function beginClientTriage(clientId) {
  const client = CLIENTS.find(item => item.id === clientId);
  if (!client) {
    console.error(`Cannot start triage: client ${clientId} was not found.`);
    return;
  }
  currentClient = client;
  const lastEncounter = TRIAGE_QUEUE.find(entry => entry.id === client.id);
  if (!lastEncounter) return;
  currentTriageEncounterId = lastEncounter.encounterId;
  showPage('triage');
}

function registerTier1Client(event) {
  event.preventDefault();
  const form = event.currentTarget;
  if (!form.reportValidity()) return false;
  const values = Object.fromEntries(new FormData(form).entries());
  const identityStatus = values.identityStatus;
  const now = new Date();
  const selectedClientId = form.dataset.selectedClientId || form.dataset.updateClientId;
  const existingIndex = CLIENTS.findIndex(client => client.id === selectedClientId);
  const existing = existingIndex >= 0 ? CLIENTS[existingIndex] : null;
  const suffix = `${now.getTime()}-${CLIENTS.length + 1}`;
  const descriptor = String(values.description || '').trim();
  const fullName = String(values.fullName || '').trim();
  if (identityStatus === 'identified' && !fullName) {
    document.getElementById('registration-feedback').innerHTML =
      '<div class="callout" role="alert">Enter the client’s full name, or change Identity status to Unidentified or Unknown to register without one.</div>';
    document.getElementById('reg-full-name').focus();
    return false;
  }
  if (identityStatus === 'unidentified' && !descriptor) {
    document.getElementById('registration-feedback').innerHTML =
      '<div class="callout" role="alert">Add a brief description or reported temporary alias so this unidentified arrival can be distinguished safely.</div>';
    document.getElementById('reg-description').focus();
    return false;
  }
  const name = identityStatus === 'identified'
    ? fullName
    : existing && existing.identityStatus === identityStatus
      ? existing.name
      : `${identityStatus === 'unidentified' ? 'Unidentified person' : 'Unknown person'} (${suffix})`;
  const age = values.estimatedAge ? Number(values.estimatedAge) : existing?.age || 'Unknown';
  const allergyStatus = values.allergyStatus || 'Not asked / unknown';
  const allergies = allergyStatus === 'Client reports none'
    ? 'Client reports none'
    : allergyStatus === 'Client reports an allergy'
      ? String(values.allergyDetails || 'Client reports an allergy').trim()
      : existing?.allergies || 'Not asked / unknown';
  const referral = String(values.referral || '').trim() || 'Self-presented';
  const reason = String(values.reason || '').trim();
  const encounterId = `TRIAGE-${now.getTime().toString(36)}-${TRIAGE_QUEUE.length + 1}`;
  const record = {
    ...(existing || {}),
    id: existing ? existing.id : `MRN-ER-${suffix}`,
    citramacId: existing ? existing.citramacId : `CIT-ER-${suffix}`,
    name,
    alias: values.preferredName || descriptor || existing?.alias || '',
    identityLabel: identityStatus === 'identified'
      ? 'Identified'
      : identityStatus === 'unidentified'
        ? 'Unidentified — provisional record'
        : 'Unknown — minimum details only',
    identityStatus,
    identityDescription: descriptor || existing?.identityDescription || '',
    age,
    sex: values.sex || existing?.sex || 'Unknown',
    dob: values.dob || existing?.dob || 'Not recorded',
    phone: values.phone || existing?.phone || '',
    nok: values.nextOfKin || existing?.nok || '',
    address: values.address || existing?.address || '',
    idType: values.idType || existing?.idType || 'None / unknown',
    documentNumber: values.documentNumber || existing?.documentNumber || '',
    referral: existing?.referral || referral,
    language: values.language || existing?.language || '',
    interpreter: values.interpreter || existing?.interpreter || 'Not recorded',
    allergies,
    allergyStatus,
    pronouns: values.pronouns || existing?.pronouns || '',
    payer: values.payer || existing?.payer || 'Unknown',
    type: existing?.type || 'outpatient',
    status: existing?.status || 'Awaiting triage',
    diagnosis: existing?.diagnosis || 'Not assessed',
    lastVisit: existing?.lastVisit || '—',
    nextAppt: existing?.nextAppt || '—',
    priority: existing?.priority,
    flags: existing?.flags || [],
    alerts: existing?.alerts || [],
    team: existing?.team || 'Unassigned',
    arrival: existing?.arrival || now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    registrationMode: identityStatus === 'identified'
      ? (existing ? 'Tier 1 registration — identity confirmed' : 'Tier 1 registration')
      : 'Tier 1 emergency — temporary identity',
    registeredAt: existing ? existing.registeredAt : now.toISOString(),
    identityConfirmedAt: identityStatus === 'identified' && existing ? now.toISOString() : existing?.identityConfirmedAt
  };
  const queueEntry = {
    encounterId,
    id: record.id,
    name: record.name,
    age: record.age,
    sex: record.sex,
    arrival: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    wait: 0,
    referral,
    presenting: reason || 'Not yet recorded — ask client or informant',
    flags: [],
    status: 'Awaiting triage',
    arrivalAt: now.toISOString(),
    dueAt: new Date(now.getTime() + 10 * 60 * 1000).toISOString(),
    isNewEncounter: true
  };
  const encounterCount = TRIAGE_QUEUE.filter(encounter => encounter.id === record.id).length + 1;
  queueEntry.visitLabel = `Visit ${encounterCount}`;
  const savedRecords = CLIENTS.filter(client => client.registrationMode && client.id !== record.id).concat(record);

  try {
    localStorage.setItem(TIER1_STORAGE_KEY, JSON.stringify(savedRecords));
    registrationStorageIssue = '';
  } catch (error) {
    console.error('Unable to save the Tier 1 registration.', error);
    registrationStorageIssue = 'Browser storage is unavailable. This arrival is available for this session only; complete the approved record in the clinical system when available.';
  }

  if (existingIndex >= 0) CLIENTS[existingIndex] = record;
  else CLIENTS.push(record);
  TRIAGE_QUEUE.unshift(queueEntry);
  currentTriageEncounterId = null;
  currentClient = record;
  form.reset();
  delete form.dataset.selectedClientId;
  delete form.dataset.updateClientId;
  saveTriageEncounters();
  showPage('triage');
  return false;
}

// ═══════════ PAGE: TRIAGE ═══════════
function triage() {
  if (!currentTriageEncounterId) return triageWorklist();
  const activeEncounter = TRIAGE_QUEUE.find(encounter => encounter.encounterId === currentTriageEncounterId);
  if (!activeEncounter) {
    console.error(`The selected triage encounter ${currentTriageEncounterId} could not be found.`);
    currentTriageEncounterId = null;
    return triageWorklist();
  }
  const client = CLIENTS.find(item => item.id === activeEncounter.id)
    || (currentClient?.id === activeEncounter.id ? currentClient : {
      id: activeEncounter.id,
      name: activeEncounter.name || 'Unidentified',
      age: activeEncounter.age ?? 'Unknown',
      sex: activeEncounter.sex || 'Unknown',
      citramacId: activeEncounter.citramacId || activeEncounter.id,
      phone: activeEncounter.phone || '',
      nok: activeEncounter.nok || '',
      allergies: activeEncounter.allergies || 'Not asked / unknown',
      alerts: activeEncounter.alerts || [],
      identityStatus: activeEncounter.identityStatus || (activeEncounter.isDemoUnidentified ? 'unidentified' : 'identified'),
      identityLabel: activeEncounter.identityLabel || (activeEncounter.isDemoUnidentified ? 'Identity unknown' : ''),
      identityDescription: activeEncounter.identityDescription || '',
      type: activeEncounter.type || 'outpatient',
      status: activeEncounter.status || 'Awaiting triage',
    });
  const c = activeEncounter
    ? { ...client, status: activeEncounter.status, priority: activeEncounter.lastTriageAt || activeEncounter.triageRecord ? activeEncounter.priority : '', presenting: activeEncounter.presenting || 'Not yet recorded — ask client or informant', referral: activeEncounter.referral || client.referral }
    : client;
  const allergyState = clientBannerAllergyState(c).state;
  currentTriageEncounterId = activeEncounter?.encounterId || null;
  currentClient = client;
  if (activeEncounter.status === 'Re-check due') {
    return triageQuickRecheck(activeEncounter, c);
  }
  if (activeEncounter.status !== 'In triage') {
    activeEncounter.status = 'In triage';
  }
  if (!activeEncounter.triageStartedAt) {
    activeEncounter.triageStartedAt = new Date().toISOString();
    saveTriageEncounters();
  }
  return `
    ${renderClientBanner({ ...c, status: activeEncounter.status })}
    <div class="triage-encounter-layout">
      ${renderTriageEncounterContext(activeEncounter, c)}
      <main class="triage-encounter-main">
        <div class="triage-encounter-heading">
          <div>
            <h1 class="page-title">Initial triage</h1>

          <button class="btn ghost" type="button" onclick="showTriageWorklist()">Back to queue</button>
        </div>
        ${registrationStorageIssue ? `<div class="callout" role="status">${escapeHTML(registrationStorageIssue)}</div>` : ''}
        ${activeEncounter.isDemo ? '<div class="callout" role="note"><strong>DEMO ONLY:</strong> This is a fictional training case. Do not use it to make or record clinical decisions for a real person.</div>' : ''}
        <div class="callout triage-live-summary" id="triage-live-summary" data-priority="pending" role="status" aria-live="polite">
          <div>
            <div class="triage-live-summary-title">Live safety summary <span id="sys-rec">Screen in progress</span></div>
            <p id="rec-reasons">Complete the immediate safety and urgent medical questions. Unanswered items are not treated as negative findings.</p>
          </div>
        </div>

        <form id="triage-form" onsubmit="return false;">

        <div class="card" style="margin-bottom: 16px;">
          <div class="card-header">Section A — Automatic Information (retrieved, not re-asked)</div>
          <div class="card-body">
            <div class="fieldgrid">
              <div class="field"><label>Client identity / temporary ID</label><input type="text" value="${escapeHTML(c.name)} — ${escapeHTML(c.identityLabel || 'Identity record')} — ${escapeHTML(c.citramacId)} (${escapeHTML(c.id)})" readonly></div>
              ${c.identityStatus && c.identityStatus !== 'identified' ? `<div class="field"><label>Identity / distinguishing description</label><input type="text" value="${escapeHTML(c.identityDescription || 'Not yet known')}" readonly></div>` : ''}
              <div class="field"><label>DOB / Age / Sex</label><input type="text" value="${escapeHTML(c.dob || 'Not recorded')} · ${escapeHTML(c.age ?? 'Unknown')} yrs · ${escapeHTML(c.sex || 'Unknown')}" readonly></div>
              <div class="field"><label>Contact details</label><input type="text" value="${escapeHTML(c.phone || 'Not recorded')}" readonly></div>

              <div class="field"><label>Allergy status</label>

function triageQuickRecheck(encounter, client) {
  const draft = encounter.recheckDraft || {};

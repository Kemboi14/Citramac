name: CI

# Phase 0 skeleton per docs/11-ROADMAP-AND-PHASES.md — lint + test on every PR,
# no deploy yet. build-and-scan.yml / deploy-*.yml / terraform-*.yml are added
# in Phase 8 per docs/12-DEVOPS-DEPLOYMENT.md §12.5.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: citramac
          POSTGRES_USER: citramac
          POSTGRES_PASSWORD: citramac # pragma: allowlist secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U citramac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-test-key-not-secret # pragma: allowlist secret
      DATABASE_URL: postgres://citramac:citramac@localhost:5432/citramac
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt

      - run: pip install -r requirements/dev.txt

      - name: Lint (black, isort, ruff)
        run: |
          black --check .
          isort --check-only .
          ruff check .

      - name: SAST (bandit)
        run: bandit -q -r apps config -x "*/migrations/*"

      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit -r requirements/base.txt -r requirements/production.txt

      - name: Django system checks
        run: python manage.py check

      - name: Migrations check (no missing migrations)
        run: python manage.py makemigrations --check --dry-run

      - name: Tests (coverage)
        run: pytest --cov=apps --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high || true # advisory only until Phase 7 hardening pass

      - name: Type-check + build
        run: npm run build

      - name: Unit tests
        run: npx vitest run

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install detect-secrets==1.5.0
      - name: Verify no new secrets vs. baseline
        run: |
          detect-secrets scan --baseline .secrets.baseline --exclude-lines "citramac:citramac"
          git diff --exit-code .secrets.baseline

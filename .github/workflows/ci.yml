name: CI

# Lint + test on every PR and on every push to master. Phase 8 adds the
# deploy pipeline (build-and-scan.yml, deploy-*.yml, terraform-*.yml) per
# docs/12-DEVOPS-DEPLOYMENT.md §12.5 (removed 2026-10-21; `git show f80b45b:docs/12-DEVOPS-DEPLOYMENT.md`), gated on this workflow passing.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: citramac
          POSTGRES_USER: citramac
          POSTGRES_PASSWORD: citramac # pragma: allowlist secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U citramac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # dev settings for manage.py steps; every pytest step passes
      # --ds=config.settings.test (eager Celery, locmem email), because this
      # env var would otherwise override pytest.ini.
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-test-key-not-secret # pragma: allowlist secret
      # Tests connect as a NON-superuser, like production (citramac_app): Postgres
      # superusers bypass row-level security, so the tenant-isolation tests
      # silently passed nothing while CI ran as the container's superuser.
      DATABASE_URL: postgres://citramac_app:citramac@localhost:5432/citramac # pragma: allowlist secret
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt

      - name: System libraries for WeasyPrint (document PDFs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 \
            libharfbuzz-subset0 fonts-liberation fonts-dejavu-core

      - run: pip install -r requirements/dev.txt

      - name: Create the non-superuser app role (RLS applies to it)
        env:
          PGPASSWORD: citramac # pragma: allowlist secret
        run: |
          psql -h localhost -U citramac -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE citramac_app LOGIN PASSWORD 'citramac' NOSUPERUSER NOBYPASSRLS CREATEDB" \
            -c "ALTER DATABASE citramac OWNER TO citramac_app"
          psql -h localhost -U citramac -d citramac -v ON_ERROR_STOP=1 -c "ALTER SCHEMA public OWNER TO citramac_app"

      # Formatting is applied, not just checked: a push that only needs
      # reformatting still gets its tests run (on the formatted code), and the
      # autoformat job below commits the result. `ruff check --fix` applies
      # ruff's safe fixes and still fails on anything it cannot fix, so real
      # lint errors block the build as before.
      - name: Format and lint (isort, black, ruff)
        run: |
          isort .
          black .
          ruff check --fix .

      - name: SAST (bandit)
        run: bandit -q -r apps config -x "*/migrations/*,*/tests.py,*/test_*.py"

      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit -r requirements/base.txt -r requirements/production.txt

      - name: Django system checks
        run: python manage.py check

      - name: Migrations check (no missing migrations)
        run: python manage.py makemigrations --check --dry-run

      - name: Tenant-isolation negative-path tests (cannot be skipped)
        run: pytest --ds=config.settings.test apps/tenancy/tests.py -v

      - name: FHIR R4 4.0.1 conformance validator (guide.md — cannot be skipped)
        run: pytest --ds=config.settings.test apps/dha_interop/tests.py apps/dha_interop/test_hie.py apps/care_pathway/test_fhir_examples.py apps/care_pathway/test_registration_hie.py apps/sysadmin_audit/tests.py apps/mhp_program/test_nacada.py apps/dha_interop/test_icd11.py apps/care_pathway/test_clinical_report.py apps/care_pathway/test_psychotherapy_fhir.py apps/care_pathway/test_group_fhir.py apps/documents/test_consent_signatures.py -k FhirR4Conformance -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Rung 4 (guide.md §2): HL7's own validator checks every published
      # example (SHR ones against the vendored Kenya Core IG,
      # apps/dha_interop/fhir_validation/kenya_core/; the rest against base R4,
      # bundle invariants and reference resolution included; the psychotherapy
      # note against our own profiles in apps/care_pathway/fhir_profiles/). The jar is pinned
      # by version and checksum; scripts/hl7_validator_gate.py fails on any error.
      - name: Kenya Core IG validation — HL7 FHIR validator (cannot be skipped)
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o /tmp/validator_cli.jar https://github.com/hapifhir/org.hl7.fhir.core/releases/download/6.10.4/validator_cli.jar
          echo "1106b9d58f9e363e47bea7c4fc065841e5fc91fe9d062775c3bfdd212bd653cc  /tmp/validator_cli.jar" | sha256sum -c -
          java -jar /tmp/validator_cli.jar -version 4.0.1 \
            -ig apps/dha_interop/fhir_validation/kenya_core/ke.fhir.core-1.0.0.tgz \
            -ig apps/care_pathway/fhir_profiles \
            apps/*/fhir_examples/*.json -output /tmp/shr-outcome.json
          python scripts/hl7_validator_gate.py /tmp/shr-outcome.json

      - name: Tests (coverage)
        run: pytest --ds=config.settings.test --cov=apps --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Applied, not just checked (see the backend job); the autoformat job
      # commits the result.
      - name: Format (prettier)
        run: npm run format

      - name: Lint (eslint)
        run: npm run lint

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

      - name: Type-check + build
        run: npm run build

      - name: Unit tests
        run: npx vitest run

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install detect-secrets==1.5.0
      - name: Verify no new secrets vs. baseline
        run: |
          cp .secrets.baseline /tmp/committed-baseline.json
          detect-secrets scan --baseline .secrets.baseline --exclude-lines "citramac:citramac"
          python backend/scripts/secrets_baseline_gate.py /tmp/committed-baseline.json .secrets.baseline

  # After a green push to master, commit the formatting CI applied above, so
  # master itself stays formatted without anyone having to run the formatters.
  # Pushed with GITHUB_TOKEN, which does not start another workflow run (no
  # loop). The servers deploy the green commit this job formatted: identical
  # code, formatting aside. Nothing to format, or master moved in a way the
  # commit no longer applies to, and it does nothing; the next push catches up.
  autoformat:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend, frontend, secrets-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Apply the pinned formatters
        run: |
          pip install $(grep -hiE '^(black|isort|ruff)==' backend/requirements/dev.txt)
          (cd backend && isort . && black . && ruff check --fix .)
          (cd frontend && npm ci && npm run format)

      - name: Commit and push the formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Auto-format ${GITHUB_SHA::7} (isort, black, ruff, prettier)"
          git fetch -q origin master
          if ! git rebase -q origin/master; then
            git rebase --abort
            echo "::warning::master moved and the formatting no longer applies; the next push will format it."
            exit 0
          fi
          git push origin HEAD:master

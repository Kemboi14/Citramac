name: CI

# Lint + test on every PR and on every push to master. Phase 8 adds the
# deploy pipeline (build-and-scan.yml, deploy-*.yml, terraform-*.yml) per
# docs/12-DEVOPS-DEPLOYMENT.md §12.5, gated on this workflow passing.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: citramac
          POSTGRES_USER: citramac
          POSTGRES_PASSWORD: citramac # pragma: allowlist secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U citramac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-test-key-not-secret # pragma: allowlist secret
      DATABASE_URL: postgres://citramac:citramac@localhost:5432/citramac
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt

      - run: pip install -r requirements/dev.txt

      - name: Lint (black, isort, ruff)
        run: |
          black --check .
          isort --check-only .
          ruff check .

      - name: SAST (bandit)
        run: bandit -q -r apps config -x "*/migrations/*,*/tests.py"

      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit -r requirements/base.txt -r requirements/production.txt

      - name: Django system checks
        run: python manage.py check

      - name: Migrations check (no missing migrations)
        run: python manage.py makemigrations --check --dry-run

      - name: Tenant-isolation negative-path tests (cannot be skipped)
        run: pytest apps/tenancy/tests.py -v

      - name: FHIR R4 4.0.1 conformance validator (CLAUDE.md — cannot be skipped)
        run: pytest apps/dha_interop/tests.py apps/dha_interop/test_hie.py apps/care_pathway/test_fhir_examples.py apps/care_pathway/test_registration_hie.py apps/sysadmin_audit/tests.py -k FhirR4Conformance -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Rung 4 (CLAUDE.md §2): HL7's own validator checks the published Shared
      # Health Record examples against the vendored Kenya Core IG
      # (apps/dha_interop/fhir_validation/kenya_core/). The jar is pinned by
      # version and checksum; scripts/hl7_validator_gate.py fails on any error.
      - name: Kenya Core IG validation — HL7 FHIR validator (cannot be skipped)
        run: |
          curl -fsSL -o /tmp/validator_cli.jar https://github.com/hapifhir/org.hl7.fhir.core/releases/download/6.10.4/validator_cli.jar
          echo "1106b9d58f9e363e47bea7c4fc065841e5fc91fe9d062775c3bfdd212bd653cc  /tmp/validator_cli.jar" | sha256sum -c -
          java -jar /tmp/validator_cli.jar -version 4.0.1 \
            -ig apps/dha_interop/fhir_validation/kenya_core/ke.fhir.core-1.0.0.tgz \
            apps/dha_interop/fhir_examples/shr-*.json -output /tmp/shr-outcome.json
          python scripts/hl7_validator_gate.py /tmp/shr-outcome.json

      - name: Tests (coverage)
        run: pytest --cov=apps --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

      - name: Type-check + build
        run: npm run build

      - name: Unit tests
        run: npx vitest run

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install detect-secrets==1.5.0
      - name: Verify no new secrets vs. baseline
        run: |
          detect-secrets scan --baseline .secrets.baseline --exclude-lines "citramac:citramac"
          git diff --exit-code .secrets.baseline

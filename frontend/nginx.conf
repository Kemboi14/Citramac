server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # Every docker build fully replaces dist/ - a hashed chunk filename from
    # a previous build no longer exists on disk after the next deploy. With
    # no Cache-Control at all, a browser holding a stale cached index.html
    # (from before a deploy) keeps referencing those now-gone filenames.
    # For a route-level React.lazy chunk, that fetch failing only breaks
    # that one screen when a user navigates to it - not the whole app, and
    # not visible from a fresh curl/rebuild check, which is exactly the kind
    # of "some users report a broken screen, can't reproduce it" bug this
    # causes. index.html must always revalidate; the hashed asset files
    # (immutable per build) are safe to cache indefinitely.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

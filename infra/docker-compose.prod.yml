name: citramac

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citramac}
      POSTGRES_USER: ${POSTGRES_USER:-citramac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citramac}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      args:
        REQUIREMENTS_FILE: requirements/production.txt
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    volumes:
      - ${CITRAMAC_STATIC_DIR:-/opt/citramac/staticfiles}:/app/staticfiles
      - ${CITRAMAC_MEDIA_DIR:-/opt/citramac/mediafiles}:/app/mediafiles
    ports: ["127.0.0.1:8011:8000"]
    env_file: ${CITRAMAC_ENV_FILE:-../.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-citramac}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-citramac}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ../backend
      args:
        REQUIREMENTS_FILE: requirements/production.txt
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file: ${CITRAMAC_ENV_FILE:-../.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-citramac}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-citramac}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ../backend
      args:
        REQUIREMENTS_FILE: requirements/production.txt
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file: ${CITRAMAC_ENV_FILE:-../.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-citramac}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-citramac}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL must be set}
    restart: unless-stopped
    ports: ["127.0.0.1:8010:80"]
    depends_on: [backend]

volumes:
  pgdata:

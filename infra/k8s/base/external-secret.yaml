# Syncs the backend's runtime secrets (DATABASE_URL, DJANGO_SECRET_KEY,
# REDIS_URL, SHA_GATEWAY_*, HIE_*, etc.) from AWS Secrets Manager into a
# regular Secret the Deployments consume via envFrom.secretRef — never
# committed inline (docs/09-SECURITY-COMPLIANCE.md §9.1, docs/12-DEVOPS-DEPLOYMENT.md
# §12.3). Requires the External Secrets Operator installed cluster-wide
# (not managed by this Kustomize tree) and a SecretStore named
# `aws-secrets-manager` provisioned alongside it (IRSA-bound service
# account with read access scoped to this environment's secret prefix —
# see infra/terraform/modules/eks).
#
# `remoteRef.key` is patched per environment in overlays/*/kustomization.yaml
# to point at that environment's secret path
# (e.g. citramac/dev/backend, citramac/production/backend).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: citramac-backend-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: citramac-backend-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: citramac/dev/backend

apiVersion: apps/v1
kind: Deployment
metadata:
  name: citramac-backend
  labels:
    app: citramac-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: citramac-backend
  template:
    metadata:
      labels:
        app: citramac-backend
    spec:
      containers:
        - name: backend
          image: citramac-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: citramac-backend-config
            - secretRef:
                name: citramac-backend-secrets
          # /healthz checks DB connectivity (backend/config/urls.py) — Redis
          # connectivity is exercised by celery-worker's own probe instead,
          # so a backend pod isn't marked unhealthy by a broker blip it
          # doesn't itself depend on for serving HTTP requests.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"

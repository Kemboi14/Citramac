apiVersion: apps/v1
kind: Deployment
metadata:
  name: citramac-backend
  labels:
    app: citramac-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: citramac-backend
  template:
    metadata:
      labels:
        app: citramac-backend
    spec:
      containers:
        - name: backend
          image: citramac-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: citramac-backend-config
            - secretRef:
                name: citramac-backend-secrets
          # /healthz checks DB connectivity (backend/config/urls.py) — Redis
          # connectivity is exercised by celery-worker's own probe instead,
          # so a backend pod isn't marked unhealthy by a broker blip it
          # doesn't itself depend on for serving HTTP requests.
          # kubelet sends probes straight to the pod IP, never through the
          # Service/Ingress — DJANGO_ALLOWED_HOSTS only ever contains the
          # real public hostname, so an unpatched Host header gets rejected
          # with 400 (DisallowedHost). "localhost" is unconditionally in
          # ALLOWED_HOSTS (config/settings/base.py) specifically for this.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"

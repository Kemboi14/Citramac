# Same ExternalSecrets Operator pattern as infra/k8s/base/external-secret.yaml
# — Grafana's admin password comes from AWS Secrets Manager
# (citramac/{env}/monitoring, composed in infra/terraform/envs/*/main.tf's
# random_password.grafana_admin_password), never a hardcoded default.
# `remoteRef.key`/env are patched per environment in overlays/*/kustomization.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: citramac/dev/monitoring

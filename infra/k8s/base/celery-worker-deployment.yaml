# Same image as citramac-backend, different command — a separate Deployment
# so it scales independently of HTTP traffic (docs/02-TECH-STACK-AND-ARCHITECTURE.md
# §2.2, docs/12-DEVOPS-DEPLOYMENT.md §12.3: "never combined").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: citramac-celery-worker
  labels:
    app: citramac-celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: citramac-celery-worker
  template:
    metadata:
      labels:
        app: citramac-celery-worker
    spec:
      containers:
        - name: celery-worker
          image: citramac-backend:latest
          command: ["celery", "-A", "config", "worker", "-l", "info"]
          envFrom:
            - configMapRef:
                name: citramac-backend-config
            - secretRef:
                name: citramac-backend-secrets
          # No liveness probe: `celery inspect ping` round-trips through the
          # Redis broker, and that round-trip proved unreliable enough in
          # practice (occasional timeouts under normal load, unrelated to
          # the worker actually being healthy) to cause more outages than
          # it prevented — kubelet kept killing a working worker mid-task.
          # A crashed/hung worker process still gets caught the ordinary
          # way: the container exits and kubelet restarts it, no probe
          # needed for that case.
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"

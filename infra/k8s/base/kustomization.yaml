apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - celery-worker-deployment.yaml
  - celery-beat-deployment.yaml
  - ingress.yaml
  - hpa-backend.yaml
  - hpa-frontend.yaml
